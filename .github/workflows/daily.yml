name: 盤後選股更新
on:
  schedule:
    # 15:30 台北 = 07:30 UTC：行情/指數/ETF/模組/每日焦點（不含法人、資券）
    - cron: '30 7 * * 1-5'
    # 17:30 台北 = 09:30 UTC：三大法人個股買賣超（16–17 點公布）補齊
    - cron: '30 9 * * 1-5'
    # 22:00 台北 = 14:00 UTC：融資融券（資券，21:30 後公布）補齊
    - cron: '0 14 * * 1-5'
    # 週六 06:30 台北 = 週五 22:30 UTC：集保戶股權分散表（週六凌晨更新）
    - cron: '30 22 * * 5'
  workflow_dispatch:
    inputs:
      fetch_days:
        description: '行情抓取天數 (每日5, 首次回補用365)'
        default: '5'
      rev_months:
        description: '營收抓取月數 (每日2, 回補用12)'
        default: '2'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -X utf8 -u update.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
          FETCH_DAYS: ${{ github.event.inputs.fetch_days || '5' }}
          REV_MONTHS: ${{ github.event.inputs.rev_months || '2' }}
