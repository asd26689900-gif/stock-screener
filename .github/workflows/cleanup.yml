name: 資料整理稽核（錯誤列/空間）
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '刪除明確錯誤列 (true/false)'
        default: 'false'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -X utf8 -u cleanup.py ${{ github.event.inputs.apply == 'true' && '--apply' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
