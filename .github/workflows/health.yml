name: 資料新鮮度檢查
on:
  schedule:
    # 週一~五 16:45 台北 = 08:45 UTC（15:30 盤後更新完成後檢查）
    - cron: '45 8 * * 1-5'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -X utf8 -u health.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
