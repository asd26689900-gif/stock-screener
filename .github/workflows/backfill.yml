name: 回填K線歷史資料
on:
  workflow_dispatch:
    inputs:
      months:
        description: '回填幾個月'
        default: '3'
      offset:
        description: '從第幾檔開始'
        default: '0'
      limit:
        description: '最多處理幾檔'
        default: '600'
      extend:
        description: '延伸模式(往更早回填)'
        type: boolean
        default: false
      rev_backfill:
        description: '補月營收歷史(histock 12個月)'
        type: boolean
        default: false
  schedule:
    # 歷史已回填至 2016（10+ 年），改每週一次補新上市股歷史即可（原每 2 小時已到底空轉）
    # 週一 04:00 台北 = 週日 20:00 UTC
    - cron: '0 20 * * 0'
  push:
    paths:
      - '.github/backfill-trigger'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      matrix:
        batch: [0, 600, 1200, 1800]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 回填 (排程=延伸, 手動=一般或延伸)
        run: |
          EXTEND_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            EXTEND_FLAG="--extend"
          elif [ "${{ github.event.inputs.extend }}" = "true" ]; then
            EXTEND_FLAG="--extend"
          fi
          REV_FLAG=""
          if [ "${{ github.event.inputs.rev_backfill }}" = "true" ]; then
            REV_FLAG="--revenue"
          fi
          python -X utf8 backfill.py $EXTEND_FLAG $REV_FLAG --months ${{ github.event.inputs.months || '6' }} --offset ${{ matrix.batch }} --limit 600
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL_SLEEP: "1.5"
