name: 回填K線歷史資料
on:
  workflow_dispatch:
    inputs:
      months:
        description: '回填幾個月'
        default: '3'
      offset:
        description: '從第幾檔開始'
        default: '0'
      limit:
        description: '最多處理幾檔'
        default: '600'
      extend:
        description: '延伸模式(往更早回填)'
        type: boolean
        default: false
  schedule:
    # 每半天自動往回延伸 3 個月
    - cron: '0 2 * * *'   # UTC 02:00 = 台北 10:00
    - cron: '0 14 * * *'  # UTC 14:00 = 台北 22:00
  push:
    paths:
      - '.github/backfill-trigger'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      matrix:
        batch: [0, 600, 1200, 1800]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 回填 (排程=延伸, 手動=一般或延伸)
        run: |
          EXTEND_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            EXTEND_FLAG="--extend"
          elif [ "${{ github.event.inputs.extend }}" = "true" ]; then
            EXTEND_FLAG="--extend"
          fi
          python -X utf8 backfill.py $EXTEND_FLAG --months ${{ github.event.inputs.months || '3' }} --offset ${{ matrix.batch }} --limit 600
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
