name: 處置預警＋重大資訊更新
on:
  schedule:
    # 處置公告約 18:00 發布 → 19:00 台北 = 11:00 UTC
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  extra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -X utf8 -u update_extra.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
