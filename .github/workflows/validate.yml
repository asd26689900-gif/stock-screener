name: 資料正確性稽核（對 Yahoo）
on:
  workflow_dispatch:
    inputs:
      sample:
        description: '抽樣檔數 (0=全市場，慢)'
        default: '60'
      tol:
        description: '容許偏差 %'
        default: '1.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -X utf8 -u validate.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SAMPLE: ${{ github.event.inputs.sample || '60' }}
          TOL: ${{ github.event.inputs.tol || '1.0' }}
          PYTHONUNBUFFERED: "1"
