<div class="container">
  <div class="page-header">
    <h1 class="page-title">市場總覽</h1>
    <p class="page-desc">大盤走勢、每日焦點與新聞晨報，每日盤後自動更新。</p>
  </div>

  <!-- 大盤：指數卡片 + K棒 -->
  <div class="mkt-cards" id="mktCards"></div>
  <div class="chart-box">
    <div class="chart-toolbar">
      <span class="chart-label">大盤走勢</span>
      <span class="twii-note" style="margin-left:auto">Yahoo Finance 延遲約 15 分</span>
    </div>
    <div class="slider-tabs" id="twiiTabs">
      <button class="slider-tab active" data-tf="5m" onclick="switchTwii('5m')">5分</button>
      <button class="slider-tab" data-tf="60m" onclick="switchTwii('60m')">60分</button>
      <button class="slider-tab" data-tf="1d" onclick="switchTwii('1d')">日</button>
    </div>
    <div class="ohlcv-legend" id="twiiLegend"></div>
    <div class="twii-canvas"><canvas id="twiiCanvas"></canvas></div>
  </div>

  <!-- 每日焦點 -->
  <div class="section-title">每日焦點</div>
  <div id="focusBox"><div class="loading">載入焦點中...</div></div>

  <!-- 新聞晨報 -->
  <div class="section-title">新聞晨報</div>
  <div id="newsBox"><div class="loading">載入新聞中...</div></div>

<script>
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(v){ return fmtVal(v); }
function isEtfId(sid){ return /^(00|010)/.test(String(sid||'')); }

/* ── 大盤：指數卡片 + K棒 ── */
async function loadMarket(){
  const box=document.getElementById('mktCards');
  try{
    const now=new Date();
    const ym=String(now.getFullYear())+String(now.getMonth()+1).padStart(2,'0');
    const r=await fetch('/api/twse-proxy?type=index_daily&date='+ym);
    const j=await r.json();
    if(j.stat!=='OK'||!j.data||!j.data.length) throw new Error('no index');
    const last=j.data[j.data.length-1];
    const idx=parseFloat(String(last[4]||'0').replace(/,/g,''));
    const chg=parseFloat(String(last[5]||'0').replace(/,/g,''));
    const amt=parseFloat(String(last[2]||'0').replace(/,/g,''));
    const d=String(last[0]||'');
    const dp=d.split('/');
    const dateStr=dp.length===3?(parseInt(dp[0])+1911)+'/'+dp[1]+'/'+dp[2]:d;
    const chgPct=idx-chg!==0?fmtPct(chg/(idx-chg)*100,2):'—';
    box.innerHTML=`
      <div class="summary-card"><div class="summary-label">加權指數</div><div class="summary-val ${pctClass(chg)}">${fmtVal(idx)}</div><div class="summary-sub">${dateStr}</div></div>
      <div class="summary-card"><div class="summary-label">漲跌點數</div><div class="summary-val ${pctClass(chg)}">${chg>0?'+':''}${fmtVal(chg)}</div><div class="summary-sub">${chgPct}</div></div>
      <div class="summary-card"><div class="summary-label">成交金額</div><div class="summary-val">${fmtVal(Math.round(amt/1e8))}<span class="unit">億</span></div><div class="summary-sub">加權指數每日收盤</div></div>`;
  }catch(e){
    box.innerHTML='<div class="empty-msg">大盤資料載入失敗</div>';
  }
}

let twiiTF='5m', twiiCache={};
async function loadTwii(tf){
  const key=tf;
  if(twiiCache[key]) return twiiCache[key];
  const range=tf==='5m'?'1d':tf==='60m'?'1mo':'6mo';
  try{
    const r=await fetch('/api/chart?sid=%5ETWII&interval='+tf+'&range='+range);
    const j=await r.json();
    twiiCache[key]=(j.bars||[]).filter(b=>b.c!=null);
  }catch(e){ twiiCache[key]=[]; }
  return twiiCache[key];
}
function drawTwii(bars){
  const canvas=document.getElementById('twiiCanvas');
  if(!canvas) return;
  const wrap=canvas.parentElement;
  const W=wrap.clientWidth||800, H=260, dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(bars.length<2){
    ctx.fillStyle='var(--text-secondary)'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('暫無資料', W/2, H/2);
    return;
  }
  const cs=getComputedStyle(document.documentElement);
  const cUp=cs.getPropertyValue('--red').trim()||'#B24A45';
  const cDn=cs.getPropertyValue('--green').trim()||'#3A7357';
  const cGrid=cs.getPropertyValue('--border-light').trim()||'#EBE7E0';
  const cText=cs.getPropertyValue('--text-secondary').trim()||'#5F6672';
  const padL=54, padR=12, padT=14, padB=24;
  const prices=bars.flatMap(b=>[b.h??b.c, b.l??b.c]);
  const pMin=Math.min(...prices), pMax=Math.max(...prices);
  const pm=(pMax-pMin)*0.05||1;
  const lo=pMin-pm, hi=pMax+pm;
  const y=v=>padT+(1-(v-lo)/(hi-lo))*(H-padT-padB);
  const plotW=W-padL-padR;
  const cw=plotW/bars.length;
  ctx.font='10px monospace'; ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const pv=lo+(hi-lo)*i/4, yy=y(pv);
    ctx.strokeStyle=cGrid; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(W-padR,yy); ctx.stroke();
    ctx.fillStyle=cText;
    ctx.fillText(pv>=100?pv.toFixed(0):pv.toFixed(1), padL-4, yy+3);
  }
  // K棒
  const bw2=Math.max(1, Math.min(9, cw*0.35));
  bars.forEach((b,i)=>{
    const o=b.o??b.c, h=b.h??b.c, l=b.l??b.c, c=b.c;
    const up=c>=o;
    const color=up?cUp:cDn;
    const x0=padL+i*cw+cw/2;
    ctx.strokeStyle=color; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x0,y(h)); ctx.lineTo(x0,y(l)); ctx.stroke();
    const top=y(Math.max(o,c)), bot=y(Math.min(o,c));
    const bh=Math.max(bot-top,1);
    if(up){
      ctx.strokeStyle=color;
      ctx.strokeRect(x0-bw2,top,bw2*2,bh);
    }else{
      ctx.fillStyle=color;
      ctx.fillRect(x0-bw2,top,bw2*2,bh);
    }
  });
  // 最新價虛線 + 標籤
  const last=bars[bars.length-1];
  const lc=last.c;
  const prevC=bars.length>1?bars[bars.length-2].c:lc;
  const up=lc>=prevC;
  const col=up?cUp:cDn;
  const ly=y(lc);
  ctx.strokeStyle=col; ctx.globalAlpha=0.65; ctx.lineWidth=0.8; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(padL,ly); ctx.lineTo(W-padR,ly); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;
  ctx.fillStyle=col; ctx.font='700 13px monospace'; ctx.textAlign='right';
  ctx.fillText(lc.toFixed(2), W-padR-2, ly-5);
  const legend=document.getElementById('twiiLegend');
  if(legend) legend.innerHTML=`<span>加權指數</span><span>開 <b>${last.o.toFixed(2)}</b></span><span>高 <b class="${pctClass(last.h-last.o)}">${last.h.toFixed(2)}</b></span><span>低 <b class="${pctClass(last.l-last.o)}">${last.l.toFixed(2)}</b></span><span>收 <b>${lc.toFixed(2)}</b></span><span class="${up?'up':'dn'}">${prevC?fmtPct((lc-prevC)/prevC*100,2):'—'}</span>`;
}
async function switchTwii(tf){
  twiiTF=tf;
  document.querySelectorAll('#twiiTabs .slider-tab').forEach(b=>b.classList.toggle('active',b.dataset.tf===tf));
  sliderTabs(document.getElementById('twiiTabs'));
  const bars=await loadTwii(tf);
  drawTwii(bars);
}

/* ── 每日焦點 ── */
let focusData=null, strongTF='week', instTF='foreign', instShowEtf=true;

function miniTable(headers, rows, linkCol=0){
  if(!rows||!rows.length) return '<div class="empty-msg" style="padding:18px">尚無資料</div>';
  return `<div class="scroll-table"><div class="table-wrap"><table><thead><tr>${headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${
    rows.map(r=>'<tr onclick="location.href=\'stk.html#'+r[linkCol]+'\'">'+r.map((v,i)=>{
      if(i===0) return '<td>'+esc(v)+'</td>';
      if(i===1) return '<td>'+esc(v)+'</td>';
      return '<td class="'+pctClass(v)+'">'+fmt(v)+'</td>';
    }).join('')+'</tr>').join('')}
  </tbody></table></div></div>`;
}
function focusCard(title, body, extra){
  return `<div class="focus-card"><div class="focus-head"><span>${title}</span>${extra||''}</div>${body}</div>`;
}

function strongBody(){
  const s=focusData.strong||{};
  const rows=s[strongTF]||(strongTF==='week'?focusData.week_strong||[]:[]);
  return `<div class="slider-tabs" id="strongTabs">
    <button class="slider-tab ${strongTF==='day'?'active':''}" data-tf="day" onclick="switchStrong('day')">日</button>
    <button class="slider-tab ${strongTF==='week'?'active':''}" data-tf="week" onclick="switchStrong('week')">週</button>
    <button class="slider-tab ${strongTF==='month'?'active':''}" data-tf="month" onclick="switchStrong('month')">月</button>
  </div><div id="strongTable">${miniTable(['股號','名稱','收盤','漲幅%','成交張'], rows)}</div>`;
}
function switchStrong(tf){
  strongTF=tf;
  const s=focusData.strong||{};
  const rows=s[tf]||(tf==='week'?focusData.week_strong||[]:[]);
  document.getElementById('strongTable').innerHTML=miniTable(['股號','名稱','收盤','漲幅%','成交張'], rows);
  document.querySelectorAll('#strongTabs .slider-tab').forEach(b=>b.classList.toggle('active',b.dataset.tf===tf));
  sliderTabs(document.getElementById('strongTabs'));
}

const INST_COL={foreign:2, trust:3, dealer:4};
function instRows(inst){
  return (inst[instTF+'_top']||[]).filter(r=>instShowEtf||!isEtfId(r[0]));
}
function instTableHtml(inst){
  const rows=instRows(inst);
  if(!rows.length) return '<div class="empty-msg" style="padding:18px">尚無資料</div>';
  return `<div class="scroll-table"><div class="table-wrap"><table><thead><tr><th>#</th><th>股號</th><th>名稱</th><th>買超(張)</th></tr></thead><tbody>${
    rows.map((r,i)=>`<tr onclick="location.href='stk.html#${esc(r[0])}'"><td>${i+1}</td><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="up">+${fmt(r[INST_COL[instTF]])}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function instBody(){
  const inst=focusData.institutional||{};
  return `<div class="slider-tabs" id="instTabs">
    <button class="slider-tab ${instTF==='foreign'?'active':''}" data-k="foreign" onclick="switchInst('foreign')">外資買超（含自營）</button>
    <button class="slider-tab ${instTF==='trust'?'active':''}" data-k="trust" onclick="switchInst('trust')">投信買超</button>
    <button class="slider-tab ${instTF==='dealer'?'active':''}" data-k="dealer" onclick="switchInst('dealer')">自營買超</button>
  </div><div id="instTable">${instTableHtml(inst)}</div>
  <div class="inst-foot">外資 + 投信同日買超：<b class="up">${inst.both_buy??'—'} 檔</b></div>`;
}
function switchInst(k){ instTF=k; renderInst(); }
function toggleInstEtf(show){ instShowEtf=show; renderInst(); }
function renderInst(){
  document.getElementById('instTable').innerHTML=instTableHtml(focusData.institutional||{});
  document.querySelectorAll('#instTabs .slider-tab').forEach(b=>b.classList.toggle('active',b.dataset.k===instTF));
  sliderTabs(document.getElementById('instTabs'));
}

function renderFocus(f){
  const box=document.getElementById('focusBox');
  if(!f||!f.data){ box.innerHTML='<div class="empty-msg">今日焦點尚未產生（盤後更新）</div>'; return; }
  focusData=f.data;
  const d=focusData;
  const dateTag=`<span class="date-label">${esc(d.date||'')}</span>`;
  const cards=[];
  cards.push(focusCard('強勢股', strongBody(), dateTag));
  const bb=d.big_buyer;
  if(Array.isArray(bb)||(bb&&bb.fallback)){
    const rows=Array.isArray(bb)?bb:((bb&&bb.rows)||[]);
    cards.push(focusCard('大戶加碼股（法人近似）', miniTable(['股號','名稱','淨買超張','連買','收盤'], rows), dateTag));
  }else{
    const bbDate=bb&&bb.date?`<span class="date-label">集保 ${esc(bb.date)}</span>`:(dateTag);
    cards.push(focusCard('大戶加碼股（集保）', miniTable(['股號','名稱','收盤','大戶%','增減%'], (bb&&bb.rows)||[]), bbDate));
  }
  const inst=d.institutional||{};
  const instDate=inst.date?`<span class="date-label">${esc(inst.date)}</span>`:'';
  const instToggle=`<label class="focus-toggle"><input type="checkbox" id="instEtfToggle" ${instShowEtf?'checked':''} onchange="toggleInstEtf(this.checked)">顯示 ETF</label>`;
  cards.push(focusCard('三大法人', instBody(), instDate+instToggle));
  const etf=d.etf||{};
  const etfRows=(etf.active&&etf.active.length?etf.active:etf.top_amount||[]);
  const etfBody=miniTable(['代號','名稱','收盤','漲跌%','成交額(億)','法人買賣超'],
    etfRows.map(r=>[r[0],r[1]+(r[7]?' 主動':''),r[2],r[3],r[5],r[6]]),0)+
    `<div class="focus-foot"><a href="etf.html">查看 ETF 總覽 →</a><span>主動式 ${etf.active_count||0} 檔</span></div>`;
  cards.push(focusCard('ETF 動向', etfBody, dateTag));
  const mg=d.margin;
  const marginBody=mg&&mg.date
    ? `<div class="inst-cols">
        <div><div class="inst-label">融資增加</div><div class="scroll-table" style="max-height:320px">${(mg.m_up||[]).map(r=>`<div class="inst-row"><a href="stk.html#${esc(r.id)}">${esc(r.id)} ${esc(r.name)}</a><b class="up">+${fmt(r.m_today-r.m_prev)}</b></div>`).join('')||'<div class="empty-msg">—</div>'}</div></div>
        <div><div class="inst-label">融資減少</div><div class="scroll-table" style="max-height:320px">${(mg.m_dn||[]).map(r=>`<div class="inst-row"><a href="stk.html#${esc(r.id)}">${esc(r.id)} ${esc(r.name)}</a><b class="dn">${fmt(r.m_today-r.m_prev)}</b></div>`).join('')||'<div class="empty-msg">—</div>'}</div></div>
        <div><div class="inst-label">融券增加</div><div class="scroll-table" style="max-height:320px">${(mg.s_up||[]).map(r=>`<div class="inst-row"><a href="stk.html#${esc(r.id)}">${esc(r.id)} ${esc(r.name)}</a><b class="up">+${fmt(r.s_today-r.s_prev)}</b></div>`).join('')||'<div class="empty-msg">—</div>'}</div></div>
        <div><div class="inst-label">融券減少</div><div class="scroll-table" style="max-height:320px">${(mg.s_dn||[]).map(r=>`<div class="inst-row"><a href="stk.html#${esc(r.id)}">${esc(r.id)} ${esc(r.name)}</a><b class="dn">${fmt(r.s_today-r.s_prev)}</b></div>`).join('')||'<div class="empty-msg">—</div>'}</div></div>
      </div>`
    : '<div class="empty-msg">資券變化約 22:00 後公布</div>';
  cards.push(focusCard('資券變化', marginBody, mg&&mg.date?`<span class="date-label">${esc(mg.date)}</span>`:''));
  box.innerHTML=`<div class="focus-grid">${cards.join('')}</div>`;
  sliderTabs(document.getElementById('strongTabs'));
  sliderTabs(document.getElementById('instTabs'));
}
async function loadFocus(){
  if(!sb) return;
  const {data}=await sb.from('daily_focus').select('date,data').order('date',{ascending:false}).limit(1);
  renderFocus(data&&data[0]?data[0]:null);
}

/* ── 新聞晨報 ── */
async function loadNews(){
  const box=document.getElementById('newsBox');
  if(!sb){ box.innerHTML=''; return; }
  const {data}=await sb.from('daily_news').select('title,link,source,published_at,snippet').order('published_at',{ascending:false}).limit(10);
  if(!data||!data.length){ box.innerHTML='<div class="empty-msg">今日新聞尚未爬取（08:30 更新）</div>'; return; }
  box.innerHTML=`<div class="news-list">${data.map(n=>`
    <a class="news-item" href="${esc(n.link)}" target="_blank" rel="noopener">
      <span class="news-src">${esc(n.source||'新聞')}</span>
      <span class="news-title">${esc(n.title)}</span>
      <span class="news-time">${n.published_at?String(n.published_at).slice(11,16):''}</span>
    </a>`).join('')}</div>`;
}

let dataLoaded = false;
function onDataReady(){
  if(!dataLoaded){
    dataLoaded=true;
    loadFocus(); loadNews(); loadMarket(); loadTwii(twiiTF).then(drawTwii);
    sliderTabs(document.getElementById('twiiTabs'));
  }
}
</script>
