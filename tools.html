<style>
:root {
  --ink: #1C2127; --text: #3B3F45; --text-secondary: #6B7280;
  --surface: #F5F2EC; --card: #FFFFFF; --border: #DDD8D0; --border-light: #EBE7E0;
  --gold: #B8860B; --gold-soft: rgba(184,134,11,0.10);
  --teal: #3A7D7B; --teal-soft: rgba(58,125,123,0.08);
  --green: #4A8B6E; --red: #C0544F;
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --radius: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #E8E4DC; --text: #C8C4BC; --text-secondary: #8B8780;
    --surface: #141618; --card: #1E2024; --border: #2E3036; --border-light: #252830;
    --gold: #D4A840; --gold-soft: rgba(212,168,64,0.12);
    --teal: #5AADAB; --teal-soft: rgba(90,173,171,0.10);
    --green: #6BB88E; --red: #E07070;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  }
}
:root[data-theme="dark"] {
  --ink: #E8E4DC; --text: #C8C4BC; --text-secondary: #8B8780;
  --surface: #141618; --card: #1E2024; --border: #2E3036; --border-light: #252830;
  --gold: #D4A840; --gold-soft: rgba(212,168,64,0.12);
  --teal: #5AADAB; --teal-soft: rgba(90,173,171,0.10);
  --green: #6BB88E; --red: #E07070;
  --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow)}
.topbar .brand{font-family:var(--font-display);font-size:18px;color:var(--ink);letter-spacing:-0.02em;white-space:nowrap;text-decoration:none}
.topbar .brand span{color:var(--gold)}
.topbar .spacer{flex:1}
.nav-links{display:flex;gap:12px}
.nav-links a{font-size:13px;color:var(--text-secondary);text-decoration:none;padding:4px 8px;border-radius:var(--radius)}
.nav-links a:hover,.nav-links a.active{color:var(--gold);background:var(--gold-soft)}
.container{max-width:720px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:24px}
.page-title{font-family:var(--font-display);font-size:22px;color:var(--ink)}
.page-desc{font-size:13px;color:var(--text-secondary)}
.tool-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.tool-title{font-family:var(--font-display);font-size:17px;color:var(--ink);margin-bottom:12px}
.form-row{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.form-row label{font-size:13px;color:var(--text-secondary);min-width:90px}
.form-row input,.form-row select{font-family:var(--font-mono);font-size:14px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);width:140px}
.form-row input:focus{outline:none;border-color:var(--gold)}
.calc-btn{padding:8px 20px;background:var(--gold);color:#fff;border:none;border-radius:var(--radius);font-size:13px;cursor:pointer;margin-top:4px}
.calc-btn:hover{opacity:.9}
.result-box{margin-top:14px;padding:14px;background:var(--surface);border-radius:var(--radius);font-family:var(--font-mono);font-size:13px;line-height:1.8;display:none}
.result-box.show{display:block}
.result-box .big{font-size:22px;font-weight:700;margin:4px 0}
.up{color:var(--red)}.dn{color:var(--green)}
.footer{text-align:center;padding:32px 16px;font-size:12px;color:var(--text-secondary);line-height:1.8}
@media(max-width:640px){.topbar{padding:10px 12px;gap:8px}.form-row{flex-direction:column;align-items:flex-start}.form-row input{width:100%}.container{padding:16px 8px 60px}}
.nav-toggle{display:none;background:none;border:1px solid var(--border);border-radius:var(--radius);font-size:20px;padding:4px 10px;cursor:pointer;color:var(--text)}
@media(max-width:768px){.nav-toggle{display:block}.nav-links{display:none;width:100%;order:99}.nav-links.show{display:flex;flex-wrap:wrap}.topbar{flex-wrap:wrap}}
</style>

  <button class="nav-toggle" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('show')" aria-label="選單">☰</button>

    <a href="watchlist.html">★ 自選股</a>
  
  </div>
  <div class="spacer"></div>
  <div id="authArea"></div>
</div>

<div class="container">
  <div>
    <div class="page-title">🧮 股票計算機</div>
    <div class="page-desc">免費台股投資試算工具，算清楚每一筆交易。</div>
  </div>

  <!-- 報酬率計算機 -->
  <div class="tool-card">
    <div class="tool-title">💰 股票報酬率計算機</div>
    <div class="form-row"><label>買進價格</label><input type="number" id="r_buy" placeholder="100"></div>
    <div class="form-row"><label>賣出價格</label><input type="number" id="r_sell" placeholder="120"></div>
    <div class="form-row"><label>張數</label><input type="number" id="r_lots" value="1" min="1"></div>
    <div class="form-row"><label>手續費折扣</label>
      <select id="r_disc"><option value="1">無折扣</option><option value="0.6">6折</option><option value="0.5">5折</option><option value="0.38">3.8折</option><option value="0.28" selected>2.8折</option></select>
    </div>
    <div class="form-row"><label>當沖減稅</label>
      <select id="r_daytrade"><option value="0" selected>否</option><option value="1">是 (證交稅減半)</option></select>
    </div>
    <button class="calc-btn" onclick="calcReturn()">計算</button>
    <div class="result-box" id="r_result"></div>
  </div>

  <!-- 殖利率計算機 -->
  <div class="tool-card">
    <div class="tool-title">📈 殖利率 & 合理價計算機</div>
    <div class="form-row"><label>現金股利</label><input type="number" id="y_div" placeholder="5"></div>
    <div class="form-row"><label>目前股價</label><input type="number" id="y_price" placeholder="100"></div>
    <div class="form-row"><label>目標殖利率%</label><input type="number" id="y_target" value="5"></div>
    <button class="calc-btn" onclick="calcYield()">計算</button>
    <div class="result-box" id="y_result"></div>
  </div>

  <!-- 定期定額試算 -->
  <div class="tool-card">
    <div class="tool-title">🌱 定期定額複利試算</div>
    <div class="form-row"><label>每月投入</label><input type="number" id="d_monthly" value="10000"></div>
    <div class="form-row"><label>年化報酬率%</label><input type="number" id="d_rate" value="8"></div>
    <div class="form-row"><label>投資年數</label><input type="number" id="d_years" value="20"></div>
    <button class="calc-btn" onclick="calcDCA()">計算</button>
    <div class="result-box" id="d_result"></div>
  </div>
</div>

<div class="footer">盤後精選模組 — 本站僅整理公開資訊，不構成投資建議，亦非投顧服務。<br>⛰️ 每日自動更新：盤後 15:00（第一次）、22:00（第二次）</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
function fmt(v){return Math.round(v).toLocaleString('zh-TW');}

function calcReturn(){
  const buy=+document.getElementById('r_buy').value;
  const sell=+document.getElementById('r_sell').value;
  const lots=+document.getElementById('r_lots').value||1;
  const disc=+document.getElementById('r_disc').value;
  const daytrade=+document.getElementById('r_daytrade').value;
  if(!buy||!sell){alert('請填入買賣價格');return;}

  const shares=lots*1000;
  const buyAmt=buy*shares;
  const sellAmt=sell*shares;
  const feeRate=0.001425*disc;
  const buyFee=Math.max(Math.round(buyAmt*feeRate),1);
  const sellFee=Math.max(Math.round(sellAmt*feeRate),1);
  const taxRate=daytrade?0.0015:0.003;
  const tax=Math.round(sellAmt*taxRate);
  const totalCost=buyFee+sellFee+tax;
  const profit=sellAmt-buyAmt-totalCost;
  const roi=((profit/buyAmt)*100).toFixed(2);

  const el=document.getElementById('r_result');
  el.className='result-box show';
  el.innerHTML=`
    <div>買進金額：${fmt(buyAmt)} 元</div>
    <div>賣出金額：${fmt(sellAmt)} 元</div>
    <div>手續費(買)：${fmt(buyFee)} 元</div>
    <div>手續費(賣)：${fmt(sellFee)} 元</div>
    <div>證交稅：${fmt(tax)} 元${daytrade?' (當沖減半)':''}</div>
    <div>交易成本合計：${fmt(totalCost)} 元</div>
    <hr style="border:none;border-top:1px solid var(--border);margin:8px 0">
    <div>實際損益：<span class="big ${profit>=0?'up':'dn'}">${profit>=0?'+':''}${fmt(profit)} 元</span></div>
    <div>報酬率：<span class="${profit>=0?'up':'dn'}">${roi}%</span></div>`;
}

function calcYield(){
  const div=+document.getElementById('y_div').value;
  const price=+document.getElementById('y_price').value;
  const target=+document.getElementById('y_target').value;
  if(!div){alert('請填入現金股利');return;}

  const curYield=price?(div/price*100).toFixed(2):'—';
  const fairPrice=target?(div/(target/100)).toFixed(1):'—';
  const cheapPrice=target?(div/((target+1)/100)).toFixed(1):'—';
  const expPrice=target?(div/((target-1)/100)).toFixed(1):'—';

  const el=document.getElementById('y_result');
  el.className='result-box show';
  el.innerHTML=`
    ${price?`<div>目前殖利率：<span class="big">${curYield}%</span></div>`:''}
    <div>合理買進價（${target}%）：<span class="big">${fairPrice} 元</span></div>
    <div>便宜價（${+target+1}%）：${cheapPrice} 元</div>
    <div>昂貴價（${Math.max(+target-1,1)}%）：${expPrice} 元</div>`;
}

function calcDCA(){
  const monthly=+document.getElementById('d_monthly').value;
  const rate=+document.getElementById('d_rate').value;
  const years=+document.getElementById('d_years').value;
  if(!monthly||!years){alert('請填入金額和年數');return;}

  const r=rate/100/12;
  const n=years*12;
  const principal=monthly*n;
  let total;
  if(r===0){total=principal;}
  else{total=monthly*((Math.pow(1+r,n)-1)/r)*(1+r);}

  const profit=total-principal;
  const lines=[`<div>每月投入：${fmt(monthly)} 元</div>`,
    `<div>投入本金：${fmt(principal)} 元（${years}年）</div>`,
    `<div>累積資產：<span class="big up">${fmt(total)} 元</span></div>`,
    `<div>投資報酬：${fmt(profit)} 元（${(profit/principal*100).toFixed(0)}%）</div>`];

  // milestones
  const milestones=[5,10,15,20,25,30].filter(y=>y<=years);
  if(milestones.length>1){
    lines.push('<hr style="border:none;border-top:1px solid var(--border);margin:8px 0">');
    lines.push('<div style="font-size:12px;color:var(--text-secondary)">各年度累積：</div>');
    milestones.forEach(y=>{
      const nm=y*12;
      const t=r===0?monthly*nm:monthly*((Math.pow(1+r,nm)-1)/r)*(1+r);
      lines.push(`<div>${y}年：${fmt(t)} 元（本金 ${fmt(monthly*nm)}）</div>`);
    });
  }

  const el=document.getElementById('d_result');
  el.className='result-box show';
  el.innerHTML=lines.join('');
}
</script>
