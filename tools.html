<title>股票計算機 — 盤後精選模組</title>
<meta name="description" content="股票計算機：報酬率、殖利率與定期定額複利試算。">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
  /* tools.html 專屬 form 樣式 — 2-column grid + 對齊 label */
  .tool-card{padding:22px 26px;margin-bottom:18px}
  .tool-title{font-family:var(--font-display);font-size:17px;color:var(--ink);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:8px}
  .calc-form{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
  .calc-field{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
  .calc-field.full{grid-column:1/-1}
  .calc-field label{font-size:13px;color:var(--text);font-weight:500}
  .calc-field input,.calc-field select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-family:var(--font-mono);font-size:14px;transition:border-color .15s,box-shadow .15s}
  .calc-field input:focus,.calc-field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  .calc-field input::placeholder{color:var(--text-secondary);opacity:.55}
  .calc-btn{margin-top:18px;padding:10px 32px;background:var(--gold);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s}
  .calc-btn:hover{opacity:.9}.calc-btn:active{transform:translateY(1px)}
  .result-box{display:none;margin-top:18px;padding:16px 20px;background:var(--surface);border-left:3px solid var(--gold);border-radius:6px;font-family:var(--font-mono);font-size:13px;line-height:1.9}
  .result-box.show{display:block}
  .result-box .big{font-size:22px;font-weight:700;color:var(--gold);letter-spacing:-.01em}
  @media(max-width:640px){.tool-card{padding:18px 16px}.calc-form{grid-template-columns:1fr}.calc-field{grid-template-columns:100px 1fr}}
</style>
<div id="topbar"></div>

<div class="container">
  <div>
    <h1 class="page-title">股票計算機</h1>
    <div class="page-desc">免費台股投資試算工具，算清楚每一筆交易。</div>
  </div>

  <!-- 報酬率計算機 -->
  <div class="tool-card">
    <div class="tool-title">股票報酬率計算機</div>
    <div class="calc-form">
      <div class="calc-field"><label for="r_buy">買進價格</label><input type="number" id="r_buy" placeholder="100"></div>
      <div class="calc-field"><label for="r_sell">賣出價格</label><input type="number" id="r_sell" placeholder="120"></div>
      <div class="calc-field"><label for="r_lots">張數</label><input type="number" id="r_lots" value="1" min="1"></div>
      <div class="calc-field"><label for="r_disc">手續費折扣</label>
        <select id="r_disc"><option value="1">無折扣</option><option value="0.6">6折</option><option value="0.5">5折</option><option value="0.38">3.8折</option><option value="0.28" selected>2.8折</option></select>
      </div>
      <div class="calc-field full"><label for="r_daytrade">當沖減稅</label>
        <select id="r_daytrade"><option value="0" selected>否</option><option value="1">是（證交稅減半）</option></select>
      </div>
    </div>
    <button class="calc-btn" onclick="calcReturn()">計算</button>
    <div class="result-box" id="r_result"></div>
  </div>

  <!-- 殖利率計算機 -->
  <div class="tool-card">
    <div class="tool-title">殖利率 &amp; 合理價計算機</div>
    <div class="calc-form">
      <div class="calc-field"><label for="y_div">現金股利</label><input type="number" id="y_div" placeholder="5"></div>
      <div class="calc-field"><label for="y_price">目前股價</label><input type="number" id="y_price" placeholder="100"></div>
      <div class="calc-field full"><label for="y_target">目標殖利率%</label><input type="number" id="y_target" value="5"></div>
    </div>
    <button class="calc-btn" onclick="calcYield()">計算</button>
    <div class="result-box" id="y_result"></div>
  </div>

  <!-- 定期定額試算 -->
  <div class="tool-card">
    <div class="tool-title">定期定額複利試算</div>
    <div class="calc-form">
      <div class="calc-field"><label for="d_monthly">每月投入</label><input type="number" id="d_monthly" value="10000"></div>
      <div class="calc-field"><label for="d_rate">年化報酬率%</label><input type="number" id="d_rate" value="8"></div>
      <div class="calc-field full"><label for="d_years">投資年數</label><input type="number" id="d_years" value="20"></div>
    </div>
    <button class="calc-btn" onclick="calcDCA()">計算</button>
    <div class="result-box" id="d_result"></div>
  </div>
</div>

<div id="footer"></div>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/init.js"></script>
<script>
function fmt(v){ const n=pctNum(v); return n===null?'—':Math.round(n).toLocaleString('zh-TW'); }

function calcReturn(){
  const buy=+document.getElementById('r_buy').value;
  const sell=+document.getElementById('r_sell').value;
  const lots=+document.getElementById('r_lots').value||1;
  const disc=+document.getElementById('r_disc').value;
  const daytrade=+document.getElementById('r_daytrade').value;
  if(!buy||!sell){alert('請填入買賣價格');return;}

  const shares=lots*1000;
  const buyAmt=buy*shares;
  const sellAmt=sell*shares;
  const feeRate=0.001425*disc;
  const buyFee=Math.max(Math.round(buyAmt*feeRate),1);
  const sellFee=Math.max(Math.round(sellAmt*feeRate),1);
  const taxRate=daytrade?0.0015:0.003;
  const tax=Math.round(sellAmt*taxRate);
  const totalCost=buyFee+sellFee+tax;
  const profit=sellAmt-buyAmt-totalCost;
  const roi=((profit/buyAmt)*100).toFixed(2);

  const el=document.getElementById('r_result');
  el.className='result-box show';
  el.innerHTML=`
    <div>買進金額：${fmt(buyAmt)} 元</div>
    <div>賣出金額：${fmt(sellAmt)} 元</div>
    <div>手續費(買)：${fmt(buyFee)} 元</div>
    <div>手續費(賣)：${fmt(sellFee)} 元</div>
    <div>證交稅：${fmt(tax)} 元${daytrade?' (當沖減半)':''}</div>
    <div>交易成本合計：${fmt(totalCost)} 元</div>
    <hr style="border:none;border-top:1px solid var(--border);margin:8px 0">
    <div>實際損益：<span class="big ${pctClass(profit)}">${profit>0?'+':''}${fmt(profit)} 元</span></div>
    <div>報酬率：<span class="${pctClass(profit)}">${roi}%</span></div>`;
}

function calcYield(){
  const div=+document.getElementById('y_div').value;
  const price=+document.getElementById('y_price').value;
  const target=+document.getElementById('y_target').value;
  if(!div){alert('請填入現金股利');return;}

  const curYield=price?(div/price*100).toFixed(2):'—';
  const fairPrice=target?(div/(target/100)).toFixed(1):'—';
  const cheapPrice=target?(div/((target+1)/100)).toFixed(1):'—';
  const expPrice=target?(div/((target-1)/100)).toFixed(1):'—';

  const el=document.getElementById('y_result');
  el.className='result-box show';
  el.innerHTML=`
    ${price?`<div>目前殖利率：<span class="big">${curYield}%</span></div>`:''}
    <div>合理買進價（${target}%）：<span class="big">${fairPrice} 元</span></div>
    <div>便宜價（${+target+1}%）：${cheapPrice} 元</div>
    <div>昂貴價（${Math.max(+target-1,1)}%）：${expPrice} 元</div>`;
}

function calcDCA(){
  const monthly=+document.getElementById('d_monthly').value;
  const rate=+document.getElementById('d_rate').value;
  const years=+document.getElementById('d_years').value;
  if(!monthly||!years){alert('請填入金額和年數');return;}

  const r=rate/100/12;
  const n=years*12;
  const principal=monthly*n;
  let total;
  if(r===0){total=principal;}
  else{total=monthly*((Math.pow(1+r,n)-1)/r)*(1+r);}

  const profit=total-principal;
  const lines=[`<div>每月投入：${fmt(monthly)} 元</div>`,
    `<div>投入本金：${fmt(principal)} 元（${years}年）</div>`,
    `<div>累積資產：<span class="big up">${fmt(total)} 元</span></div>`,
    `<div>投資報酬：${fmt(profit)} 元（${(profit/principal*100).toFixed(0)}%）</div>`];

  // milestones
  const milestones=[5,10,15,20,25,30].filter(y=>y<=years);
  if(milestones.length>1){
    lines.push('<hr style="border:none;border-top:1px solid var(--border);margin:8px 0">');
    lines.push('<div style="font-size:12px;color:var(--text-secondary)">各年度累積：</div>');
    milestones.forEach(y=>{
      const nm=y*12;
      const t=r===0?monthly*nm:monthly*((Math.pow(1+r,nm)-1)/r)*(1+r);
      lines.push(`<div>${y}年：${fmt(t)} 元（本金 ${fmt(monthly*nm)}）</div>`);
    });
  }

  const el=document.getElementById('d_result');
  el.className='result-box show';
  el.innerHTML=lines.join('');
}
</script>
