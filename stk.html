<script>
const input=document.getElementById('stkInput');
input.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
if(location.hash){input.value=location.hash.slice(1);setTimeout(doSearch,600);}

let currentSid='', currentAnalysis=null, rawDaily=[], currentTF='D', currentInd='kd';

async function doSearch(){
  const sid=input.value.trim(); if(!sid)return;
  location.hash=sid; currentSid=sid;
  if(!sb){document.getElementById('app').innerHTML='<div class="empty-state">系統載入中...</div>';return;}

  // 同時抓分析資料和歷史K線
  const [stkRes, priceRes] = await Promise.all([
    sb.from('daily_stk').select('data').eq('stock_id',sid).order('date',{ascending:false}).limit(1).single(),
    sb.from('stock_prices').select('*').eq('stock_id',sid).order('date',{ascending:true}).limit(500)
  ]);

  if(stkRes.error||!stkRes.data){
    document.getElementById('app').innerHTML='<div class="empty-state">查無 <code>'+sid+'</code> 的分析資料</div>';return;
  }
  currentAnalysis = stkRes.data.data;
  rawDaily = (priceRes.data||[]).filter(r=>r.close>0);

  renderStock(sid, currentAnalysis);
}

function cls(v){return v>0?'up':v<0?'dn':'';}
function sign(v){return v>0?'+'+v:v;}
function fmt(v){return typeof v==='number'?v.toLocaleString('zh-TW'):v;}
function scoreBadge(n){const p=n/10;return p>=.7?'badge-high':p>=.4?'badge-mid':'badge-low';}
function scoreComment(t){if(t>=25)return'多項指標正向';if(t>=20)return'指標偏正向';if(t>=15)return'指標中性';if(t>=10)return'指標偏弱';return'多項指標偏空';}
function scoreColor(t){if(t>=25)return'var(--green)';if(t>=20)return'var(--teal)';if(t>=15)return'var(--gold)';return'var(--red)';}
function fmtRev(v){if(!v)return'—';if(v>=1e8)return(v/1e8).toFixed(1)+'億';if(v>=1e4)return(v/1e4).toFixed(0)+'萬';return fmt(v);}

// ══════════════════════════════════════
// 時間週期轉換
// ══════════════════════════════════════
function aggregateWeekly(data){
  const weeks=[];let w=null;
  data.forEach(d=>{
    const dt=new Date(d.date||d.d);
    const dow=dt.getDay();
    if(!w||dow<=((w._lastDow===undefined)?-1:w._lastDow)){
      if(w)weeks.push(w);
      w={d:d.date||d.d,o:d.open??d.o,h:d.high??d.h,l:d.low??d.l,c:d.close??d.c,v:d.volume??d.v??0,_lastDow:dow};
    } else {
      w.h=Math.max(w.h,d.high??d.h);
      w.l=Math.min(w.l,d.low??d.l);
      w.c=d.close??d.c;
      w.v+=(d.volume??d.v??0);
      w.d=d.date||d.d;
      w._lastDow=dow;
    }
  });
  if(w)weeks.push(w);
  return weeks.map(w=>({d:w.d,o:w.o,h:w.h,l:w.l,c:w.c,v:w.v}));
}
function aggregateMonthly(data){
  const months=[];let m=null,curM='';
  data.forEach(d=>{
    const dt=d.date||d.d;
    const ym=dt.slice(0,7);
    if(ym!==curM){
      if(m)months.push(m);
      curM=ym;
      m={d:dt,o:d.open??d.o,h:d.high??d.h,l:d.low??d.l,c:d.close??d.c,v:d.volume??d.v??0};
    } else {
      m.h=Math.max(m.h,d.high??d.h);
      m.l=Math.min(m.l,d.low??d.l);
      m.c=d.close??d.c;
      m.v+=(d.volume??d.v??0);
      m.d=dt;
    }
  });
  if(m)months.push(m);
  return months;
}
function getChartData(){
  // 統一成 {d,o,h,l,c,v} 格式
  let src = rawDaily.length>2 ? rawDaily.map(r=>({d:r.date,o:r.open,h:r.high,l:r.low,c:r.close,v:r.volume||0}))
    : (currentAnalysis.history||[]);
  if(!src.length) return [];
  if(currentTF==='W') return aggregateWeekly(src);
  if(currentTF==='M') return aggregateMonthly(src);
  return src; // 'D'
}

    </div>

      <div class="ohlcv-item"><div class="ohlcv-label">最高</div><div class="ohlcv-val">${fmt(d.high)}</div></div>

      <div class="ohlcv-item"><div class="ohlcv-label">成交張</div><div class="ohlcv-val">${fmt(d.volume)}</div></div>
    </div>
  </div>
  ${hasChart?`
  <div class="chart-box">
    <div class="chart-toolbar">
      <span class="chart-label">📈 K線走勢圖</span>
      <button class="tf-btn ${currentTF==='D'?'active':''}" onclick="switchTF('D')">日</button>
      <button class="tf-btn ${currentTF==='W'?'active':''}" onclick="switchTF('W')">週</button>
      <button class="tf-btn ${currentTF==='M'?'active':''}" onclick="switchTF('M')">月</button>
    </div>
    <div class="ma-legend" id="maLegend"></div>
    <div class="chart-canvas" id="chartCanvas">
      <canvas id="kCanvas"></canvas>
      <div class="chart-tooltip" id="kTooltip"></div>
    </div>
    <div class="chart-toolbar" style="margin-top:8px;margin-bottom:0">

      <button class="ind-btn ${currentInd==='kd'?'active':''}" data-ind="kd" onclick="switchInd('kd')">KD</button>
      <button class="ind-btn ${currentInd==='rsi'?'active':''}" data-ind="rsi" onclick="switchInd('rsi')">RSI</button>
      <button class="ind-btn ${currentInd==='macd'?'active':''}" data-ind="macd" onclick="switchInd('macd')">MACD</button>
    </div>
    <div class="chart-canvas"><canvas id="indCanvas"></canvas></div>
  </div>`:`<div class="chart-box"><div class="chart-toolbar"><span class="chart-label">📈 K線走勢圖</span></div><div style="padding:30px;text-align:center;color:var(--text-secondary)">歷史資料載入中（回填後可顯示）</div></div>`}
  ${rev.length?`
  <div class="rev-grid">
    <div class="rev-card"><div class="rev-label">最新月營收</div><div class="rev-val">${latestRev?fmtRev(latestRev.rev):'—'}</div><div class="rev-sub">${latestRev?latestRev.m:''}</div></div>
    <div class="rev-card"><div class="rev-label">年增率 YoY</div><div class="rev-val ${cls(latestRev?.yoy)}">${latestRev?(latestRev.yoy>=0?'+':'')+latestRev.yoy.toFixed(1)+'%':'—'}</div><div class="rev-sub">月增 ${latestRev?(latestRev.mom>=0?'+':'')+latestRev.mom.toFixed(1)+'%':'—'}</div></div>
  </div>
  <div class="chart-box">
    <div class="chart-toolbar"><span class="chart-label">📊 月營收走勢</span></div>
    <div class="rev-chart-wrap"><canvas id="revCanvas"></canvas></div>
  </div>`:''}
  <div class="chip-grid">
    <div class="chip-card"><div class="chip-label">主力買賣超</div><div class="chip-val ${cls(d.chip.main_net)}">${sign(fmt(d.chip.main_net))}張</div></div>
    <div class="chip-card"><div class="chip-label">散戶買賣超</div><div class="chip-val ${cls(d.chip.retail_net)}">${sign(fmt(d.chip.retail_net))}張</div></div>
    <div class="chip-card"><div class="chip-label">籌碼集中度</div><div class="chip-val">${d.chip.concentration_pct}%</div><div class="chip-sub">集中股數 ${fmt(d.chip.concentration_shares)}張</div></div>

  <div class="score-section">
    <div class="score-total"><div class="score-ring" style="background:${scoreColor(total)}">${total}/30</div><div><div class="score-total-label">總評分：${scoreComment(total)}</div><div class="score-total-comment">籌碼 ${d.scores.chip}/10 ・ 基本 ${d.scores.fundamental}/10 ・ 技術 ${d.scores.technical}/10</div></div></div>
    ${renderDim('籌碼面',d.scores.chip,d.criteria.chip)}
    ${renderDim('基本面',d.scores.fundamental,d.criteria.fundamental)}
    ${renderDim('技術面',d.scores.technical,d.criteria.technical)}
  </div>`;
  if(hasChart) drawChart(chartData);
  if(rev.length>1) drawRevChart(rev);
}

function switchTF(tf){
  currentTF=tf;
  renderStock(currentSid, currentAnalysis);
}

// ══════════════════════════════════════
// K 線圖 (Canvas) — XQ 風格
// ══════════════════════════════════════
let chartDataCache=[];
const MA_COLORS=['#D4A840','#5AADAB','#C0544F','#8060C0'];
const MA_PERIODS=[5,10,20,60];

function calcMA(data,n){
  const r=[];
  for(let i=0;i<data.length;i++){
    if(i<n-1){r.push(null);continue;}
    let s=0;for(let j=i-n+1;j<=i;j++)s+=data[j].c;
    r.push(s/n);
  }
  return r;
}
function calcKD(data){
  const k=[],d=[];
  let prevK=50,prevD=50;
  for(let i=0;i<data.length;i++){
    const period=Math.min(9,i+1);
    const slice=data.slice(Math.max(0,i-period+1),i+1);
    const h=Math.max(...slice.map(x=>x.h));
    const l=Math.min(...slice.map(x=>x.l));
    const rsv=h===l?50:(data[i].c-l)/(h-l)*100;
    const kv=prevK*2/3+rsv/3;
    const dv=prevD*2/3+kv/3;
    k.push(kv);d.push(dv);prevK=kv;prevD=dv;
  }
  return{k,d};
}
function calcRSI(data,n=14){
  const r=[];let avgG=0,avgL=0;
  for(let i=0;i<data.length;i++){
    if(i===0){r.push(50);continue;}
    const chg=data[i].c-data[i-1].c;
    const g=chg>0?chg:0,l=chg<0?-chg:0;
    if(i<=n){avgG=(avgG*(i-1)+g)/i;avgL=(avgL*(i-1)+l)/i;}
    else{avgG=(avgG*(n-1)+g)/n;avgL=(avgL*(n-1)+l)/n;}
    r.push(avgL===0?100:100-100/(1+avgG/avgL));
  }
  return r;
}
function calcMACD(data){
  let e12=data[0].c,e26=data[0].c,sig=0;
  const dif=[],macd=[],osc=[];
  for(let i=0;i<data.length;i++){
    e12=i===0?data[i].c:e12*11/13+data[i].c*2/13;
    e26=i===0?data[i].c:e26*25/27+data[i].c*2/27;
    const d=e12-e26;
    sig=i===0?d:sig*8/10+d*2/10;
    dif.push(d);macd.push(sig);osc.push((d-sig)*2);
  }
  return{dif,macd,osc};
}

function drawChart(data){
  chartDataCache=data;
  const canvas=document.getElementById('kCanvas');
  if(!canvas)return;
  const cs=getComputedStyle(document.documentElement);
  const cUp=cs.getPropertyValue('--red').trim()||'#C0544F';
  const cDn=cs.getPropertyValue('--green').trim()||'#4A8B6E';
  const cGrid=cs.getPropertyValue('--border-light').trim()||'#EBE7E0';
  const cText=cs.getPropertyValue('--text-secondary').trim()||'#6B7280';
  const cBg=cs.getPropertyValue('--card').trim()||'#FFFFFF';

  const dpr=window.devicePixelRatio||1;
  const n=data.length;
  const cw=Math.max(8,Math.min(18,700/n));
  const W=Math.max(n*cw+80,400);
  const priceH=280,volH=80,gap=8,padL=60,padR=12,padT=8,padB=24;
  const H=priceH+gap+volH+padT+padB;

  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);

  const prices=data.flatMap(d=>[d.h,d.l]);
  const pMin=Math.min(...prices),pMax=Math.max(...prices);
  const pMargin=(pMax-pMin)*0.05||1;
  const pLo=pMin-pMargin,pHi=pMax+pMargin;
  const yP=v=>padT+(1-(v-pLo)/(pHi-pLo))*priceH;

  const vMax=Math.max(...data.map(d=>d.v))||1;
  const volTop=padT+priceH+gap;
  const yV=v=>volTop+volH*(1-v/vMax);

  // 網格 + Y 軸
  ctx.font='10px monospace';ctx.textAlign='right';
  for(let i=0;i<=5;i++){
    const pv=pLo+(pHi-pLo)*i/5;
    const yy=yP(pv);
    ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();
    ctx.fillStyle=cText;
    ctx.fillText(pv>=100?pv.toFixed(0):pv.toFixed(1),padL-4,yy+3);
  }
  // 成交量Y軸
  ctx.fillStyle=cText;ctx.fillText(Math.round(vMax)+'張',padL-4,volTop+10);

  // X 軸日期
  ctx.textAlign='center';
  const dateStep=Math.max(1,Math.floor(n/8));
  for(let i=0;i<n;i+=dateStep){
    const x=padL+i*cw+cw/2;
    ctx.fillStyle=cText;
    const lbl=data[i].d.length>5?data[i].d.slice(5):data[i].d;
    ctx.fillText(lbl,x,padT+priceH+gap+volH+14);
  }

  // K 棒 + 成交量
  data.forEach((d,i)=>{
    const x=padL+i*cw+cw/2;
    const up=d.c>=d.o;
    const color=up?cUp:cDn;
    const bw2=Math.max(1,cw*0.35);

    // 上下影線
    ctx.strokeStyle=color;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,yP(d.h));ctx.lineTo(x,yP(d.l));ctx.stroke();

    // 實體
    const top=yP(Math.max(d.o,d.c));
    const bot=yP(Math.min(d.o,d.c));
    const bh=Math.max(bot-top,1);
    if(up){
      ctx.strokeStyle=color;ctx.lineWidth=1;
      ctx.strokeRect(x-bw2,top,bw2*2,bh);
      ctx.fillStyle=cBg;ctx.fillRect(x-bw2+0.5,top+0.5,bw2*2-1,bh-1);
    }else{
      ctx.fillStyle=color;
      ctx.fillRect(x-bw2,top,bw2*2,bh);
    }

    // 成交量柱
    const vh=d.v/vMax*volH;
    ctx.fillStyle=color;ctx.globalAlpha=0.4;
    ctx.fillRect(x-bw2,volTop+volH-vh,bw2*2,vh);
    ctx.globalAlpha=1;
  });

  // MA 均線
  const mas=MA_PERIODS.map(p=>calcMA(data,p));
  mas.forEach((maArr,mi)=>{
    ctx.strokeStyle=MA_COLORS[mi];ctx.lineWidth=1.5;
    ctx.beginPath();let started=false;
    maArr.forEach((v,i)=>{
      if(v===null)return;
      const x=padL+i*cw+cw/2;
      if(!started){ctx.moveTo(x,yP(v));started=true;}
      else ctx.lineTo(x,yP(v));
    });
    ctx.stroke();
  });

  // MA 圖例
  const legend=document.getElementById('maLegend');
  if(legend){
    legend.innerHTML=mas.map((maArr,mi)=>{
      const last=maArr.filter(v=>v!==null).pop();
      return `<span><span style="display:inline-block;width:14px;height:2px;background:${MA_COLORS[mi]};margin-right:4px;vertical-align:middle;border-radius:1px"></span>MA${MA_PERIODS[mi]} ${last!=null?last.toFixed(1):'—'}</span>`;
    }).join('');
  }

  // Tooltip
  const tooltip=document.getElementById('kTooltip');
  canvas.onmousemove=e=>{
    const rect=canvas.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width);
    const idx=Math.floor((mx-padL)/cw);
    if(idx<0||idx>=n){tooltip.style.display='none';return;}
    const d=data[idx];
    const chg=idx>0?(d.c-data[idx-1].c):0;
    const chgP=idx>0&&data[idx-1].c?(chg/data[idx-1].c*100):0;
    const c=chg>=0?cUp:cDn;
    tooltip.style.display='block';
    tooltip.style.left=Math.min(e.clientX-rect.left+12,rect.width-180)+'px';
    tooltip.style.top='8px';
    tooltip.innerHTML=`<div style="margin-bottom:3px;font-weight:600">${d.d}</div>
      開 <span style="color:${c}">${d.o}</span>　高 <span style="color:${c}">${d.h}</span><br>
      低 <span style="color:${c}">${d.l}</span>　收 <span style="color:${c}">${d.c}</span><br>
      量 ${fmt(d.v)}張<br>
      漲跌 <span style="color:${c}">${chg>=0?'+':''}${chg.toFixed(2)} (${chgP>=0?'+':''}${chgP.toFixed(2)}%)</span>`;
  };
  canvas.onmouseleave=()=>{tooltip.style.display='none';};

  drawIndicator(currentInd);
}

function switchInd(ind){
  currentInd=ind;
  document.querySelectorAll('.ind-btn').forEach(b=>b.classList.toggle('active',b.dataset.ind===ind));
  drawIndicator(ind);
}

function drawIndicator(ind){
  const canvas=document.getElementById('indCanvas');
  if(!canvas||!chartDataCache.length)return;
  const data=chartDataCache;
  const cs=getComputedStyle(document.documentElement);
  const cGrid=cs.getPropertyValue('--border-light').trim()||'#EBE7E0';
  const cText=cs.getPropertyValue('--text-secondary').trim()||'#6B7280';
  const cUp=cs.getPropertyValue('--red').trim()||'#C0544F';
  const cDn=cs.getPropertyValue('--green').trim()||'#4A8B6E';

  const dpr=window.devicePixelRatio||1;
  const n=data.length;
  const cw=Math.max(8,Math.min(18,700/n));
  const W=Math.max(n*cw+80,400);
  const H=120;
  const padL=60,padR=12,padT=6,padB=4;

  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);

  const plotH=H-padT-padB;
  ctx.font='9px monospace';ctx.textAlign='right';

  if(ind==='kd'){
    const{k,d:dArr}=calcKD(data);
    const yy=v=>padT+(1-v/100)*plotH;
    [20,50,80].forEach(v=>{
      ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(padL,yy(v));ctx.lineTo(W-padR,yy(v));ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle=cText;ctx.fillText(v,padL-4,yy(v)+3);
    });
    ctx.strokeStyle='#D4A840';ctx.lineWidth=1.5;ctx.beginPath();
    k.forEach((v,i)=>{const x=padL+i*cw+cw/2;i===0?ctx.moveTo(x,yy(v)):ctx.lineTo(x,yy(v));});
    ctx.stroke();
    ctx.strokeStyle='#5AADAB';ctx.lineWidth=1.5;ctx.beginPath();
    dArr.forEach((v,i)=>{const x=padL+i*cw+cw/2;i===0?ctx.moveTo(x,yy(v)):ctx.lineTo(x,yy(v));});
    ctx.stroke();
    ctx.fillStyle='#D4A840';ctx.textAlign='left';ctx.fillText('K '+k[k.length-1].toFixed(1),padL+4,padT+10);
    ctx.fillStyle='#5AADAB';ctx.fillText('D '+dArr[dArr.length-1].toFixed(1),padL+60,padT+10);
  }else if(ind==='rsi'){
    const rsi=calcRSI(data,14);
    const yy=v=>padT+(1-v/100)*plotH;
    [30,50,70].forEach(v=>{
      ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(padL,yy(v));ctx.lineTo(W-padR,yy(v));ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle=cText;ctx.fillText(v,padL-4,yy(v)+3);
    });
    ctx.strokeStyle='#D4A840';ctx.lineWidth=1.5;ctx.beginPath();
    rsi.forEach((v,i)=>{const x=padL+i*cw+cw/2;i===0?ctx.moveTo(x,yy(v)):ctx.lineTo(x,yy(v));});
    ctx.stroke();
    ctx.fillStyle='#D4A840';ctx.textAlign='left';ctx.fillText('RSI14 '+rsi[rsi.length-1].toFixed(1),padL+4,padT+10);
  }else if(ind==='macd'){
    const{dif,macd:sig,osc}=calcMACD(data);
    const allV=[...dif,...sig,...osc];
    const vMax=Math.max(...allV.map(Math.abs))||1;
    const yy=v=>padT+plotH/2-v/vMax*(plotH/2);
    ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(padL,yy(0));ctx.lineTo(W-padR,yy(0));ctx.stroke();
    ctx.fillStyle=cText;ctx.textAlign='right';ctx.fillText('0',padL-4,yy(0)+3);
    osc.forEach((v,i)=>{
      const x=padL+i*cw+cw/2;const bw2=Math.max(1,cw*0.3);
      ctx.fillStyle=v>=0?cUp:cDn;ctx.globalAlpha=0.5;
      const top=v>=0?yy(v):yy(0);const h=Math.abs(yy(v)-yy(0));
      ctx.fillRect(x-bw2,top,bw2*2,h||1);ctx.globalAlpha=1;
    });
    ctx.strokeStyle='#D4A840';ctx.lineWidth=1.5;ctx.beginPath();
    dif.forEach((v,i)=>{const x=padL+i*cw+cw/2;i===0?ctx.moveTo(x,yy(v)):ctx.lineTo(x,yy(v));});
    ctx.stroke();
    ctx.strokeStyle='#5AADAB';ctx.lineWidth=1.5;ctx.beginPath();
    sig.forEach((v,i)=>{const x=padL+i*cw+cw/2;i===0?ctx.moveTo(x,yy(v)):ctx.lineTo(x,yy(v));});
    ctx.stroke();
    ctx.textAlign='left';
    ctx.fillStyle='#D4A840';ctx.fillText('DIF '+dif[dif.length-1].toFixed(2),padL+4,padT+10);
    ctx.fillStyle='#5AADAB';ctx.fillText('MACD '+sig[sig.length-1].toFixed(2),padL+80,padT+10);
  }
}

function drawRevChart(data){
  const canvas=document.getElementById('revCanvas');
  if(!canvas)return;
  const cs=getComputedStyle(document.documentElement);
  const cUp=cs.getPropertyValue('--red').trim()||'#C0544F';
  const cDn=cs.getPropertyValue('--green').trim()||'#4A8B6E';
  const cGrid=cs.getPropertyValue('--border-light').trim()||'#EBE7E0';
  const cText=cs.getPropertyValue('--text-secondary').trim()||'#6B7280';
  const dpr=window.devicePixelRatio||1;
  const n=data.length;const bw=50;
  const W=Math.max(n*bw+80,400),H=180;
  const padL=60,padR=10,padT=15,padB=32;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const vals=data.map(d=>d.rev).filter(Boolean);
  if(!vals.length)return;
  const vMax=Math.max(...vals);const plotH=H-padT-padB;
  const yy=v=>padT+(1-v/vMax)*plotH;
  ctx.font='10px monospace';ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const v=vMax*i/4;
    ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(padL,yy(v));ctx.lineTo(W-padR,yy(v));ctx.stroke();
    ctx.fillStyle=cText;ctx.fillText(fmtRev(v),padL-4,yy(v)+3);
  }
  ctx.textAlign='center';
  data.forEach((d,i)=>{
    if(!d.rev)return;
    const x=padL+i*bw;const color=d.yoy>=0?cUp:cDn;
    const h=d.rev/vMax*plotH;const rx=2;
    const bx=x+4,by=yy(d.rev),bwi=bw-8,bhi=h;
    ctx.fillStyle=color;ctx.beginPath();
    ctx.moveTo(bx+rx,by);ctx.lineTo(bx+bwi-rx,by);ctx.quadraticCurveTo(bx+bwi,by,bx+bwi,by+rx);
    ctx.lineTo(bx+bwi,by+bhi);ctx.lineTo(bx,by+bhi);ctx.lineTo(bx,by+rx);ctx.quadraticCurveTo(bx,by,bx+rx,by);
    ctx.fill();
    ctx.fillStyle=color;ctx.font='9px monospace';
    ctx.fillText((d.yoy>=0?'+':'')+d.yoy.toFixed(0)+'%',x+bw/2,yy(d.rev)-4);
    ctx.fillStyle=cText;
    ctx.fillText(d.m.length>5?d.m.slice(-5):d.m,x+bw/2,H-padB+14);
  });
}

function renderDim(label,score,items){
  return`<div class="score-dim open"><div class="score-dim-header" onclick="this.parentElement.classList.toggle('open')"><span class="score-dim-arrow">▶</span><span class="score-dim-title">${label}</span><span class="score-dim-badge ${scoreBadge(score)}">${score}/10</span></div><div class="score-dim-list">${(items||[]).map(c=>'<div class="criteria '+(c.pass?'pass':'fail')+'"><span class="icon">'+(c.pass?'✓':'✗')+'</span><span>'+c.text+'</span></div>').join('')}</div></div>`;
}
