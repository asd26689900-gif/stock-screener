if(location.hash){setTimeout(doSearch,300);}

let currentSid='', currentAnalysis=null, rawDaily=[], currentTF='D', currentInd='kd';
let chartZoom=1, chartPanIdx=0, chartIsDragging=false, chartDragStartX=0, chartDragStartPan=0;
let _chartRAF=0, _chartEventsAttached=false, _cachedMAs=null, _cachedMADataLen=0;
let scoreCfgDraft=null;
const TF_MAP = {
  '5m':  {interval:'5m',  range:'1mo',  label:'5分'},
  '60m': {interval:'60m', range:'6mo', label:'60分'},
  'D':   {interval:null,  range:null,  label:'日'},
  'W':   {interval:null,  range:null,  label:'週'},
  'M':   {interval:null,  range:null,  label:'月'},
};
let minuteCache = {}; // {key: [{d,o,h,l,c,v}]}

async function doSearch(){
  const sid=(location.hash||'').replace('#','').trim(); if(!sid)return;
  location.hash=sid; currentSid=sid; minuteCache={}; currentTF='D'; chartZoom=1; chartPanIdx=0; _chartEventsAttached=false; _cachedMAs=null;
  if(!sb){document.getElementById('app').innerHTML='<div class="empty-state">系統載入中...</div>';return;}

  // 同時抓分析資料和歷史K線
  const [stkRes, priceRes] = await Promise.all([
    sb.from('daily_stk').select('data').eq('stock_id',sid).order('date',{ascending:false}).limit(1).single(),
    sb.from('stock_prices').select('*').eq('stock_id',sid).order('date',{ascending:true}).limit(2600)
  ]);

  if(stkRes.error||!stkRes.data){
    document.getElementById('app').innerHTML='<div class="empty-state">查無 <code>'+sid+'</code> 的分析資料</div>';return;
  }
  currentAnalysis = stkRes.data.data;
  rawDaily = (priceRes.data||[]).filter(r=>r.close>0);

  renderStock(sid, currentAnalysis);
}

function cls(v){return v>0?'up':v<0?'dn':'';}
function sign(v){return v>0?'+'+v:v;}
function fmt(v){return typeof v==='number'?v.toLocaleString('zh-TW'):v;}
function scoreBadge(n){const p=n/10;return p>=.7?'badge-high':p>=.4?'badge-mid':'badge-low';}
function scoreComment(t){if(t>=25)return'多項指標正向';if(t>=20)return'指標偏正向';if(t>=15)return'指標中性';if(t>=10)return'指標偏弱';return'多項指標偏空';}
function scoreColor(t){if(t>=25)return'var(--green)';if(t>=20)return'var(--teal)';if(t>=15)return'var(--gold)';return'var(--red)';}
function fmtRev(v){if(!v)return'—';if(v>=1e8)return(v/1e8).toFixed(1)+'億';if(v>=1e4)return(v/1e4).toFixed(0)+'萬';return fmt(v);}

// ══════════════════════════════════════
// 時間週期轉換
// ══════════════════════════════════════
function aggregateWeekly(data){
  const weeks=[];let w=null;
  data.forEach(d=>{
    const dt=new Date(d.date||d.d);
    const dow=dt.getDay();
    if(!w||dow<=((w._lastDow===undefined)?-1:w._lastDow)){
      if(w)weeks.push(w);
      w={d:d.date||d.d,o:d.open??d.o,h:d.high??d.h,l:d.low??d.l,c:d.close??d.c,v:d.volume??d.v??0,_lastDow:dow};
    } else {
      w.h=Math.max(w.h,d.high??d.h);
      w.l=Math.min(w.l,d.low??d.l);
      w.c=d.close??d.c;
      w.v+=(d.volume??d.v??0);
      w.d=d.date||d.d;
      w._lastDow=dow;
    }
  });
  if(w)weeks.push(w);
  return weeks.map(w=>({d:w.d,o:w.o,h:w.h,l:w.l,c:w.c,v:w.v}));
}
function aggregateMonthly(data){
  const months=[];let m=null,curM='';
  data.forEach(d=>{
    const dt=d.date||d.d;
    const ym=dt.slice(0,7);
    if(ym!==curM){
      if(m)months.push(m);
      curM=ym;
      m={d:dt,o:d.open??d.o,h:d.high??d.h,l:d.low??d.l,c:d.close??d.c,v:d.volume??d.v??0};
    } else {
      m.h=Math.max(m.h,d.high??d.h);
      m.l=Math.min(m.l,d.low??d.l);
      m.c=d.close??d.c;
      m.v+=(d.volume??d.v??0);
      m.d=dt;
    }
  });
  if(m)months.push(m);
  return months;
}
function getChartData(){
  // 分K用 minuteCache
  if(currentTF==='5m'||currentTF==='60m'){
    return minuteCache[currentTF]||[];
  }
  // 日K：合併 stock_prices + daily_stk.history，去重取最新
  const fromDB = rawDaily.map(r=>({d:r.date,o:r.open,h:r.high,l:r.low,c:r.close,v:r.volume||0}));
  const fromAnalysis = (currentAnalysis.history||[]).map(r=>({d:r.d||r.date,o:r.o??r.open,h:r.h??r.high,l:r.l??r.low,c:r.c??r.close,v:r.v??r.volume??0}));
  const dateMap = {};
  fromAnalysis.forEach(r=>{ dateMap[r.d]=r; });
  fromDB.forEach(r=>{ dateMap[r.d]=r; }); // DB 覆蓋同日
  let src = Object.values(dateMap).sort((a,b)=>a.d.localeCompare(b.d));
  if(!src.length) return [];
  if(currentTF==='W') return aggregateWeekly(src);
  if(currentTF==='M') return aggregateMonthly(src);
  return src;
}
async function fetchMinuteData(tf){
  const key=tf;
  if(minuteCache[key]) return minuteCache[key];
  const cfg=TF_MAP[tf];
  try{
    const r=await fetch(`/api/chart?sid=${currentSid}&interval=${cfg.interval}&range=${cfg.range}`);
    if(!r.ok) return [];
    const j=await r.json();
    minuteCache[key]=j.bars||[];
    return minuteCache[key];
  }catch(e){return [];}
}

  const ind=d.industry||'';

  return `<div class="stk-intro">

    <div class="stk-intro-name">${sid} ${d.name}</div>

  </div>`;
}

// ── 均線狀態標籤 ──
function renderMATags(d){
  if(!d.ma||!d.ma.length) return '';
  const price=d.close;
  const tags=d.ma.map(m=>{
    const above=price>=m.value;
    return `<span class="ma-tag ${above?'above':'below'}">${above?'站上':'跌破'}${m.label}</span>`;
  }).join('');
  return `<div class="ma-tags">${tags}</div>`;
}

// ── 技術指標摘要卡片 ──
function renderIndCards(d){
  const data=getChartData();
  if(data.length<15) return '';
  const kd=calcKD(data), rsi6=calcRSI(data,6), rsi14=calcRSI(data,14), macd=calcMACD(data);
  const last=data.length-1;
  const kv=kd.k[last].toFixed(1), dv=kd.d[last].toFixed(1);
  const r6=rsi6[last].toFixed(1), r14=rsi14[last].toFixed(1);
  const m=macd.dif[last].toFixed(2), sig=macd.macd[last].toFixed(2);
  const kdHint=kd.k[last]>80?'超買區':kd.k[last]<20?'超賣區':'中性';
  const rsiHint=rsi6[last]>80?'超買':rsi6[last]<20?'超賣':'中性';
  const macdHint=macd.dif[last]>macd.macd[last]?'多方動能':'空方動能';
  return `<div class="ind-grid">
    <div class="ind-card"><div class="ind-card-label">KD</div><div class="ind-card-val">${kv}</div><div class="ind-card-sub">D ${dv}・${kdHint}</div></div>
    <div class="ind-card"><div class="ind-card-label">RSI(6)</div><div class="ind-card-val">${r6}</div><div class="ind-card-sub">RSI(14) ${r14}・${rsiHint}</div></div>
    <div class="ind-card"><div class="ind-card-label">MACD</div><div class="ind-card-val">${m}</div><div class="ind-card-sub">Signal ${sig}・${macdHint}</div></div>
  </div>`;
}

  ${rev.length?`

async function switchTF(tf){
  currentTF=tf; _cachedMAs=null;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.toggle('active',b.dataset.tf===tf));
  let bars;
  if(tf==='5m'||tf==='60m'){
    bars=await fetchMinuteData(tf);
  } else {
    bars=getChartData();
  }
  if(!bars||bars.length<=2) return;
  const VIS=60;
  if(bars.length>VIS){chartZoom=bars.length/VIS;chartPanIdx=bars.length;}
  else{chartZoom=1;chartPanIdx=0;}
  drawChart(bars);
}

// ══════════════════════════════════════
// K 線圖 (Canvas) — XQ 風格
// ══════════════════════════════════════
let chartDataCache=[];
const MA_COLORS=['#2962FF','#FF9800','#9C27B0','#8B8780'];
const MA_PERIODS=[5,10,20,60];

function setOHLCBar(b, prev){

}

function calcMA(data,n){
  const r=[];
  for(let i=0;i<data.length;i++){
    if(i<n-1){r.push(null);continue;}
    let s=0;for(let j=i-n+1;j<=i;j++)s+=data[j].c;
    r.push(s/n);
  }
  return r;
}
function calcKD(data){
  const k=[],d=[];
  let prevK=50,prevD=50;
  for(let i=0;i<data.length;i++){
    const period=Math.min(9,i+1);
    const slice=data.slice(Math.max(0,i-period+1),i+1);
    const h=Math.max(...slice.map(x=>x.h));
    const l=Math.min(...slice.map(x=>x.l));
    const rsv=h===l?50:(data[i].c-l)/(h-l)*100;
    const kv=prevK*2/3+rsv/3;
    const dv=prevD*2/3+kv/3;
    k.push(kv);d.push(dv);prevK=kv;prevD=dv;
  }
  return{k,d};
}
function calcRSI(data,n=14){
  const r=[];let avgG=0,avgL=0;
  for(let i=0;i<data.length;i++){
    if(i===0){r.push(50);continue;}
    const chg=data[i].c-data[i-1].c;
    const g=chg>0?chg:0,l=chg<0?-chg:0;
    if(i<=n){avgG=(avgG*(i-1)+g)/i;avgL=(avgL*(i-1)+l)/i;}
    else{avgG=(avgG*(n-1)+g)/n;avgL=(avgL*(n-1)+l)/n;}
    r.push(avgL===0?100:100-100/(1+avgG/avgL));
  }
  return r;
}
function calcMACD(data){
  let e12=data[0].c,e26=data[0].c,sig=0;
  const dif=[],macd=[],osc=[];
  for(let i=0;i<data.length;i++){
    e12=i===0?data[i].c:e12*11/13+data[i].c*2/13;
    e26=i===0?data[i].c:e26*25/27+data[i].c*2/27;
    const d=e12-e26;
    sig=i===0?d:sig*8/10+d*2/10;
    dif.push(d);macd.push(sig);osc.push((d-sig)*2);
  }
  return{dif,macd,osc};
}

// ── 圖表佈局參數（drawChart / crosshair 共用）──
let chartLayout = {};

function drawChart(data){
  chartDataCache=data;
  const canvas=document.getElementById('kCanvas');
  if(!canvas)return;
  const cs=getComputedStyle(document.documentElement);
  const cUp=cs.getPropertyValue('--red').trim()||'#C0544F';
  const cDn=cs.getPropertyValue('--green').trim()||'#4A8B6E';
  const cGrid=cs.getPropertyValue('--border-light').trim()||'#EBE7E0';
  const cText=cs.getPropertyValue('--text-secondary').trim()||'#6B7280';
  const cBg=cs.getPropertyValue('--card').trim()||'#FFFFFF';

  const dpr=window.devicePixelRatio||1;
  const n=data.length;
  const containerW = canvas.parentElement.clientWidth || 700;
  // 縮放：zoom=1 顯示全部，zoom>1 放大（看較少根）
  const baseCw = containerW / n;
  const cw = Math.max(4, Math.min(40, baseCw * chartZoom));
  const totalW = n * cw + 72;
  const W = Math.max(totalW, containerW);
  const priceH=280,volH=80,gap=8,padL=60,padR=12,padT=8,padB=24;
  const H=priceH+gap+volH+padT+padB;

  // 計算可見範圍
  const visibleBars = Math.min(n, Math.ceil((containerW - padL - padR) / cw));
  chartPanIdx = Math.max(0, Math.min(chartPanIdx, n - visibleBars));
  const vStart = Math.floor(chartPanIdx);
  const vEnd = Math.min(n, vStart + visibleBars + 1);
  const visData = data.slice(vStart, vEnd);

  // 固定 canvas 寬度 = 容器寬度（不用捲動，用 pan 平移）
  const drawW = containerW;
  canvas.width=drawW*dpr;canvas.height=H*dpr;
  canvas.style.width=drawW+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,drawW,H);

  // overlay canvas 同步大小
  const overlay=document.getElementById('kOverlay');
  if(overlay){
    overlay.width=drawW*dpr;overlay.height=H*dpr;
    overlay.style.width=drawW+'px';overlay.style.height=H+'px';
  }

  const prices=visData.flatMap(d=>[d.h,d.l]);
  const pMin=Math.min(...prices),pMax=Math.max(...prices);
  const pMargin=(pMax-pMin)*0.05||1;
  const pLo=pMin-pMargin,pHi=pMax+pMargin;
  const yP=v=>padT+(1-(v-pLo)/(pHi-pLo))*priceH;

  const vMax=Math.max(...visData.map(d=>d.v))||1;
  const volTop=padT+priceH+gap;

  // 保存佈局給 crosshair 用
  chartLayout = {drawW,H,padL,padR,padT,padB,priceH,volH,gap,cw,vStart,vEnd,n:visData.length,pLo,pHi,vMax,yP,volTop,data:visData,allData:data,cUp,cDn,cGrid,cText};

  // 網格 + Y 軸
  ctx.font='10px monospace';ctx.textAlign='right';
  for(let i=0;i<=5;i++){
    const pv=pLo+(pHi-pLo)*i/5;
    const yy=yP(pv);
    ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(drawW-padR,yy);ctx.stroke();
    ctx.fillStyle=cText;
    ctx.fillText(pv>=100?pv.toFixed(0):pv.toFixed(1),padL-4,yy+3);
  }
  ctx.fillStyle=cText;ctx.fillText(Math.round(vMax)+'張',padL-4,volTop+10);

  // X 軸日期
  ctx.textAlign='center';
  const dateStep=Math.max(1,Math.floor(visData.length/8));
  for(let i=0;i<visData.length;i+=dateStep){
    const x=padL+i*cw+cw/2;
    ctx.fillStyle=cText;
    const lbl=visData[i].d.length>5?visData[i].d.slice(5):visData[i].d;
    ctx.fillText(lbl,x,padT+priceH+gap+volH+14);
  }

  // K 棒 + 成交量
  visData.forEach((d,i)=>{
    const x=padL+i*cw+cw/2;
    const up=d.c>=d.o;
    const color=up?cUp:cDn;
    const bw2=Math.max(1,cw*0.35);

    ctx.strokeStyle=color;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,yP(d.h));ctx.lineTo(x,yP(d.l));ctx.stroke();

    const top=yP(Math.max(d.o,d.c));
    const bot=yP(Math.min(d.o,d.c));
    const bh=Math.max(bot-top,1);
    if(up){
      ctx.strokeStyle=color;ctx.lineWidth=1;
      ctx.strokeRect(x-bw2,top,bw2*2,bh);
      ctx.fillStyle=cBg;ctx.fillRect(x-bw2+0.5,top+0.5,bw2*2-1,bh-1);
    }else{
      ctx.fillStyle=color;
      ctx.fillRect(x-bw2,top,bw2*2,bh);
    }

    const vh=d.v/vMax*volH;
    ctx.fillStyle=color;ctx.globalAlpha=0.4;
    ctx.fillRect(x-bw2,volTop+volH-vh,bw2*2,vh);
    ctx.globalAlpha=1;
  });

  // MA 均線（快取，只在資料變時重算）
  if(!_cachedMAs||_cachedMADataLen!==data.length){_cachedMAs=MA_PERIODS.map(p=>calcMA(data,p));_cachedMADataLen=data.length;}
  const mas=_cachedMAs;
  mas.forEach((maArr,mi)=>{
    ctx.strokeStyle=MA_COLORS[mi];ctx.lineWidth=1.5;
    ctx.beginPath();let started=false;
    for(let gi=vStart;gi<vEnd;gi++){
      const v=maArr[gi];
      if(v===null)continue;
      const x=padL+(gi-vStart)*cw+cw/2;
      if(!started){ctx.moveTo(x,yP(v));started=true;}
      else ctx.lineTo(x,yP(v));
    }
    ctx.stroke();
  });

  // MA 圖例
  const legend=document.getElementById('maLegend');
  if(legend){
    legend.innerHTML=mas.map((maArr,mi)=>{
      const last=maArr.filter(v=>v!==null).pop();
      return `<span><span style="display:inline-block;width:14px;height:2px;background:${MA_COLORS[mi]};margin-right:4px;vertical-align:middle;border-radius:1px"></span>MA${MA_PERIODS[mi]} ${last!=null?last.toFixed(1):'—'}</span>`;
    }).join('');
  }

  // 最新價虛線 + 右側標籤
  if(visData.length){
    const lastC=visData[visData.length-1].c;
    const lastY=yP(lastC);
    const lc=lastC>=visData[visData.length-2]?.c?cUp:cDn;
    ctx.strokeStyle=lc;ctx.globalAlpha=0.65;ctx.lineWidth=0.8;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(padL,lastY);ctx.lineTo(drawW-padR,lastY);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.fillStyle=lc;ctx.font='10px monospace';ctx.textAlign='right';
    ctx.fillText(lastC.toFixed(2),drawW-padR-2,lastY-4);
    setOHLCBar(visData[visData.length-1], visData[visData.length-2]);
  }

  // ── 事件：只掛一次 ──
  if(!_chartEventsAttached) setupChartEvents(canvas);
  drawIndicator(currentInd);
}

function scheduleChartRedraw(){
  if(_chartRAF) return; // 已排程，跳過
  _chartRAF=requestAnimationFrame(()=>{_chartRAF=0;drawChart(chartDataCache);});
}

function setupChartEvents(canvas){
  _chartEventsAttached=true;
  const container=canvas.parentElement;

  // 滾輪縮放（RAF 節流）
  container.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const L=chartLayout;
    if(!L.cw)return;
    const mouseBarFrac=(mx-L.padL)/L.cw;
    const oldZoom=chartZoom;
    const factor=e.deltaY>0?0.85:1.18;
    chartZoom=Math.max(0.5,Math.min(20,chartZoom*factor));
    const zoomRatio=chartZoom/oldZoom;
    chartPanIdx=chartPanIdx+mouseBarFrac*(1-1/zoomRatio);
    scheduleChartRedraw();
  },{passive:false});

  // 拖曳平移（RAF 節流）
  container.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    e.preventDefault(); // 防止瀏覽器文字選取搶走拖曳
    chartIsDragging=true;chartDragStartX=e.clientX;chartDragStartPan=chartPanIdx;
    container.style.cursor='grabbing';
  });
  document.addEventListener('mousemove',e=>{
    if(chartIsDragging){
      const dx=e.clientX-chartDragStartX;
      if(!chartLayout.cw)return;
      chartPanIdx=chartDragStartPan-dx/chartLayout.cw;
      scheduleChartRedraw();
      return;
    }
    drawCrosshair(e);
  });
  document.addEventListener('mouseup',()=>{
    if(chartIsDragging){chartIsDragging=false;container.style.cursor='crosshair';}
  });

  container.addEventListener('mouseleave',()=>{
    if(!chartIsDragging){
      const overlay=document.getElementById('kOverlay');
      const tooltip=document.getElementById('kTooltip');
      const priceTag=document.getElementById('kPriceTag');
      if(overlay){const octx=overlay.getContext('2d');octx.clearRect(0,0,overlay.width,overlay.height);}
      if(tooltip)tooltip.style.display='none';
      if(priceTag)priceTag.style.display='none';
      if(chartDataCache.length) setOHLCBar(chartDataCache[chartDataCache.length-1], chartDataCache[chartDataCache.length-2]);
    }
  });

  // 觸控拖曳平移
  let touchStartX=0,touchStartPan=0;
  container.addEventListener('touchstart',e=>{
    if(e.touches.length===1){touchStartX=e.touches[0].clientX;touchStartPan=chartPanIdx;}
  },{passive:true});
  container.addEventListener('touchmove',e=>{
    if(e.touches.length===1&&chartLayout.cw){
      e.preventDefault();
      const dx=e.touches[0].clientX-touchStartX;
      chartPanIdx=touchStartPan-dx/chartLayout.cw;
      scheduleChartRedraw();
    }
  },{passive:false});
}

function drawCrosshair(e){
  const overlay=document.getElementById('kOverlay');
  const tooltip=document.getElementById('kTooltip');
  const priceTag=document.getElementById('kPriceTag');
  const canvas=document.getElementById('kCanvas');
  if(!overlay||!canvas||!chartLayout.data)return;

  const L=chartLayout;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left;
  const my=e.clientY-rect.top;
  if(mx<0||mx>L.drawW||my<0||my>L.H){
    const octx=overlay.getContext('2d');
    octx.clearRect(0,0,overlay.width,overlay.height);
    tooltip.style.display='none';
    if(priceTag)priceTag.style.display='none';
    return;
  }

  const dpr=window.devicePixelRatio||1;
  const octx=overlay.getContext('2d');
  octx.setTransform(dpr,0,0,dpr,0,0);
  octx.clearRect(0,0,L.drawW,L.H);

  // 對應 bar index
  const idx=Math.floor((mx-L.padL)/L.cw);

  // 虛線十字
  octx.strokeStyle=L.cText;octx.lineWidth=0.8;
  octx.setLineDash([4,3]);
  // 水平線
  octx.beginPath();octx.moveTo(L.padL,my);octx.lineTo(L.drawW-L.padR,my);octx.stroke();
  // 垂直線
  if(idx>=0&&idx<L.n){
    const cx=L.padL+idx*L.cw+L.cw/2;
    octx.beginPath();octx.moveTo(cx,L.padT);octx.lineTo(cx,L.padT+L.priceH+L.gap+L.volH);octx.stroke();
  }
  octx.setLineDash([]);

  // 右側價格標籤
  if(my>=L.padT&&my<=L.padT+L.priceH&&priceTag){
    const price=L.pLo+(1-(my-L.padT)/L.priceH)*(L.pHi-L.pLo);
    priceTag.style.display='block';
    priceTag.style.top=my-8+'px';
    priceTag.textContent=price>=100?price.toFixed(0):price.toFixed(2);
  }else if(priceTag){priceTag.style.display='none';}

  // Tooltip
  if(idx>=0&&idx<L.n){
    const d=L.data[idx];
    const globalIdx=L.vStart+idx;
    const prev=globalIdx>0?L.allData[globalIdx-1]:null;
    const chg=prev?(d.c-prev.c):0;
    const chgP=prev&&prev.c?(chg/prev.c*100):0;
    const c=chg>=0?L.cUp:L.cDn;
    tooltip.style.display='block';
    tooltip.style.left=Math.max(4,Math.min(mx+16,rect.width-190))+'px';
    tooltip.style.top='8px';
    tooltip.innerHTML=`<div style="margin-bottom:3px;font-weight:600">${d.d}</div>
      開 <span style="color:${c}">${d.o}</span>　高 <span style="color:${c}">${d.h}</span><br>
      低 <span style="color:${c}">${d.l}</span>　收 <span style="color:${c}">${d.c}</span><br>
      量 ${fmt(d.v)}張<br>
      漲跌 <span style="color:${c}">${chg>=0?'+':''}${chg.toFixed(2)} (${chgP>=0?'+':''}${chgP.toFixed(2)}%)</span>`;
    setOHLCBar(d, prev);
  }else{tooltip.style.display='none';}
}

function switchInd(ind){
  currentInd=ind;
  document.querySelectorAll('.ind-btn').forEach(b=>b.classList.toggle('active',b.dataset.ind===ind));
  drawIndicator(ind);
}

function drawIndicator(ind){
  const canvas=document.getElementById('indCanvas');
  if(!canvas||!chartDataCache.length||!chartLayout.data)return;
  const allData=chartDataCache;
  const L=chartLayout;
  const cs=getComputedStyle(document.documentElement);
  const cGrid=cs.getPropertyValue('--border-light').trim()||'#EBE7E0';
  const cText=cs.getPropertyValue('--text-secondary').trim()||'#6B7280';
  const cUp=cs.getPropertyValue('--red').trim()||'#C0544F';
  const cDn=cs.getPropertyValue('--green').trim()||'#4A8B6E';

  const dpr=window.devicePixelRatio||1;
  const cw=L.cw;
  const drawW=L.drawW;
  const H=120;
  const padL=L.padL,padR=L.padR,padT=6,padB=4;

  canvas.width=drawW*dpr;canvas.height=H*dpr;
  canvas.style.width=drawW+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,drawW,H);

  const plotH=H-padT-padB;
  ctx.font='9px monospace';ctx.textAlign='right';

  // 用全資料算指標，只畫可見段
  const vS=L.vStart,vE=L.vEnd;

  if(ind==='kd'){
    const{k,d:dArr}=calcKD(allData);
    const yy=v=>padT+(1-v/100)*plotH;
    [20,50,80].forEach(v=>{
      ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(padL,yy(v));ctx.lineTo(drawW-padR,yy(v));ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle=cText;ctx.fillText(v,padL-4,yy(v)+3);
    });
    ctx.strokeStyle='#D4A840';ctx.lineWidth=1.5;ctx.beginPath();
    for(let gi=vS;gi<vE;gi++){const x=padL+(gi-vS)*cw+cw/2;gi===vS?ctx.moveTo(x,yy(k[gi])):ctx.lineTo(x,yy(k[gi]));}
    ctx.stroke();
    ctx.strokeStyle='#5AADAB';ctx.lineWidth=1.5;ctx.beginPath();
    for(let gi=vS;gi<vE;gi++){const x=padL+(gi-vS)*cw+cw/2;gi===vS?ctx.moveTo(x,yy(dArr[gi])):ctx.lineTo(x,yy(dArr[gi]));}
    ctx.stroke();
    ctx.fillStyle='#D4A840';ctx.textAlign='left';ctx.fillText('K '+k[vE-1].toFixed(1),padL+4,padT+10);
    ctx.fillStyle='#5AADAB';ctx.fillText('D '+dArr[vE-1].toFixed(1),padL+60,padT+10);
  }else if(ind==='rsi'){
    const rsi=calcRSI(allData,14);
    const yy=v=>padT+(1-v/100)*plotH;
    [30,50,70].forEach(v=>{
      ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(padL,yy(v));ctx.lineTo(drawW-padR,yy(v));ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle=cText;ctx.fillText(v,padL-4,yy(v)+3);
    });
    ctx.strokeStyle='#D4A840';ctx.lineWidth=1.5;ctx.beginPath();
    for(let gi=vS;gi<vE;gi++){const x=padL+(gi-vS)*cw+cw/2;gi===vS?ctx.moveTo(x,yy(rsi[gi])):ctx.lineTo(x,yy(rsi[gi]));}
    ctx.stroke();
    ctx.fillStyle='#D4A840';ctx.textAlign='left';ctx.fillText('RSI14 '+rsi[vE-1].toFixed(1),padL+4,padT+10);
  }else if(ind==='macd'){
    const{dif,macd:sig,osc}=calcMACD(allData);
    const visOsc=osc.slice(vS,vE),visDif=dif.slice(vS,vE),visSig=sig.slice(vS,vE);
    const allV=[...visDif,...visSig,...visOsc];
    const vMax=Math.max(...allV.map(Math.abs))||1;
    const yy=v=>padT+plotH/2-v/vMax*(plotH/2);
    ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(padL,yy(0));ctx.lineTo(drawW-padR,yy(0));ctx.stroke();
    ctx.fillStyle=cText;ctx.textAlign='right';ctx.fillText('0',padL-4,yy(0)+3);
    visOsc.forEach((v,i)=>{
      const x=padL+i*cw+cw/2;const bw2=Math.max(1,cw*0.3);
      ctx.fillStyle=v>=0?cUp:cDn;ctx.globalAlpha=0.5;
      const top=v>=0?yy(v):yy(0);const h=Math.abs(yy(v)-yy(0));
      ctx.fillRect(x-bw2,top,bw2*2,h||1);ctx.globalAlpha=1;
    });
    ctx.strokeStyle='#D4A840';ctx.lineWidth=1.5;ctx.beginPath();
    visDif.forEach((v,i)=>{const x=padL+i*cw+cw/2;i===0?ctx.moveTo(x,yy(v)):ctx.lineTo(x,yy(v));});
    ctx.stroke();
    ctx.strokeStyle='#5AADAB';ctx.lineWidth=1.5;ctx.beginPath();
    visSig.forEach((v,i)=>{const x=padL+i*cw+cw/2;i===0?ctx.moveTo(x,yy(v)):ctx.lineTo(x,yy(v));});
    ctx.stroke();
    ctx.textAlign='left';
    ctx.fillStyle='#D4A840';ctx.fillText('DIF '+dif[vE-1].toFixed(2),padL+4,padT+10);
    ctx.fillStyle='#5AADAB';ctx.fillText('MACD '+sig[vE-1].toFixed(2),padL+80,padT+10);
  }
}

function drawRevChart(data){
  const canvas=document.getElementById('revCanvas');
  if(!canvas)return;
  const cs=getComputedStyle(document.documentElement);
  const cUp=cs.getPropertyValue('--red').trim()||'#C0544F';
  const cDn=cs.getPropertyValue('--green').trim()||'#4A8B6E';
  const cGrid=cs.getPropertyValue('--border-light').trim()||'#EBE7E0';
  const cText=cs.getPropertyValue('--text-secondary').trim()||'#6B7280';
  const dpr=window.devicePixelRatio||1;
  const n=data.length;const bw=50;
  const W=Math.max(n*bw+80,400),H=180;
  const padL=60,padR=10,padT=15,padB=32;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const vals=data.map(d=>d.rev).filter(Boolean);
  if(!vals.length)return;
  const vMax=Math.max(...vals);const plotH=H-padT-padB;
  const yy=v=>padT+(1-v/vMax)*plotH;
  ctx.font='10px monospace';ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const v=vMax*i/4;
    ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(padL,yy(v));ctx.lineTo(W-padR,yy(v));ctx.stroke();
    ctx.fillStyle=cText;ctx.fillText(fmtRev(v),padL-4,yy(v)+3);
  }
  ctx.textAlign='center';
  data.forEach((d,i)=>{
    if(!d.rev)return;
    const x=padL+i*bw;const color=d.yoy>=0?cUp:cDn;
    const h=d.rev/vMax*plotH;const rx=2;
    const bx=x+4,by=yy(d.rev),bwi=bw-8,bhi=h;
    ctx.fillStyle=color;ctx.beginPath();
    ctx.moveTo(bx+rx,by);ctx.lineTo(bx+bwi-rx,by);ctx.quadraticCurveTo(bx+bwi,by,bx+bwi,by+rx);
    ctx.lineTo(bx+bwi,by+bhi);ctx.lineTo(bx,by+bhi);ctx.lineTo(bx,by+rx);ctx.quadraticCurveTo(bx,by,bx+rx,by);
    ctx.fill();
    ctx.fillStyle=color;ctx.font='9px monospace';
    ctx.fillText((d.yoy>=0?'+':'')+d.yoy.toFixed(0)+'%',x+bw/2,yy(d.rev)-4);
    ctx.fillStyle=cText;
    ctx.fillText(d.m.length>5?d.m.slice(-5):d.m,x+bw/2,H-padB+14);
  });
}

/* ─── 評分區塊（支援使用者自訂條件與權重） ─── */
function buildScoreHTML(d){
  const cfg=loadScoreCfg();
  const {scores,total}=computeScores(d,cfg);
  const custom=isDefaultScoreCfg(cfg)?'':'<span class="score-cfg-hint">（自訂評分）</span>';
  return `<div class="score-section">
    <div class="score-total">
      <div class="score-total-left">
        <div class="score-ring" style="background:${scoreColor(total)}">${total}/30</div>
        <div>
          <div class="score-total-label">總評分：${scoreComment(total)} ${custom}</div>
          <div class="score-total-comment">籌碼 ${scores.chip}/10 ・ 基本 ${scores.fundamental}/10 ・ 技術 ${scores.technical}/10</div>
        </div>
      </div>
      <button class="btn btn-sm" onclick="openScoreCfg()">${I('sliders',13)}評分設定</button>
    </div>
    ${SCORE_DIMS.map(dim=>renderDim(dim,d,cfg)).join('')}
  </div>`;
}
function renderDim(dim,d,cfg){
  const items=computeDim(d,dim,cfg);
  const wSum=items.reduce((s,c)=>s+(c.on?c.w:0),0);
  const score=wSum?Math.round(10*items.reduce((s,c)=>s+(c.on&&c.pass?c.w:0),0)/wSum):0;
  return `<div class="score-dim open"><div class="score-dim-header" onclick="this.parentElement.classList.toggle('open')">
    <span class="score-dim-arrow">${I('chev',10)}</span>
    <span class="score-dim-title">${SCORE_DIM_LABEL[dim]}</span>
    <span class="score-dim-badge ${scoreBadge(score)}">${score}/10</span>
  </div><div class="score-dim-list">${items.map(c=>
    `<div class="criteria ${c.pass?'pass':'fail'}" style="${c.on?'':'opacity:.45'}"><span class="icon">${c.pass?I('check',13):I('x',13)}</span><span>${c.text}</span></div>`
  ).join('')}</div></div>`;
}

/* ─── 評分設定 Modal ─── */
function openScoreCfg(){
  if(!currentAnalysis) return;
  scoreCfgDraft=loadScoreCfg();
  renderScoreCfg();
  document.getElementById('scoreModal').style.display='flex';
}
function closeScoreCfg(){ document.getElementById('scoreModal').style.display='none'; }
function renderScoreCfg(){
  const d=currentAnalysis;
  const raw=buildRaw(d);
  const hasRaw=!!d.raw;
  document.getElementById('scoreCfgBody').innerHTML=SCORE_DIMS.map(dim=>{
    const items=SCORE_CRITERIA[dim].map((c,i)=>{
      const s=scoreCfgDraft[dim][c.id];
      let pass;
      if(hasRaw){ try{ pass=!!c.test(raw); }catch(e){ pass=false; } }
      else pass=!!d.criteria?.[dim]?.[i]?.pass;
      return `<div class="cfg-item ${s.on?'':'disabled'}">
        <input type="checkbox" ${s.on?'checked':''} onchange="scoreCfgToggle('${dim}','${c.id}')">
        <span class="cfg-text">${c.text}</span>
        <span class="cfg-pass">${pass?'命中':'未命中'}</span>
        <input type="number" class="cfg-weight" min="1" max="10" value="${s.w}" title="權重"
          onchange="scoreCfgWeight('${dim}','${c.id}',this.value)">
      </div>`;
    }).join('');
    const score=scoreCfgDraft[dim];
    return `<div class="cfg-dim">
      <div class="cfg-dim-head"><span class="cfg-dim-name">${SCORE_DIM_LABEL[dim]}</span>
      <span class="cfg-dim-score">${items.length} 項條件</span></div>
      ${items}
    </div>`;
  }).join('');
  document.getElementById('scoreCfgHint').textContent=hasRaw
    ? '可勾選要計分的條件並調整權重（1–10）。'
    : '目前資料未含評分原始值，僅可勾選/調整權重；重新執行 update.py 後可依原始值重算。';
}
function scoreCfgToggle(dim,id){
  const item=scoreCfgDraft[dim][id];
  item.on=!item.on;
  const row=event.target.closest('.cfg-item');
  if(row) row.classList.toggle('disabled',!item.on);
}
function scoreCfgWeight(dim,id,v){
  scoreCfgDraft[dim][id].w=Math.max(1,Math.min(10,Math.round(Number(v)||1)));
}
function applyScoreCfg(){
  saveScoreCfg(scoreCfgDraft);
  closeScoreCfg();
  const sec=document.getElementById('scoreSection');
  if(sec&&currentAnalysis) sec.innerHTML=buildScoreHTML(currentAnalysis);
}
function resetScoreCfgUI(){
  resetScoreCfg();
  scoreCfgDraft=loadScoreCfg();
  renderScoreCfg();
}

function onAuthReady(){ if(location.hash) doSearch(); }
</script>
