<title>個股分析 — 盤後精選模組</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="js/auth.css">
<style>
:root {
  --ink: #1C2127; --text: #3B3F45; --text-secondary: #6B7280;
  --surface: #F5F2EC; --card: #FFFFFF; --border: #DDD8D0; --border-light: #EBE7E0;
  --gold: #B8860B; --gold-soft: rgba(184,134,11,0.10);
  --teal: #3A7D7B; --teal-soft: rgba(58,125,123,0.08);
  --green: #4A8B6E; --red: #C0544F;
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --radius: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #E8E4DC; --text: #C8C4BC; --text-secondary: #8B8780;
    --surface: #141618; --card: #1E2024; --border: #2E3036; --border-light: #252830;
    --gold: #D4A840; --gold-soft: rgba(212,168,64,0.12);
    --teal: #5AADAB; --teal-soft: rgba(90,173,171,0.10);
    --green: #6BB88E; --red: #E07070;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  }
}
:root[data-theme="dark"] {
  --ink: #E8E4DC; --text: #C8C4BC; --text-secondary: #8B8780;
  --surface: #141618; --card: #1E2024; --border: #2E3036; --border-light: #252830;
  --gold: #D4A840; --gold-soft: rgba(212,168,64,0.12);
  --teal: #5AADAB; --teal-soft: rgba(90,173,171,0.10);
  --green: #6BB88E; --red: #E07070;
  --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow)}
.topbar .brand{font-family:var(--font-display);font-size:18px;color:var(--ink);letter-spacing:-0.02em;white-space:nowrap;text-decoration:none}
.topbar .brand span{color:var(--gold)}
.topbar .spacer{flex:1}
.nav-links{display:flex;gap:12px;flex-wrap:wrap}
.nav-links a{font-size:13px;color:var(--text-secondary);text-decoration:none;padding:4px 8px;border-radius:var(--radius)}
.nav-links a:hover,.nav-links a.active{color:var(--gold);background:var(--gold-soft)}
.search-box{display:flex;gap:8px;align-items:center;position:relative}
.search-box input{font-family:var(--font-mono);font-size:14px;padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);width:140px}
.search-box input::placeholder{color:var(--text-secondary)}
.search-box button{padding:7px 16px;background:var(--gold);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer}
.container{max-width:900px;margin:0 auto;padding:24px 16px 80px}
.empty-state{text-align:center;padding:80px 20px;color:var(--text-secondary);font-size:15px}
.empty-state code{background:var(--gold-soft);padding:2px 6px;border-radius:3px;font-family:var(--font-mono);font-size:13px}
.stk-header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:16px}
.stk-id{font-family:var(--font-mono);font-size:13px;color:var(--text-secondary);letter-spacing:.05em}
.stk-name{font-family:var(--font-display);font-size:28px;color:var(--ink);margin:4px 0 16px}
.price-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price-big{font-family:var(--font-mono);font-size:32px;font-weight:700;letter-spacing:-.02em}
.price-change{font-family:var(--font-mono);font-size:16px;font-weight:600}
.price-date{font-size:12px;color:var(--text-secondary);margin-left:auto}
.ohlcv{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-light)}
.ohlcv-item{text-align:center}
.ohlcv-label{font-size:11px;color:var(--text-secondary);letter-spacing:.04em;margin-bottom:2px}
.ohlcv-val{font-family:var(--font-mono);font-size:15px;color:var(--ink)}
/* ── K線圖區 ── */
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px 12px;margin-bottom:16px;position:relative}
.chart-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chart-toolbar .chart-label{font-family:var(--font-display);font-size:15px;color:var(--ink);margin-right:auto}
.tf-btn,.ind-btn{padding:4px 12px;border:1px solid var(--border);border-radius:99px;font-size:11px;cursor:pointer;background:var(--surface);color:var(--text-secondary);font-family:var(--font-mono)}
.tf-btn.active,.ind-btn.active{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
.ma-legend{display:flex;gap:12px;font-size:11px;font-family:var(--font-mono);flex-wrap:wrap}
.chart-canvas{position:relative;overflow:hidden;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:none}
.chart-canvas canvas{display:block}
.chart-overlay{position:absolute;top:0;left:0;pointer-events:none}
.chart-tooltip{position:absolute;top:0;left:0;pointer-events:none;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:11px;font-family:var(--font-mono);line-height:1.6;white-space:nowrap;box-shadow:var(--shadow);z-index:10;display:none}
.chart-price-tag{position:absolute;right:0;pointer-events:none;background:var(--gold);color:#fff;font-size:10px;font-family:var(--font-mono);padding:1px 6px;border-radius:2px;z-index:9;display:none}
/* ── 籌碼 + 評分 ── */
.chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.chip-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.chip-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.chip-val{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--ink)}
.chip-sub{font-size:12px;color:var(--text-secondary);margin-top:4px;font-family:var(--font-mono)}
.score-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.score-total{padding:20px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border)}
.score-ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:22px;font-weight:700;color:#fff;flex-shrink:0}
.score-total-label{font-family:var(--font-display);font-size:18px;color:var(--ink)}
.score-total-comment{font-size:13px;color:var(--text-secondary);margin-top:4px}
.score-dim{border-bottom:1px solid var(--border-light)}
.score-dim:last-child{border-bottom:none}
.score-dim-header{padding:14px 24px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.score-dim-header:hover{background:var(--gold-soft)}
.score-dim-title{font-family:var(--font-display);font-size:15px;color:var(--ink);flex:1}
.score-dim-badge{font-family:var(--font-mono);font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px}

.score-dim-arrow{font-size:10px;color:var(--text-secondary);transition:transform .2s}

.criteria .icon{flex-shrink:0;width:18px;text-align:center;font-size:14px}
.pass .icon{color:var(--green)}.fail .icon{color:var(--red)}.fail{color:var(--text-secondary)}
.up{color:var(--red)}.dn{color:var(--green)}
/* ── 均線標籤 ── */
.ma-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ma-tag{font-size:11px;font-family:var(--font-mono);padding:3px 10px;border-radius:99px;font-weight:600}

.ma-tag.below{background:rgba(192,84,79,.12);color:var(--red)}
/* ── 技術指標卡片 ── */
.ind-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}

.ind-card-val{font-family:var(--font-mono);font-size:22px;font-weight:700}

/* ── 基本面 ── */
.fund-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
/* ── 個股簡介 ── */
.stk-intro{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.stk-intro-industry{font-size:12px;color:var(--teal);font-weight:600;margin-bottom:6px}
.stk-intro-name{font-family:var(--font-display);font-size:16px;color:var(--ink);margin-bottom:4px}
.stk-intro-meta{font-size:12px;color:var(--text-secondary);line-height:1.7}
/* ── 相關連結 ── */
.ext-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ext-links a{font-size:12px;color:var(--gold);text-decoration:none;padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
.ext-links a:hover{background:var(--gold-soft)}
/* ── 營收 ── */
.rev-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.rev-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.rev-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.rev-val{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--ink)}
.rev-sub{font-size:12px;color:var(--text-secondary);margin-top:4px;font-family:var(--font-mono)}

@media(max-width:640px){.topbar{padding:10px 12px;gap:8px}.chip-grid{grid-template-columns:1fr}.rev-grid{grid-template-columns:1fr}.price-big{font-size:24px}.stk-name{font-size:22px}.container{padding:16px 8px 60px}}
.nav-toggle{display:none;background:none;border:1px solid var(--border);border-radius:var(--radius);font-size:20px;padding:4px 10px;cursor:pointer;color:var(--text)}

.search-dropdown{display:none;position:absolute;top:100%;right:0;z-index:200;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.15);max-height:320px;overflow-y:auto;min-width:240px;margin-top:4px}
.search-dropdown.show{display:block}
.search-item{padding:8px 14px;cursor:pointer;display:flex;gap:8px;font-size:13px;color:var(--text)}
.search-item:hover,.search-item.active{background:var(--gold-soft);color:var(--gold)}
.search-item .sid{font-family:var(--font-mono);font-weight:600;min-width:48px}
.score-custom-toggle{margin-left:auto;font-size:12px;padding:4px 12px;border:1px solid var(--border);border-radius:99px;background:var(--surface);color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.score-custom-toggle.active{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
.score-section .criteria input[type="checkbox"]{display:none;accent-color:var(--gold);margin-right:2px;flex-shrink:0;cursor:pointer}
.score-section.custom-mode .criteria input[type="checkbox"]{display:inline-block}
.score-section.custom-mode .criteria.excluded{opacity:0.35;text-decoration:line-through}

<script>
const input=document.getElementById('stkInput');
if(location.hash){input.value=location.hash.slice(1);setTimeout(doSearch,600);}

let stockList=[];
const dropdown=document.getElementById('searchDropdown');
let ddIdx=-1;
async function loadStockList(){
  if(!sb||stockList.length)return;
  const{data}=await sb.from('daily_heatmap').select('data').order('date',{ascending:false}).limit(1).single();
  if(!data||!data.data)return;
  (data.data.industries||[]).forEach(ind=>(ind.stocks||[]).forEach(s=>stockList.push({id:s.id,name:s.name})));
  stockList.sort((a,b)=>a.id.localeCompare(b.id));
}
input.addEventListener('input',()=>{
  const q=input.value.trim().toLowerCase();
  if(!q||!stockList.length){dropdown.classList.remove('show');return;}
  const matches=stockList.filter(s=>s.id.startsWith(q)||s.name.toLowerCase().includes(q)).slice(0,8);
  if(!matches.length){dropdown.classList.remove('show');return;}
  ddIdx=-1;
  dropdown.innerHTML=matches.map(s=>`<div class="search-item" data-id="${s.id}" onclick="pickStock('${s.id}')"><span class="sid">${s.id}</span><span class="sname">${s.name}</span></div>`).join('');
  dropdown.classList.add('show');
});
input.addEventListener('keydown',e=>{
  const items=dropdown.querySelectorAll('.search-item');
  if(dropdown.classList.contains('show')&&items.length){
    if(e.key==='ArrowDown'){e.preventDefault();ddIdx=Math.min(ddIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('active',i===ddIdx));return;}
    if(e.key==='ArrowUp'){e.preventDefault();ddIdx=Math.max(ddIdx-1,0);items.forEach((el,i)=>el.classList.toggle('active',i===ddIdx));return;}
    if(e.key==='Enter'&&ddIdx>=0){e.preventDefault();pickStock(items[ddIdx].dataset.id);return;}
  }
  if(e.key==='Enter')doSearch();
});
function pickStock(id){input.value=id;dropdown.classList.remove('show');doSearch();}
document.addEventListener('click',e=>{if(!e.target.closest('.search-box'))dropdown.classList.remove('show');});

let currentSid='', currentAnalysis=null, rawDaily=[], currentTF='D', currentInd='kd', customMode=false;
let chartZoom=1, chartPanIdx=0, chartIsDragging=false, chartDragStartX=0, chartDragStartPan=0;
let _chartRAF=0, _chartEventsAttached=false, _cachedMAs=null, _cachedMADataLen=0;
const TF_MAP = {
  '5m':  {interval:'5m',  range:'1mo',  label:'5分'},
  '60m': {interval:'60m', range:'6mo', label:'60分'},
  'D':   {interval:null,  range:null,  label:'日'},
  'W':   {interval:null,  range:null,  label:'週'},
  'M':   {interval:null,  range:null,  label:'月'},
};
let minuteCache = {}; // {key: [{d,o,h,l,c,v}]}

async function doSearch(){
  let sid=input.value.trim(); if(!sid)return;
  if(!/^\d+$/.test(sid)&&stockList.length){const m=stockList.find(s=>s.name===sid);if(m)sid=m.id;else{const p=stockList.find(s=>s.name.includes(sid));if(p)sid=p.id;}}
  const dd=document.getElementById('searchDropdown');if(dd)dd.classList.remove('show');
  input.value=sid;
  location.hash=sid; currentSid=sid; minuteCache={}; currentTF='D'; chartZoom=1; chartPanIdx=0; _chartEventsAttached=false; _cachedMAs=null;
  if(!sb){document.getElementById('app').innerHTML='<div class="empty-state">系統載入中...</div>';return;}

  // 同時抓分析資料和歷史K線
  const [stkRes, priceRes] = await Promise.all([
    sb.from('daily_stk').select('data').eq('stock_id',sid).order('date',{ascending:false}).limit(1).single(),
    sb.from('stock_prices').select('*').eq('stock_id',sid).order('date',{ascending:true}).limit(2600)
  ]);

  if(stkRes.error||!stkRes.data){
    document.getElementById('app').innerHTML='<div class="empty-state">查無 <code>'+sid+'</code> 的分析資料</div>';return;
  }
  currentAnalysis = stkRes.data.data;
  rawDaily = (priceRes.data||[]).filter(r=>r.close>0);

  renderStock(sid, currentAnalysis);
}

function cls(v){return v>0?'up':v<0?'dn':'';}
function sign(v){return v>0?'+'+v:v;}
function fmt(v){return typeof v==='number'?v.toLocaleString('zh-TW'):v;}
function scoreBadge(n){const p=n/10;return p>=.7?'badge-high':p>=.4?'badge-mid':'badge-low';}
function scoreComment(t){if(t>=25)return'多項指標正向';if(t>=20)return'指標偏正向';if(t>=15)return'指標中性';if(t>=10)return'指標偏弱';return'多項指標偏空';}
function scoreColor(t){if(t>=25)return'var(--green)';if(t>=20)return'var(--teal)';if(t>=15)return'var(--gold)';return'var(--red)';}
function fmtRev(v){if(!v)return'—';if(v>=1e8)return(v/1e8).toFixed(1)+'億';if(v>=1e4)return(v/1e4).toFixed(0)+'萬';return fmt(v);}

// ══════════════════════════════════════
// 時間週期轉換
// ══════════════════════════════════════
function aggregateWeekly(data){
  const weeks=[];let w=null;
  data.forEach(d=>{
    const dt=new Date(d.date||d.d);
    const dow=dt.getDay();
    if(!w||dow<=((w._lastDow===undefined)?-1:w._lastDow)){
      if(w)weeks.push(w);
      w={d:d.date||d.d,o:d.open??d.o,h:d.high??d.h,l:d.low??d.l,c:d.close??d.c,v:d.volume??d.v??0,_lastDow:dow};
    } else {
      w.h=Math.max(w.h,d.high??d.h);
      w.l=Math.min(w.l,d.low??d.l);
      w.c=d.close??d.c;
      w.v+=(d.volume??d.v??0);
      w.d=d.date||d.d;
      w._lastDow=dow;
    }
  });
  if(w)weeks.push(w);
  return weeks.map(w=>({d:w.d,o:w.o,h:w.h,l:w.l,c:w.c,v:w.v}));
}
function aggregateMonthly(data){
  const months=[];let m=null,curM='';
  data.forEach(d=>{
    const dt=d.date||d.d;
    const ym=dt.slice(0,7);
    if(ym!==curM){
      if(m)months.push(m);
      curM=ym;
      m={d:dt,o:d.open??d.o,h:d.high??d.h,l:d.low??d.l,c:d.close??d.c,v:d.volume??d.v??0};
    } else {
      m.h=Math.max(m.h,d.high??d.h);
      m.l=Math.min(m.l,d.low??d.l);
      m.c=d.close??d.c;
      m.v+=(d.volume??d.v??0);
      m.d=dt;
    }
  });
  if(m)months.push(m);
  return months;
}
function getChartData(){
  // 分K用 minuteCache
  if(currentTF==='5m'||currentTF==='60m'){
    return minuteCache[currentTF]||[];
  }
  // 日K：合併 stock_prices + daily_stk.history，去重取最新
  const fromDB = rawDaily.map(r=>({d:r.date,o:r.open,h:r.high,l:r.low,c:r.close,v:r.volume||0}));
  const fromAnalysis = (currentAnalysis.history||[]).map(r=>({d:r.d||r.date,o:r.o??r.open,h:r.h??r.high,l:r.l??r.low,c:r.c??r.close,v:r.v??r.volume??0}));
  const dateMap = {};
  fromAnalysis.forEach(r=>{ dateMap[r.d]=r; });
  fromDB.forEach(r=>{ dateMap[r.d]=r; }); // DB 覆蓋同日
  let src = Object.values(dateMap).sort((a,b)=>a.d.localeCompare(b.d));
  if(!src.length) return [];
  if(currentTF==='W') return aggregateWeekly(src);
  if(currentTF==='M') return aggregateMonthly(src);
  return src;
}
async function fetchMinuteData(tf){
  const key=tf;
  if(minuteCache[key]) return minuteCache[key];
  const cfg=TF_MAP[tf];
  try{
    const r=await fetch(`/api/chart?sid=${currentSid}&interval=${cfg.interval}&range=${cfg.range}`);
    if(!r.ok) return [];
    const j=await r.json();
    minuteCache[key]=j.bars||[];
    return minuteCache[key];
  }catch(e){return [];}
}

function renderIntro(sid,d){

  </div>`;
}

// ── 均線狀態標籤 ──
function renderMATags(d){
  if(!d.ma||!d.ma.length) return '';
  const price=d.close;
  const tags=d.ma.map(m=>{
    const above=price>=m.value;
    return `<span class="ma-tag ${above?'above':'below'}">${above?'站上':'跌破'}${m.label}</span>`;
  }).join('');
  return `<div class="ma-tags">${tags}</div>`;
}

// ── 技術指標摘要卡片 ──
function renderIndCards(d){
  const data=getChartData();
  if(data.length<15) return '';
  const kd=calcKD(data), rsi6=calcRSI(data,6), rsi14=calcRSI(data,14), macd=calcMACD(data);
  const last=data.length-1;
  const kv=kd.k[last].toFixed(1), dv=kd.d[last].toFixed(1);
  const r6=rsi6[last].toFixed(1), r14=rsi14[last].toFixed(1);
  const m=macd.dif[last].toFixed(2), sig=macd.macd[last].toFixed(2);
  const kdHint=kd.k[last]>80?'超買區':kd.k[last]<20?'超賣區':'中性';
  const rsiHint=rsi6[last]>80?'超買':rsi6[last]<20?'超賣':'中性';
  const macdHint=macd.dif[last]>macd.macd[last]?'多方動能':'空方動能';
  return `<div class="ind-grid">
    <div class="ind-card"><div class="ind-card-label">KD</div><div class="ind-card-val">${kv}</div><div class="ind-card-sub">D ${dv}・${kdHint}</div></div>
    <div class="ind-card"><div class="ind-card-label">RSI(6)</div><div class="ind-card-val">${r6}</div><div class="ind-card-sub">RSI(14) ${r14}・${rsiHint}</div></div>
    <div class="ind-card"><div class="ind-card-label">MACD</div><div class="ind-card-val">${m}</div><div class="ind-card-sub">Signal ${sig}・${macdHint}</div></div>
  </div>`;
}

async function switchTF(tf){
  currentTF=tf; _cachedMAs=null;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.toggle('active',b.dataset.tf===tf));
  let bars;
  if(tf==='5m'||tf==='60m'){
    bars=await fetchMinuteData(tf);
  } else {
    bars=getChartData();
  }
  if(!bars||bars.length<=2) return;
  const VIS=60;
  if(bars.length>VIS){chartZoom=bars.length/VIS;chartPanIdx=bars.length;}
  else{chartZoom=1;chartPanIdx=0;}
  drawChart(bars);
}

// ══════════════════════════════════════
// K 線圖 (Canvas) — XQ 風格
// ══════════════════════════════════════
let chartDataCache=[];
const MA_COLORS=['#D4A840','#5AADAB','#C0544F','#8060C0'];
const MA_PERIODS=[5,10,20,60];

function calcMA(data,n){
  const r=[];
  for(let i=0;i<data.length;i++){
    if(i<n-1){r.push(null);continue;}
    let s=0;for(let j=i-n+1;j<=i;j++)s+=data[j].c;
    r.push(s/n);
  }
  return r;
}
function calcKD(data){
  const k=[],d=[];
  let prevK=50,prevD=50;
  for(let i=0;i<data.length;i++){
    const period=Math.min(9,i+1);
    const slice=data.slice(Math.max(0,i-period+1),i+1);
    const h=Math.max(...slice.map(x=>x.h));
    const l=Math.min(...slice.map(x=>x.l));
    const rsv=h===l?50:(data[i].c-l)/(h-l)*100;
    const kv=prevK*2/3+rsv/3;
    const dv=prevD*2/3+kv/3;
    k.push(kv);d.push(dv);prevK=kv;prevD=dv;
  }
  return{k,d};
}
function calcRSI(data,n=14){
  const r=[];let avgG=0,avgL=0;
  for(let i=0;i<data.length;i++){
    if(i===0){r.push(50);continue;}
    const chg=data[i].c-data[i-1].c;
    const g=chg>0?chg:0,l=chg<0?-chg:0;
    if(i<=n){avgG=(avgG*(i-1)+g)/i;avgL=(avgL*(i-1)+l)/i;}
    else{avgG=(avgG*(n-1)+g)/n;avgL=(avgL*(n-1)+l)/n;}
    r.push(avgL===0?100:100-100/(1+avgG/avgL));
  }
  return r;
}
function calcMACD(data){
  let e12=data[0].c,e26=data[0].c,sig=0;
  const dif=[],macd=[],osc=[];
  for(let i=0;i<data.length;i++){
    e12=i===0?data[i].c:e12*11/13+data[i].c*2/13;
    e26=i===0?data[i].c:e26*25/27+data[i].c*2/27;
    const d=e12-e26;
    sig=i===0?d:sig*8/10+d*2/10;
    dif.push(d);macd.push(sig);osc.push((d-sig)*2);
  }
  return{dif,macd,osc};
}

// ── 圖表佈局參數（drawChart / crosshair 共用）──
let chartLayout = {};

function drawChart(data){
  chartDataCache=data;
  const canvas=document.getElementById('kCanvas');
  if(!canvas)return;
  const cs=getComputedStyle(document.documentElement);
  const cUp=cs.getPropertyValue('--red').trim()||'#C0544F';
  const cDn=cs.getPropertyValue('--green').trim()||'#4A8B6E';
  const cGrid=cs.getPropertyValue('--border-light').trim()||'#EBE7E0';
  const cText=cs.getPropertyValue('--text-secondary').trim()||'#6B7280';
  const cBg=cs.getPropertyValue('--card').trim()||'#FFFFFF';

  const dpr=window.devicePixelRatio||1;
  const n=data.length;
  const containerW = canvas.parentElement.clientWidth || 700;
  // 縮放：zoom=1 顯示全部，zoom>1 放大（看較少根）
  const baseCw = containerW / n;
  const cw = Math.max(4, Math.min(40, baseCw * chartZoom));
  const totalW = n * cw + 72;
  const W = Math.max(totalW, containerW);
  const priceH=280,volH=80,gap=8,padL=60,padR=12,padT=8,padB=24;
  const H=priceH+gap+volH+padT+padB;

  // 計算可見範圍
  const visibleBars = Math.min(n, Math.ceil((containerW - padL - padR) / cw));
  chartPanIdx = Math.max(0, Math.min(chartPanIdx, n - visibleBars));
  const vStart = Math.floor(chartPanIdx);
  const vEnd = Math.min(n, vStart + visibleBars + 1);
  const visData = data.slice(vStart, vEnd);

  // 固定 canvas 寬度 = 容器寬度（不用捲動，用 pan 平移）
  const drawW = containerW;
  canvas.width=drawW*dpr;canvas.height=H*dpr;
  canvas.style.width=drawW+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,drawW,H);

  // overlay canvas 同步大小
  const overlay=document.getElementById('kOverlay');
  if(overlay){
    overlay.width=drawW*dpr;overlay.height=H*dpr;
    overlay.style.width=drawW+'px';overlay.style.height=H+'px';
  }

  const prices=visData.flatMap(d=>[d.h,d.l]);
  const pMin=Math.min(...prices),pMax=Math.max(...prices);
  const pMargin=(pMax-pMin)*0.05||1;
  const pLo=pMin-pMargin,pHi=pMax+pMargin;
  const yP=v=>padT+(1-(v-pLo)/(pHi-pLo))*priceH;

  const vMax=Math.max(...visData.map(d=>d.v))||1;
  const volTop=padT+priceH+gap;

  // 保存佈局給 crosshair 用
  chartLayout = {drawW,H,padL,padR,padT,padB,priceH,volH,gap,cw,vStart,vEnd,n:visData.length,pLo,pHi,vMax,yP,volTop,data:visData,allData:data,cUp,cDn,cGrid,cText};

  // 網格 + Y 軸
  ctx.font='10px monospace';ctx.textAlign='right';
  for(let i=0;i<=5;i++){
    const pv=pLo+(pHi-pLo)*i/5;
    const yy=yP(pv);
    ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(drawW-padR,yy);ctx.stroke();
    ctx.fillStyle=cText;
    ctx.fillText(pv>=100?pv.toFixed(0):pv.toFixed(1),padL-4,yy+3);
  }
  ctx.fillStyle=cText;ctx.fillText(Math.round(vMax)+'張',padL-4,volTop+10);

  // X 軸日期
  ctx.textAlign='center';
  const dateStep=Math.max(1,Math.floor(visData.length/8));
  for(let i=0;i<visData.length;i+=dateStep){
    const x=padL+i*cw+cw/2;
    ctx.fillStyle=cText;
    const lbl=visData[i].d.length>5?visData[i].d.slice(5):visData[i].d;
    ctx.fillText(lbl,x,padT+priceH+gap+volH+14);
  }

  // K 棒 + 成交量
  visData.forEach((d,i)=>{
    const x=padL+i*cw+cw/2;
    const up=d.c>=d.o;
    const color=up?cUp:cDn;
    const bw2=Math.max(1,cw*0.35);

    ctx.strokeStyle=color;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,yP(d.h));ctx.lineTo(x,yP(d.l));ctx.stroke();

    const top=yP(Math.max(d.o,d.c));
    const bot=yP(Math.min(d.o,d.c));
    const bh=Math.max(bot-top,1);
    if(up){
      ctx.strokeStyle=color;ctx.lineWidth=1;
      ctx.strokeRect(x-bw2,top,bw2*2,bh);
      ctx.fillStyle=cBg;ctx.fillRect(x-bw2+0.5,top+0.5,bw2*2-1,bh-1);
    }else{
      ctx.fillStyle=color;
      ctx.fillRect(x-bw2,top,bw2*2,bh);
    }

    const vh=d.v/vMax*volH;
    ctx.fillStyle=color;ctx.globalAlpha=0.4;
    ctx.fillRect(x-bw2,volTop+volH-vh,bw2*2,vh);
    ctx.globalAlpha=1;
  });

  // MA 均線（快取，只在資料變時重算）
  if(!_cachedMAs||_cachedMADataLen!==data.length){_cachedMAs=MA_PERIODS.map(p=>calcMA(data,p));_cachedMADataLen=data.length;}
  const mas=_cachedMAs;
  mas.forEach((maArr,mi)=>{
    ctx.strokeStyle=MA_COLORS[mi];ctx.lineWidth=1.5;
    ctx.beginPath();let started=false;
    for(let gi=vStart;gi<vEnd;gi++){
      const v=maArr[gi];
      if(v===null)continue;
      const x=padL+(gi-vStart)*cw+cw/2;
      if(!started){ctx.moveTo(x,yP(v));started=true;}
      else ctx.lineTo(x,yP(v));
    }
    ctx.stroke();
  });

  // MA 圖例
  const legend=document.getElementById('maLegend');
  if(legend){
    legend.innerHTML=mas.map((maArr,mi)=>{
      const last=maArr.filter(v=>v!==null).pop();
      return `<span><span style="display:inline-block;width:14px;height:2px;background:${MA_COLORS[mi]};margin-right:4px;vertical-align:middle;border-radius:1px"></span>MA${MA_PERIODS[mi]} ${last!=null?last.toFixed(1):'—'}</span>`;
    }).join('');
  }

  // ── 事件：只掛一次 ──
  if(!_chartEventsAttached) setupChartEvents(canvas);
  drawIndicator(currentInd);
}

function scheduleChartRedraw(){
  if(_chartRAF) return; // 已排程，跳過
  _chartRAF=requestAnimationFrame(()=>{_chartRAF=0;drawChart(chartDataCache);});
}

function setupChartEvents(canvas){
  _chartEventsAttached=true;
  const container=canvas.parentElement;

  // 滾輪縮放（RAF 節流）
  container.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const L=chartLayout;
    if(!L.cw)return;
    const mouseBarFrac=(mx-L.padL)/L.cw;
    const oldZoom=chartZoom;
    const factor=e.deltaY>0?0.85:1.18;
    chartZoom=Math.max(0.5,Math.min(20,chartZoom*factor));
    const zoomRatio=chartZoom/oldZoom;
    chartPanIdx=chartPanIdx+mouseBarFrac*(1-1/zoomRatio);
    scheduleChartRedraw();
  },{passive:false});

  // 拖曳平移（RAF 節流）
  container.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    e.preventDefault(); // 防止瀏覽器文字選取搶走拖曳
    chartIsDragging=true;chartDragStartX=e.clientX;chartDragStartPan=chartPanIdx;
    container.style.cursor='grabbing';
  });
  document.addEventListener('mousemove',e=>{
    if(chartIsDragging){
      const dx=e.clientX-chartDragStartX;
      if(!chartLayout.cw)return;
      chartPanIdx=chartDragStartPan-dx/chartLayout.cw;
      scheduleChartRedraw();
      return;
    }
    drawCrosshair(e);
  });
  document.addEventListener('mouseup',()=>{
    if(chartIsDragging){chartIsDragging=false;container.style.cursor='crosshair';}
  });

  container.addEventListener('mouseleave',()=>{
    if(!chartIsDragging){
      const overlay=document.getElementById('kOverlay');
      const tooltip=document.getElementById('kTooltip');
      const priceTag=document.getElementById('kPriceTag');
      if(overlay){const octx=overlay.getContext('2d');octx.clearRect(0,0,overlay.width,overlay.height);}
      if(tooltip)tooltip.style.display='none';
      if(priceTag)priceTag.style.display='none';
    }
  });

  // 觸控拖曳平移
  let touchStartX=0,touchStartPan=0;
  container.addEventListener('touchstart',e=>{
    if(e.touches.length===1){touchStartX=e.touches[0].clientX;touchStartPan=chartPanIdx;}
  },{passive:true});
  container.addEventListener('touchmove',e=>{
    if(e.touches.length===1&&chartLayout.cw){
      e.preventDefault();
      const dx=e.touches[0].clientX-touchStartX;
      chartPanIdx=touchStartPan-dx/chartLayout.cw;
      scheduleChartRedraw();
    }
  },{passive:false});
}

function drawCrosshair(e){
  const overlay=document.getElementById('kOverlay');
  const tooltip=document.getElementById('kTooltip');
  const priceTag=document.getElementById('kPriceTag');
  const canvas=document.getElementById('kCanvas');
  if(!overlay||!canvas||!chartLayout.data)return;

  const L=chartLayout;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left;
  const my=e.clientY-rect.top;
  if(mx<0||mx>L.drawW||my<0||my>L.H){
    const octx=overlay.getContext('2d');
    octx.clearRect(0,0,overlay.width,overlay.height);
    tooltip.style.display='none';
    if(priceTag)priceTag.style.display='none';
    return;
  }

  const dpr=window.devicePixelRatio||1;
  const octx=overlay.getContext('2d');
  octx.setTransform(dpr,0,0,dpr,0,0);
  octx.clearRect(0,0,L.drawW,L.H);

  // 對應 bar index
  const idx=Math.floor((mx-L.padL)/L.cw);

  // 虛線十字
  octx.strokeStyle=L.cText;octx.lineWidth=0.8;
  octx.setLineDash([4,3]);
  // 水平線
  octx.beginPath();octx.moveTo(L.padL,my);octx.lineTo(L.drawW-L.padR,my);octx.stroke();
  // 垂直線
  if(idx>=0&&idx<L.n){
    const cx=L.padL+idx*L.cw+L.cw/2;
    octx.beginPath();octx.moveTo(cx,L.padT);octx.lineTo(cx,L.padT+L.priceH+L.gap+L.volH);octx.stroke();
  }
  octx.setLineDash([]);

  // 右側價格標籤
  if(my>=L.padT&&my<=L.padT+L.priceH&&priceTag){
    const price=L.pLo+(1-(my-L.padT)/L.priceH)*(L.pHi-L.pLo);
    priceTag.style.display='block';
    priceTag.style.top=my-8+'px';
    priceTag.textContent=price>=100?price.toFixed(0):price.toFixed(2);
  }else if(priceTag){priceTag.style.display='none';}

  // Tooltip
  if(idx>=0&&idx<L.n){
    const d=L.data[idx];
    const globalIdx=L.vStart+idx;
    const prev=globalIdx>0?L.allData[globalIdx-1]:null;
    const chg=prev?(d.c-prev.c):0;
    const chgP=prev&&prev.c?(chg/prev.c*100):0;
    const c=chg>=0?L.cUp:L.cDn;
    tooltip.style.display='block';
    tooltip.style.left=Math.min(mx+16,rect.width-180)+'px';
    tooltip.style.top='8px';
    tooltip.innerHTML=`<div style="margin-bottom:3px;font-weight:600">${d.d}</div>
      開 <span style="color:${c}">${d.o}</span>　高 <span style="color:${c}">${d.h}</span><br>
      低 <span style="color:${c}">${d.l}</span>　收 <span style="color:${c}">${d.c}</span><br>
      量 ${fmt(d.v)}張<br>
      漲跌 <span style="color:${c}">${chg>=0?'+':''}${chg.toFixed(2)} (${chgP>=0?'+':''}${chgP.toFixed(2)}%)</span>`;
  }else{tooltip.style.display='none';}
}

function switchInd(ind){
  currentInd=ind;
  document.querySelectorAll('.ind-btn').forEach(b=>b.classList.toggle('active',b.dataset.ind===ind));
  drawIndicator(ind);
}

function drawIndicator(ind){
  const canvas=document.getElementById('indCanvas');
  if(!canvas||!chartDataCache.length||!chartLayout.data)return;
  const allData=chartDataCache;
  const L=chartLayout;
  const cs=getComputedStyle(document.documentElement);
  const cGrid=cs.getPropertyValue('--border-light').trim()||'#EBE7E0';
  const cText=cs.getPropertyValue('--text-secondary').trim()||'#6B7280';
  const cUp=cs.getPropertyValue('--red').trim()||'#C0544F';
  const cDn=cs.getPropertyValue('--green').trim()||'#4A8B6E';

  const dpr=window.devicePixelRatio||1;
  const cw=L.cw;
  const drawW=L.drawW;
  const H=120;
  const padL=L.padL,padR=L.padR,padT=6,padB=4;

  canvas.width=drawW*dpr;canvas.height=H*dpr;
  canvas.style.width=drawW+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,drawW,H);

  const plotH=H-padT-padB;
  ctx.font='9px monospace';ctx.textAlign='right';

  // 用全資料算指標，只畫可見段
  const vS=L.vStart,vE=L.vEnd;

  if(ind==='kd'){
    const{k,d:dArr}=calcKD(allData);
    const yy=v=>padT+(1-v/100)*plotH;
    [20,50,80].forEach(v=>{
      ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(padL,yy(v));ctx.lineTo(drawW-padR,yy(v));ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle=cText;ctx.fillText(v,padL-4,yy(v)+3);
    });
    ctx.strokeStyle='#D4A840';ctx.lineWidth=1.5;ctx.beginPath();
    for(let gi=vS;gi<vE;gi++){const x=padL+(gi-vS)*cw+cw/2;gi===vS?ctx.moveTo(x,yy(k[gi])):ctx.lineTo(x,yy(k[gi]));}
    ctx.stroke();
    ctx.strokeStyle='#5AADAB';ctx.lineWidth=1.5;ctx.beginPath();
    for(let gi=vS;gi<vE;gi++){const x=padL+(gi-vS)*cw+cw/2;gi===vS?ctx.moveTo(x,yy(dArr[gi])):ctx.lineTo(x,yy(dArr[gi]));}
    ctx.stroke();
    ctx.fillStyle='#D4A840';ctx.textAlign='left';ctx.fillText('K '+k[vE-1].toFixed(1),padL+4,padT+10);
    ctx.fillStyle='#5AADAB';ctx.fillText('D '+dArr[vE-1].toFixed(1),padL+60,padT+10);
  }else if(ind==='rsi'){
    const rsi=calcRSI(allData,14);
    const yy=v=>padT+(1-v/100)*plotH;
    [30,50,70].forEach(v=>{
      ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(padL,yy(v));ctx.lineTo(drawW-padR,yy(v));ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle=cText;ctx.fillText(v,padL-4,yy(v)+3);
    });
    ctx.strokeStyle='#D4A840';ctx.lineWidth=1.5;ctx.beginPath();
    for(let gi=vS;gi<vE;gi++){const x=padL+(gi-vS)*cw+cw/2;gi===vS?ctx.moveTo(x,yy(rsi[gi])):ctx.lineTo(x,yy(rsi[gi]));}
    ctx.stroke();
    ctx.fillStyle='#D4A840';ctx.textAlign='left';ctx.fillText('RSI14 '+rsi[vE-1].toFixed(1),padL+4,padT+10);
  }else if(ind==='macd'){
    const{dif,macd:sig,osc}=calcMACD(allData);
    const visOsc=osc.slice(vS,vE),visDif=dif.slice(vS,vE),visSig=sig.slice(vS,vE);
    const allV=[...visDif,...visSig,...visOsc];
    const vMax=Math.max(...allV.map(Math.abs))||1;
    const yy=v=>padT+plotH/2-v/vMax*(plotH/2);
    ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(padL,yy(0));ctx.lineTo(drawW-padR,yy(0));ctx.stroke();
    ctx.fillStyle=cText;ctx.textAlign='right';ctx.fillText('0',padL-4,yy(0)+3);
    visOsc.forEach((v,i)=>{
      const x=padL+i*cw+cw/2;const bw2=Math.max(1,cw*0.3);
      ctx.fillStyle=v>=0?cUp:cDn;ctx.globalAlpha=0.5;
      const top=v>=0?yy(v):yy(0);const h=Math.abs(yy(v)-yy(0));
      ctx.fillRect(x-bw2,top,bw2*2,h||1);ctx.globalAlpha=1;
    });
    ctx.strokeStyle='#D4A840';ctx.lineWidth=1.5;ctx.beginPath();
    visDif.forEach((v,i)=>{const x=padL+i*cw+cw/2;i===0?ctx.moveTo(x,yy(v)):ctx.lineTo(x,yy(v));});
    ctx.stroke();
    ctx.strokeStyle='#5AADAB';ctx.lineWidth=1.5;ctx.beginPath();
    visSig.forEach((v,i)=>{const x=padL+i*cw+cw/2;i===0?ctx.moveTo(x,yy(v)):ctx.lineTo(x,yy(v));});
    ctx.stroke();
    ctx.textAlign='left';
    ctx.fillStyle='#D4A840';ctx.fillText('DIF '+dif[vE-1].toFixed(2),padL+4,padT+10);
    ctx.fillStyle='#5AADAB';ctx.fillText('MACD '+sig[vE-1].toFixed(2),padL+80,padT+10);
  }
}

// ══════════════════════════════════════
// 營收圖
// ══════════════════════════════════════
function drawRevChart(data){
  const canvas=document.getElementById('revCanvas');
  if(!canvas)return;
  const cs=getComputedStyle(document.documentElement);
  const cUp=cs.getPropertyValue('--red').trim()||'#C0544F';
  const cDn=cs.getPropertyValue('--green').trim()||'#4A8B6E';
  const cGrid=cs.getPropertyValue('--border-light').trim()||'#EBE7E0';
  const cText=cs.getPropertyValue('--text-secondary').trim()||'#6B7280';
  const dpr=window.devicePixelRatio||1;
  const n=data.length;const bw=50;
  const W=Math.max(n*bw+80,400),H=180;
  const padL=60,padR=10,padT=15,padB=32;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const vals=data.map(d=>d.rev).filter(Boolean);
  if(!vals.length)return;
  const vMax=Math.max(...vals);const plotH=H-padT-padB;
  const yy=v=>padT+(1-v/vMax)*plotH;
  ctx.font='10px monospace';ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const v=vMax*i/4;
    ctx.strokeStyle=cGrid;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(padL,yy(v));ctx.lineTo(W-padR,yy(v));ctx.stroke();
    ctx.fillStyle=cText;ctx.fillText(fmtRev(v),padL-4,yy(v)+3);
  }
  ctx.textAlign='center';
  data.forEach((d,i)=>{
    if(!d.rev)return;
    const x=padL+i*bw;const color=d.yoy>=0?cUp:cDn;
    const h=d.rev/vMax*plotH;const rx=2;
    const bx=x+4,by=yy(d.rev),bwi=bw-8,bhi=h;
    ctx.fillStyle=color;ctx.beginPath();
    ctx.moveTo(bx+rx,by);ctx.lineTo(bx+bwi-rx,by);ctx.quadraticCurveTo(bx+bwi,by,bx+bwi,by+rx);
    ctx.lineTo(bx+bwi,by+bhi);ctx.lineTo(bx,by+bhi);ctx.lineTo(bx,by+rx);ctx.quadraticCurveTo(bx,by,bx+rx,by);
    ctx.fill();
    ctx.fillStyle=color;ctx.font='9px monospace';
    ctx.fillText((d.yoy>=0?'+':'')+d.yoy.toFixed(0)+'%',x+bw/2,yy(d.rev)-4);
    ctx.fillStyle=cText;
    ctx.fillText(d.m.length>5?d.m.slice(-5):d.m,x+bw/2,H-padB+14);
  });
}

function renderDim(label,key,score,items){
  return`<div class="score-dim open" data-dim="${key}"><div class="score-dim-header" onclick="this.parentElement.classList.toggle('open')"><span class="score-dim-arrow">▶</span><span class="score-dim-title">${label}</span><span class="score-dim-badge ${scoreBadge(score)}" data-dim-badge="${key}">${score}/10</span></div><div class="score-dim-list">${(items||[]).map((c,i)=>'<div class="criteria '+(c.pass?'pass':'fail')+'" data-ckey="'+key+'_'+i+'"><input type="checkbox" checked onchange="onCriteriaToggle()"><span class="icon">'+(c.pass?'✓':'✗')+'</span><span>'+c.text+'</span></div>').join('')}</div></div>`;
}
function toggleCustomMode(){
  customMode=!customMode;
  const sec=document.querySelector('.score-section');
  const btn=document.querySelector('.score-custom-toggle');
  if(sec)sec.classList.toggle('custom-mode',customMode);
  if(btn){btn.classList.toggle('active',customMode);btn.textContent=customMode?'✓ 自訂模式':'⚙ 自訂評分';}
  updateScoreDisplay();
}
function onCriteriaToggle(){
  const excl={};
  document.querySelectorAll('.score-section .criteria[data-ckey]').forEach(el=>{
    const cb=el.querySelector('input[type="checkbox"]');
    if(cb&&!cb.checked) excl[el.dataset.ckey]=1;
  });
  localStorage.setItem('score_excluded',JSON.stringify(excl));
  updateScoreDisplay();
}
function updateScoreDisplay(){
  if(!currentAnalysis)return;
  const d=currentAnalysis,dims=['chip','fundamental','technical'];
  let totalCustom=0;
  dims.forEach(dim=>{
    const items=d.criteria[dim]||[];
    const dimEl=document.querySelector(`[data-dim="${dim}"]`);
    if(!dimEl)return;
    let en=0,pass=0;
    dimEl.querySelectorAll('.criteria[data-ckey]').forEach((el,i)=>{
      const cb=el.querySelector('input[type="checkbox"]');
      const on=cb?cb.checked:true;
      el.classList.toggle('excluded',!on);
      if(on){en++;if(items[i]&&items[i].pass)pass++;}
    });
    const score=customMode&&en>0?Math.round(pass/en*10):d.scores[dim];
    totalCustom+=score;
    const badge=dimEl.querySelector('[data-dim-badge]');
    if(badge){badge.textContent=score+'/10';badge.className='score-dim-badge '+scoreBadge(score);}
  });
  const ring=document.querySelector('.score-ring');
  const label=document.querySelector('.score-total-label');
  const comment=document.querySelector('.score-total-comment');
  if(customMode){
    if(ring){ring.textContent=totalCustom+'/30';ring.style.background=scoreColor(totalCustom);}
    if(label)label.textContent='自訂評分：'+scoreComment(totalCustom);
  }else{
    const t=(d.scores.chip||0)+(d.scores.fundamental||0)+(d.scores.technical||0);
    if(ring){ring.textContent=t+'/30';ring.style.background=scoreColor(t);}
    if(label)label.textContent='總評分：'+scoreComment(t);
    totalCustom=t;
  }
  if(comment)comment.textContent='籌碼 '+(document.querySelector('[data-dim-badge="chip"]')?.textContent||'')+' ・ 基本 '+(document.querySelector('[data-dim-badge="fundamental"]')?.textContent||'')+' ・ 技術 '+(document.querySelector('[data-dim-badge="technical"]')?.textContent||'');
}
function onAuthReady(){ loadStockList(); if(location.hash) doSearch(); }
</script>
