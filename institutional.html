<title>法人買賣超 — 盤後精選模組</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<div id="topbar"></div>

<div class="container">
  <div>
 <div class="page-title">法人買賣超排行</div>
    <div class="page-desc">三大法人（外資、投信、自營商）每日個股買賣超排行，追蹤法人資金動向。</div>
  </div>

  <!-- ─── 控制列 ─── -->
  <div class="controls">
    <div class="toggle-group" id="instToggle">
      <button class="active" onclick="setInst('foreign')">外資</button>
      <button onclick="setInst('trust')">投信</button>
      <button onclick="setInst('dealer')">自營商</button>
    </div>
    <select class="filter-select" id="marketFilter" onchange="renderAll()">
      <option value="all">上市櫃</option>
      <option value="twse">上市</option>
      <option value="tpex">上櫃</option>
    </select>
    <select class="filter-select" id="industryFilter" onchange="renderAll()">
      <option value="all">所有產業</option>
    </select>
    <span class="date-badge" id="dateBadge"></span>
  </div>

  <!-- ─── 摘要卡 ─── -->
  <div class="summary-grid" id="summaryCards">
    <div class="summary-card"><div class="summary-label" id="sumBuyLabel">買超 Top 1</div><div class="summary-val" id="sumBuyVal">—</div></div>
    <div class="summary-card"><div class="summary-label" id="sumSellLabel">賣超 Top 1</div><div class="summary-val" id="sumSellVal">—</div></div>
    <div class="summary-card"><div class="summary-label">外資+投信同買</div><div class="summary-val" id="sumBoth">—</div></div>
  </div>

  <!-- ─── 雙欄排行 ─── -->
  <div class="dual-rank">
    <div class="rank-panel">
      <div class="rank-header"><span class="buy-tag">▲ 買超排行</span><span class="count" id="buyCount"></span></div>
      <div class="table-wrap" style="max-height:800px;overflow-y:auto">
        <table><thead><tr><th>#</th><th>代號</th><th>名稱</th><th>收盤</th><th>漲跌%</th><th>買超(張)</th><th>連買</th></tr></thead>
        <tbody id="buyBody"></tbody></table>
      </div>
    </div>
    <div class="rank-panel">
      <div class="rank-header"><span class="sell-tag">▼ 賣超排行</span><span class="count" id="sellCount"></span></div>
      <div class="table-wrap" style="max-height:800px;overflow-y:auto">
        <table><thead><tr><th>#</th><th>代號</th><th>名稱</th><th>收盤</th><th>漲跌%</th><th>賣超(張)</th><th>連賣</th></tr></thead>
        <tbody id="sellBody"></tbody></table>
      </div>
    </div>
  </div>
</div>
<div id="footer"></div>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script>
let allData=[], curInst='foreign';
const instLabels={foreign:'外資',trust:'投信',dealer:'自營商'};

function fmt(v){return typeof v==='number'?v.toLocaleString('zh-TW'):v;}
function cls(v){return v>0?'up':v<0?'dn':'';}

async function onAuthReady(){
  if(!sb) return;
  const {data}=await sb.from('stock_metrics')
    .select('stock_id,name,date,close,change_pct,volume,foreign_net_shares,foreign_consec_days,trust_net_shares,trust_consec_days,dealer_consec_days,dealer_net_shares,market_type,industry')
    .order('stock_id');
  if(!data||!data.length){document.getElementById('buyBody').innerHTML='<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-secondary)">尚無資料</td></tr>';return;}
  allData=data;

  // 填充產業篩選
  const industries=[...new Set(data.map(r=>r.industry).filter(Boolean))].sort();
  const sel=document.getElementById('industryFilter');
  industries.forEach(ind=>{const o=document.createElement('option');o.value=ind;o.textContent=ind;sel.appendChild(o);});

  // 日期
  const d=data.find(r=>r.date);
  if(d)document.getElementById('dateBadge').textContent=d.date;

  renderAll();
}

function setInst(inst){
  curInst=inst;
  document.querySelectorAll('#instToggle button').forEach((b,i)=>{
    b.classList.toggle('active',['foreign','trust','dealer'][i]===inst);
  });
  renderAll();
}

function getFiltered(){
  let d=[...allData];
  const mkt=document.getElementById('marketFilter').value;
  if(mkt!=='all') d=d.filter(r=>(r.market_type||'twse')===mkt);
  const ind=document.getElementById('industryFilter').value;
  if(ind!=='all') d=d.filter(r=>r.industry===ind);
  return d;
}

function getNet(r){
  if(curInst==='foreign') return r.foreign_net_shares||0;
  if(curInst==='trust') return r.trust_net_shares||0;
  return r.dealer_net_shares||0;
}
function getConsec(r){
  if(curInst==='foreign') return r.foreign_consec_days||0;
  if(curInst==='trust') return r.trust_consec_days||0;
  return r.dealer_consec_days||0;
}

function renderAll(){
  const data=getFiltered();
  const label=instLabels[curInst];

  // 買超
  const buyers=data.filter(r=>getNet(r)>0).sort((a,b)=>getNet(b)-getNet(a));
  const sellers=data.filter(r=>getNet(r)<0).sort((a,b)=>getNet(a)-getNet(b));

  // 摘要
  document.getElementById('sumBuyLabel').textContent=label+' 買超 Top 1';
  document.getElementById('sumSellLabel').textContent=label+' 賣超 Top 1';
  const topBuy=buyers[0];
  const topSell=sellers[0];
  document.getElementById('sumBuyVal').textContent=topBuy?`${topBuy.stock_id} ${topBuy.name}`:'—';
  document.getElementById('sumSellVal').textContent=topSell?`${topSell.stock_id} ${topSell.name}`:'—';
  const bothCount=data.filter(r=>(r.foreign_net_shares||0)>0&&(r.trust_net_shares||0)>0).length;
  document.getElementById('sumBoth').textContent=bothCount+'檔';

  // 表格
  const maxBuy=buyers.length?getNet(buyers[0]):1;
  const maxSell=sellers.length?Math.abs(getNet(sellers[0])):1;

  document.getElementById('buyCount').textContent=buyers.length+'檔';
  document.getElementById('sellCount').textContent=sellers.length+'檔';

  const top80Buy=buyers.slice(0,80);
  const top80Sell=sellers.slice(0,80);

  document.getElementById('buyBody').innerHTML=top80Buy.map((r,i)=>{
    const net=getNet(r);const consec=getConsec(r);
    const barW=Math.max(2,Math.round(net/maxBuy*80));
    return `<tr onclick="location.href='stk.html#${r.stock_id}'">
      <td>${i+1}</td><td>${r.stock_id}</td><td>${r.name||''}</td>
      <td>${fmt(r.close)}</td>
      <td class="${cls(r.change_pct)}">${r.change_pct>0?'+':''}${(r.change_pct||0).toFixed(2)}%</td>
      <td><span class="net-bar buy" style="width:${barW}px"></span><span class="net-val up">+${fmt(net)}</span></td>
      <td>${consec>0?`<span class="consec buy">${consec}天</span>`:'—'}</td>
    </tr>`;
  }).join('')||'<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-secondary)">無資料</td></tr>';

  document.getElementById('sellBody').innerHTML=top80Sell.map((r,i)=>{
    const net=getNet(r);const consec=getConsec(r);
    const barW=Math.max(2,Math.round(Math.abs(net)/maxSell*80));
    return `<tr onclick="location.href='stk.html#${r.stock_id}'">
      <td>${i+1}</td><td>${r.stock_id}</td><td>${r.name||''}</td>
      <td>${fmt(r.close)}</td>
      <td class="${cls(r.change_pct)}">${r.change_pct>0?'+':''}${(r.change_pct||0).toFixed(2)}%</td>
      <td><span class="net-bar sell" style="width:${barW}px"></span><span class="net-val dn">${fmt(net)}</span></td>
      <td>${consec<0?`<span class="consec sell">${Math.abs(consec)}天</span>`:'—'}</td>
    </tr>`;
  }).join('')||'<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-secondary)">無資料</td></tr>';
}
</script>
