<title>法人買賣超 — 盤後精選模組</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="js/auth.css">
<style>
:root {
  --ink: #1C2127; --text: #3B3F45; --text-secondary: #6B7280;
  --surface: #F5F2EC; --card: #FFFFFF; --border: #DDD8D0; --border-light: #EBE7E0;
  --gold: #B8860B; --gold-soft: rgba(184,134,11,0.10);
  --teal: #3A7D7B; --teal-soft: rgba(58,125,123,0.08);
  --green: #4A8B6E; --red: #C0544F;
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --radius: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #E8E4DC; --text: #C8C4BC; --text-secondary: #8B8780;
    --surface: #141618; --card: #1E2024; --border: #2E3036; --border-light: #252830;
    --gold: #D4A840; --gold-soft: rgba(212,168,64,0.12);
    --teal: #5AADAB; --teal-soft: rgba(90,173,171,0.10);
    --green: #6BB88E; --red: #E07070;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  }
}
:root[data-theme="dark"] {
  --ink: #E8E4DC; --text: #C8C4BC; --text-secondary: #8B8780;
  --surface: #141618; --card: #1E2024; --border: #2E3036; --border-light: #252830;
  --gold: #D4A840; --gold-soft: rgba(212,168,64,0.12);
  --teal: #5AADAB; --teal-soft: rgba(90,173,171,0.10);
  --green: #6BB88E; --red: #E07070;
  --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow)}
.topbar .brand{font-family:var(--font-display);font-size:18px;color:var(--ink);letter-spacing:-0.02em;white-space:nowrap;text-decoration:none}
.topbar .brand span{color:var(--gold)}
.topbar .spacer{flex:1}
.nav-links{display:flex;gap:12px}
.nav-links a{font-size:13px;color:var(--text-secondary);text-decoration:none;padding:4px 8px;border-radius:var(--radius)}
.nav-links a:hover,.nav-links a.active{color:var(--gold);background:var(--gold-soft)}
.container{max-width:1400px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:20px}
.page-title{font-family:var(--font-display);font-size:22px;color:var(--ink);letter-spacing:-0.01em}
.page-desc{font-size:13px;color:var(--text-secondary);line-height:1.7}

/* ─── 控制列 ─── */
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toggle-group{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.toggle-group button{font-size:13px;padding:6px 16px;border:none;background:var(--card);color:var(--text-secondary);cursor:pointer;transition:all .15s;white-space:nowrap}
.toggle-group button.active{background:var(--gold);color:#fff}
.toggle-group button:not(:last-child){border-right:1px solid var(--border)}
.filter-select{font-size:13px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text);cursor:pointer}
.filter-select:focus{outline:none;border-color:var(--gold)}
.date-badge{font-family:var(--font-mono);font-size:13px;color:var(--text-secondary);margin-left:auto}

/* ─── 摘要卡 ─── */
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:center}
.summary-label{font-size:11px;color:var(--text-secondary);margin-bottom:4px}
.summary-val{font-family:var(--font-mono);font-size:20px;font-weight:700}

/* ─── 雙欄排行 ─── */
.dual-rank{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rank-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.rank-header{padding:14px 20px;font-family:var(--font-display);font-size:16px;color:var(--ink);border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:8px}
.rank-header .buy-tag{color:var(--red);font-weight:700}
.rank-header .sell-tag{color:var(--green);font-weight:700}
.rank-header .count{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono);margin-left:auto}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:var(--card);padding:10px 8px;font-size:11px;font-weight:600;color:var(--text-secondary);text-align:right;white-space:nowrap;border-bottom:2px solid var(--border);letter-spacing:.03em}
thead th:nth-child(1){text-align:center;width:30px}
thead th:nth-child(2){text-align:left}
thead th:nth-child(3){text-align:left}
tbody td{padding:8px;font-size:13px;text-align:right;border-bottom:1px solid var(--border-light);white-space:nowrap;font-family:var(--font-mono)}
tbody td:nth-child(1){text-align:center;color:var(--text-secondary);font-size:12px}
tbody td:nth-child(2){text-align:left;font-family:var(--font-body);color:var(--gold);font-weight:500}
tbody td:nth-child(3){text-align:left;font-family:var(--font-body);font-size:12px;color:var(--text-secondary)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--gold-soft)}
.up{color:var(--red)}.dn{color:var(--green)}

/* ─── 淨額條 ─── */
.net-bar{display:inline-block;height:14px;border-radius:2px;min-width:2px;vertical-align:middle}
.net-bar.buy{background:var(--red)}
.net-bar.sell{background:var(--green)}
td .net-val{font-size:11px;margin-left:4px;vertical-align:middle}

/* ─── 連續天數標籤 ─── */
.consec{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;font-weight:600}
.consec.buy{background:rgba(192,84,79,0.12);color:var(--red)}
.consec.sell{background:rgba(74,139,110,0.12);color:var(--green)}

.footer{text-align:center;padding:32px 16px;font-size:12px;color:var(--text-secondary);line-height:1.8}
.loading{text-align:center;padding:60px 20px;color:var(--text-secondary);font-size:15px}
@media(max-width:900px){.dual-rank{grid-template-columns:1fr}.summary-grid{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:640px){.topbar{padding:10px 12px;gap:8px}.container{padding:16px 8px 60px}.controls{gap:6px}.toggle-group button{padding:5px 10px;font-size:12px}thead th,tbody td{padding:6px 4px;font-size:11px}}
.nav-toggle{display:none;background:none;border:1px solid var(--border);border-radius:var(--radius);font-size:20px;padding:4px 10px;cursor:pointer;color:var(--text)}
@media(max-width:768px){.nav-toggle{display:block}.nav-links{display:none;width:100%;order:99}.nav-links.show{display:flex;flex-wrap:wrap}.topbar{flex-wrap:wrap}}
</style>
<link rel="stylesheet" href="js/theme-refine.css">

  <div class="nav-links">

  </div>
  <div class="spacer"></div>
  <div id="authArea"></div>
</div>

<div class="container">
  <div>
    <div class="page-title">📊 法人買賣超排行</div>
    <div class="page-desc">三大法人（外資、投信、自營商）每日個股買賣超排行，追蹤法人資金動向。</div>
  </div>

  <!-- ─── 控制列 ─── -->
  <div class="controls">
    <div class="toggle-group" id="instToggle">
      <button class="active" onclick="setInst('foreign')">外資</button>
      <button onclick="setInst('trust')">投信</button>
      <button onclick="setInst('dealer')">自營商</button>
    </div>
    <select class="filter-select" id="marketFilter" onchange="renderAll()">
      <option value="all">上市櫃</option>
      <option value="twse">上市</option>
      <option value="tpex">上櫃</option>
    </select>
    <select class="filter-select" id="industryFilter" onchange="renderAll()">
      <option value="all">所有產業</option>
    </select>
    <span class="date-badge" id="dateBadge"></span>
  </div>

  <!-- ─── 摘要卡 ─── -->
  <div class="summary-grid" id="summaryCards">
    <div class="summary-card"><div class="summary-label" id="sumBuyLabel">買超 Top 1</div><div class="summary-val" id="sumBuyVal">—</div></div>
    <div class="summary-card"><div class="summary-label" id="sumSellLabel">賣超 Top 1</div><div class="summary-val" id="sumSellVal">—</div></div>
    <div class="summary-card"><div class="summary-label">外資+投信同買</div><div class="summary-val" id="sumBoth">—</div></div>
  </div>

  <!-- ─── 雙欄排行 ─── -->
  <div class="dual-rank">
    <div class="rank-panel">
      <div class="rank-header"><span class="buy-tag">▲ 買超排行</span><span class="count" id="buyCount"></span></div>
      <div class="table-wrap" style="max-height:800px;overflow-y:auto">
        <table><thead><tr><th>#</th><th>代號</th><th>名稱</th><th>收盤</th><th>漲跌%</th><th>買超(張)</th><th>連買</th></tr></thead>
        <tbody id="buyBody"></tbody></table>
      </div>
    </div>
    <div class="rank-panel">
      <div class="rank-header"><span class="sell-tag">▼ 賣超排行</span><span class="count" id="sellCount"></span></div>
      <div class="table-wrap" style="max-height:800px;overflow-y:auto">
        <table><thead><tr><th>#</th><th>代號</th><th>名稱</th><th>收盤</th><th>漲跌%</th><th>賣超(張)</th><th>連賣</th></tr></thead>
        <tbody id="sellBody"></tbody></table>
      </div>
    </div>
  </div>
</div>
<div class="footer">盤後精選模組 — 本站僅整理公開資訊，不構成投資建議，亦非投顧服務。<br>⛰️ 每日自動更新：盤後 15:00（第一次）、22:00（第二次）</div>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
let allData=[], curInst='foreign';
const instLabels={foreign:'外資',trust:'投信',dealer:'自營商'};

function fmt(v){return typeof v==='number'?v.toLocaleString('zh-TW'):v;}
function cls(v){return v>0?'up':v<0?'dn':'';}

async function onAuthReady(){
  if(!sb) return;
  const {data}=await sb.from('stock_metrics')
    .select('stock_id,name,close,change_pct,volume,foreign_net_shares,foreign_consec_days,trust_net_shares,trust_consec_days,dealer_consec_days,dealer_net_shares,market_type,industry')
    .order('stock_id');
  if(!data||!data.length){document.getElementById('buyBody').innerHTML='<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-secondary)">尚無資料</td></tr>';return;}
  allData=data;

  // 填充產業篩選
  const industries=[...new Set(data.map(r=>r.industry).filter(Boolean))].sort();
  const sel=document.getElementById('industryFilter');
  industries.forEach(ind=>{const o=document.createElement('option');o.value=ind;o.textContent=ind;sel.appendChild(o);});

  // 日期
  const d=data.find(r=>r.date);
  if(d)document.getElementById('dateBadge').textContent=d.date;

  renderAll();
}

function setInst(inst){
  curInst=inst;
  document.querySelectorAll('#instToggle button').forEach((b,i)=>{
    b.classList.toggle('active',['foreign','trust','dealer'][i]===inst);
  });
  renderAll();
}

function getFiltered(){
  let d=[...allData];
  const mkt=document.getElementById('marketFilter').value;
  if(mkt!=='all') d=d.filter(r=>(r.market_type||'twse')===mkt);
  const ind=document.getElementById('industryFilter').value;
  if(ind!=='all') d=d.filter(r=>r.industry===ind);
  return d;
}

function getNet(r){
  if(curInst==='foreign') return r.foreign_net_shares||0;
  if(curInst==='trust') return r.trust_net_shares||0;
  return r.dealer_net_shares||0;
}
function getConsec(r){
  if(curInst==='foreign') return r.foreign_consec_days||0;
  if(curInst==='trust') return r.trust_consec_days||0;
  return r.dealer_consec_days||0;
}

function renderAll(){
  const data=getFiltered();
  const label=instLabels[curInst];

  // 買超
  const buyers=data.filter(r=>getNet(r)>0).sort((a,b)=>getNet(b)-getNet(a));
  const sellers=data.filter(r=>getNet(r)<0).sort((a,b)=>getNet(a)-getNet(b));

  // 摘要
  document.getElementById('sumBuyLabel').textContent=label+' 買超 Top 1';
  document.getElementById('sumSellLabel').textContent=label+' 賣超 Top 1';
  const topBuy=buyers[0];
  const topSell=sellers[0];
  document.getElementById('sumBuyVal').textContent=topBuy?`${topBuy.stock_id} ${topBuy.name}`:'—';
  document.getElementById('sumSellVal').textContent=topSell?`${topSell.stock_id} ${topSell.name}`:'—';
  const bothCount=data.filter(r=>(r.foreign_net_shares||0)>0&&(r.trust_net_shares||0)>0).length;
  document.getElementById('sumBoth').textContent=bothCount+'檔';

  // 表格
  const maxBuy=buyers.length?getNet(buyers[0]):1;
  const maxSell=sellers.length?Math.abs(getNet(sellers[0])):1;

  document.getElementById('buyCount').textContent=buyers.length+'檔';
  document.getElementById('sellCount').textContent=sellers.length+'檔';

  const top80Buy=buyers.slice(0,80);
  const top80Sell=sellers.slice(0,80);

  document.getElementById('buyBody').innerHTML=top80Buy.map((r,i)=>{
    const net=getNet(r);const consec=getConsec(r);
    const barW=Math.max(2,Math.round(net/maxBuy*80));
    return `<tr onclick="location.href='stk.html#${r.stock_id}'">
      <td>${i+1}</td><td>${r.stock_id}</td><td>${r.name||''}</td>
      <td>${fmt(r.close)}</td>
      <td class="${cls(r.change_pct)}">${r.change_pct>0?'+':''}${(r.change_pct||0).toFixed(2)}%</td>
      <td><span class="net-bar buy" style="width:${barW}px"></span><span class="net-val up">+${fmt(net)}</span></td>
      <td>${consec>0?`<span class="consec buy">${consec}天</span>`:'—'}</td>
    </tr>`;
  }).join('')||'<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-secondary)">無資料</td></tr>';

  document.getElementById('sellBody').innerHTML=top80Sell.map((r,i)=>{
    const net=getNet(r);const consec=getConsec(r);
    const barW=Math.max(2,Math.round(Math.abs(net)/maxSell*80));
    return `<tr onclick="location.href='stk.html#${r.stock_id}'">
      <td>${i+1}</td><td>${r.stock_id}</td><td>${r.name||''}</td>
      <td>${fmt(r.close)}</td>
      <td class="${cls(r.change_pct)}">${r.change_pct>0?'+':''}${(r.change_pct||0).toFixed(2)}%</td>
      <td><span class="net-bar sell" style="width:${barW}px"></span><span class="net-val dn">${fmt(net)}</span></td>
      <td>${consec<0?`<span class="consec sell">${Math.abs(consec)}天</span>`:'—'}</td>
    </tr>`;
  }).join('')||'<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-secondary)">無資料</td></tr>';
}
</script>
