<title>自訂篩選 — 盤後精選模組</title>
<meta name="description" content="自訂篩選：從股價、成交量、法人動向與營收等條件篩選台股。">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<div id="topbar"></div>

<div class="container">
  <h1 class="page-title">自訂篩選</h1>
  <p class="subtitle">自由調整篩選條件，從 stock_metrics 表即時查詢。每日盤後更新指標。</p>

  <div class="filter-panel">
    <div class="filter-grid">
      <div class="filter-group">
        <label>股價區間</label>
        <div class="filter-row"><input type="number" id="f_close_min" placeholder="最低" aria-label="最低股價"> <span>~</span> <input type="number" id="f_close_max" placeholder="最高" aria-label="最高股價"></div>
      </div>
      <div class="filter-group">
        <label>漲跌幅 %</label>
        <div class="filter-row"><input type="number" id="f_chg_min" placeholder="最低" step="0.1" aria-label="最低漲跌幅"> <span>~</span> <input type="number" id="f_chg_max" placeholder="最高" step="0.1" aria-label="最高漲跌幅"></div>
      </div>
      <div class="filter-group">
        <label>成交張數 ≥</label>
        <div class="filter-row"><input type="number" id="f_vol_min" placeholder="如 1000" aria-label="最低成交張數"></div>
      </div>
      <div class="filter-group">
        <label>外資連買天數 ≥</label>
        <div class="filter-row"><input type="number" id="f_foreign_min" placeholder="如 3" aria-label="最低外資連買天數"></div>
      </div>
      <div class="filter-group">
        <label>投信連買天數 ≥</label>
        <div class="filter-row"><input type="number" id="f_trust_min" placeholder="如 2" aria-label="最低投信連買天數"></div>
      </div>
      <div class="filter-group">
        <label>營收 YOY % ≥</label>
        <div class="filter-row"><input type="number" id="f_yoy_min" placeholder="如 20" step="1" aria-label="最低營收年增率"></div>
      </div>
      <div class="filter-group">
        <label>營收 MOM % ≥</label>
        <div class="filter-row"><input type="number" id="f_mom_min" placeholder="如 0" step="1" aria-label="最低營收月增率"></div>
      </div>
      <div class="filter-group">
        <label>營收連續成長月數 ≥</label>
        <div class="filter-row"><input type="number" id="f_grow_min" placeholder="如 3" aria-label="最低營收連續成長月數"></div>
      </div>
      <div class="filter-group">
        <label>5日乖離率 % 範圍</label>
        <div class="filter-row"><input type="number" id="f_bias_min" placeholder="-3" step="0.1" aria-label="最低乖離率"> <span>~</span> <input type="number" id="f_bias_max" placeholder="7" step="0.1" aria-label="最高乖離率"></div>
      </div>
    </div>
    <div class="filter-actions">
      <button class="btn-filter" onclick="doFilter()">篩選</button>
      <button class="btn-reset" onclick="resetFilters()">清除條件</button>
      <span class="result-count" id="resultCount"></span>
    </div>
  </div>

  <div class="results" id="results">
    <div class="empty-msg">設定條件後按「篩選」</div>
  </div>
</div>
<div id="footer"></div>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/init.js"></script>
<script>
const COLS = [
  {key:'stock_id',label:'股號',align:'left'},
  {key:'name',label:'名稱',align:'left'},
  {key:'close',label:'收盤價'},
  {key:'change_pct',label:'漲跌%'},
  {key:'volume',label:'成交張'},
  {key:'foreign_consec_days',label:'外資連買日'},
  {key:'trust_consec_days',label:'投信連買日'},
  {key:'rev_yoy',label:'YOY%'},
  {key:'rev_mom',label:'MOM%'},
  {key:'rev_consec_grow',label:'連續成長月'},
  {key:'bias_5',label:'乖離率%'},
];

let sortCol = 'volume';
let sortAsc = false;
let lastData = [];
let limit = 200;

function getVal(id){ const v=document.getElementById(id).value; return v===''?null:parseFloat(v); }

async function doFilter(){
  if(!sb){document.getElementById('results').innerHTML='<div class="empty-msg">系統載入中...</div>';return;}

  let q = sb.from('stock_metrics').select('*').order(sortCol,{ascending:sortAsc}).limit(limit);

  const fns = [
    ['f_close_min','close','gte'], ['f_close_max','close','lte'],
    ['f_chg_min','change_pct','gte'], ['f_chg_max','change_pct','lte'],
    ['f_vol_min','volume','gte'],
    ['f_foreign_min','foreign_consec_days','gte'],
    ['f_trust_min','trust_consec_days','gte'],
    ['f_yoy_min','rev_yoy','gte'],
    ['f_mom_min','rev_mom','gte'],
    ['f_grow_min','rev_consec_grow','gte'],
    ['f_bias_min','bias_5','gte'], ['f_bias_max','bias_5','lte'],
  ];

  for(const [id,col,op] of fns){
    const v = getVal(id);
    if(v!==null) q = q[op](col, v);
  }

  const {data,error} = await q;
  if(error){document.getElementById('results').innerHTML='<div class="empty-msg">查詢失敗: '+error.message+'</div>';return;}

  lastData = data || [];
  document.getElementById('resultCount').textContent = lastData.length + ' 檔符合';
  renderTable();
}

function renderTable(){
  if(!lastData.length){document.getElementById('results').innerHTML='<div class="empty-msg">無符合條件的標的</div>';return;}

  const ths = COLS.map(c=>{
    const sorted = c.key===sortCol;
    const arrow = sorted?(sortAsc?'↑':'↓'):'';
    return `<th class="${sorted?'sorted':''}" onclick="changeSort('${c.key}')">${c.label}<span class="sort-arrow">${arrow}</span></th>`;
  }).join('');

  const rows = lastData.map(row=>{
    return '<tr onclick="location.href=\'stk.html#'+row.stock_id+'\'">' + COLS.map(c=>{
      let v = row[c.key];
      if(c.key==='stock_id'||c.key==='name') return '<td>'+v+'</td>';
      if(c.key==='change_pct') return `<td class="${pctClass(v)}">${fmtPct(v,2)}</td>`;
      if(c.key==='rev_yoy'||c.key==='rev_mom'||c.key==='bias_5') return '<td class="'+pctClass(v)+'">'+fmtPct(v,2)+'</td>';
      if(typeof v==='number') return '<td>'+fmtVal(v)+'</td>';
      return '<td>'+(v??'—')+'</td>';
    }).join('') + '<td>'+starBtn(row.stock_id)+'</td></tr>';
  }).join('');

  const more = lastData.length >= limit ? `<div class="load-more-wrap"><button class="btn" onclick="loadMore()">載入更多</button></div>` : '';
  document.getElementById('results').innerHTML = `<div class="table-wrap"><table><thead><tr>${ths}<th></th></tr></thead><tbody>${rows}</tbody></table></div>${more}`;
}

function loadMore(){
  limit += 200;
  doFilter();
}

function changeSort(col){
  if(sortCol===col) sortAsc=!sortAsc;
  else{sortCol=col;sortAsc=false;}
  doFilter();
}

function resetFilters(){
  document.querySelectorAll('.filter-panel input').forEach(i=>i.value='');
  limit = 200;
  document.getElementById('results').innerHTML='<div class="empty-msg">設定條件後按「篩選」</div>';
  document.getElementById('resultCount').textContent='';
}

function onDataReady(){ /* ready */ }
</script>
