<title>題材概念股 — 盤後精選模組</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<div id="topbar"></div>

<div class="container">
  <div class="page-header">
    <h2>題材概念股</h2>
    <p>依投資題材分類的概念股群組，顯示各題材當日平均漲跌幅與領漲股。點擊可展開成分股明細。</p>
  </div>
 <div id="app"><div class="loading">載入題材資料...</div></div>
</div>
<div id="detailModal" class="concept-detail" onclick="if(event.target===this)closeDetail()"></div>
<div id="footer"></div>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script>
// ── 題材概念股對照表 ──
const CONCEPTS = [
  {key:'ai_server', title:'AI 伺服器', desc:'AI 訓練/推論伺服器組裝與關鍵零組件供應鏈',
   ids:['2382','3231','2324','4938','3450','2356','3005','6669','5765','3035']},
  {key:'cowos', title:'CoWoS／先進封裝', desc:'AI 晶片 CoWoS 先進封裝產能擴張受惠供應鏈',
   ids:['2330','3711','2449','6770','3037','6239','2351','4952','3529']},
  {key:'ic_design', title:'IC 設計', desc:'手機 SoC、利基型與 ASIC 設計服務',
   ids:['2454','3443','2379','6415','3661','5274','3034','2436','6547']},
  {key:'memory', title:'記憶體', desc:'DRAM/NAND 製造、模組與控制 IC',
   ids:['2337','4967','6510','3450','2344','8299','3006']},
  {key:'thermal', title:'散熱', desc:'AI 晶片散熱：氣冷 3D VC 到水冷板/液冷',
   ids:['3017','6230','2059','6166','3032','3653','6223']},
  {key:'pcb', title:'PCB', desc:'ABF 載板、CCL 與高階 HDI',
   ids:['4958','2353','3037','8046','6274','3673','2313']},
  {key:'silicon_photonics', title:'矽光子／光通訊', desc:'CPO 共同封裝光學與高速光收發模組',
   ids:['2455','3714','4966','6209','5309','3702','2327']},
  {key:'passive', title:'被動元件', desc:'MLCC、晶片電阻與電感',
   ids:['2327','3257','2375','6285','2456']},
  {key:'robot', title:'機器人', desc:'人形機器人工業自動化關鍵零組件',
   ids:['2231','4523','2049','6289','4510','1590','2059']},
  {key:'tesla', title:'特斯拉鏈', desc:'電動車 Tier-1 零組件供應鏈',
   ids:['2308','6152','3661','2395','3665','1513','2231']},
  {key:'apple', title:'蘋果概念', desc:'iPhone/Mac 供應鏈核心',
   ids:['2317','2354','3231','2474','6278','4938','2498']},
  {key:'military', title:'軍工', desc:'國防自主、無人機與太空品供應鏈',
   ids:['2208','2634','2014','1513','2233','2601','4722']},
  {key:'finance', title:'金融', desc:'大型金控（市值權值股）',
   ids:['2881','2882','2886','2891','2884','2880','5880','2883']},
  {key:'shipping', title:'航運', desc:'貨櫃三雄、散裝與航空',
   ids:['2603','2609','2615','2605','2606','2608','2610']},
  {key:'construction', title:'營建資產', desc:'建商與資產股',
   ids:['2504','2501','2542','2520','5522','2534','2527','2530']},
  {key:'biotech', title:'生技新藥', desc:'新藥研發、CDMO 與疫苗',
   ids:['4743','6472','4174','4726','1734','4130','6446']},
  {key:'heavy_elec', title:'重電', desc:'電網強韌化、變壓器與輸配電設備',
   ids:['1503','1504','1513','1514','1519','8261','6806']},
  {key:'panel', title:'面板', desc:'TFT-LCD 與電子紙顯示',
   ids:['2409','3481','6116','6285','3050']},
  {key:'green_energy', title:'綠能儲能', desc:'太陽能、離岸風電與儲能系統',
   ids:['6464','3691','6443','3576','6806','3708','6244']},
  {key:'leo_satellite', title:'低軌衛星', desc:'LEO 衛星地面站設備與天線射頻',
   ids:['3231','2455','6285','3380','5309','4977','3714']},
];

let metricsMap = {};

function fmt(v){ return typeof v==='number' ? v.toLocaleString('zh-TW') : v; }

async function loadConcepts(){
  if(!sb){ document.getElementById('app').innerHTML='<div class="loading">系統載入中...</div>'; return; }

  // 收集所有需要的股票 ID
  const allIds = [...new Set(CONCEPTS.flatMap(c => c.ids))];

  const { data, error } = await sb.from('stock_metrics')
    .select('stock_id,name,close,change_pct,volume')
    .in('stock_id', allIds);

  if(error || !data){ document.getElementById('app').innerHTML=errorBox('載入失敗','loadConcepts()'); return; }

  data.forEach(d => { metricsMap[d.stock_id] = d; });

  // 計算每個題材的統計
  const cards = CONCEPTS.map(c => {
    const stocks = c.ids.map(id => metricsMap[id]).filter(Boolean);
    if(!stocks.length) return null;
    const avgChg = stocks.reduce((s, d) => s + (d.change_pct || 0), 0) / stocks.length;
    const leader = stocks.reduce((best, d) => (d.change_pct||0) > (best.change_pct||0) ? d : best, stocks[0]);
    return { ...c, stocks, avgChg, leader, count: stocks.length };
  }).filter(Boolean);

  // 按漲跌幅排序
  cards.sort((a, b) => b.avgChg - a.avgChg);

  const html = '<div class="concept-grid">' + cards.map(c => {
    const cls = c.avgChg >= 0 ? 'up' : 'dn';
    const arrow = c.avgChg >= 0 ? '▲' : '▼';
    const borderColor = c.avgChg >= 0 ? 'var(--red)' : 'var(--green)';
    const lChg = c.leader.change_pct || 0;
    const lCls = lChg >= 0 ? 'up' : 'dn';
    return `<div class="concept-card" onclick="showDetail('${c.key}')">
      <div class="border-left" style="background:${borderColor}"></div>
      <div class="card-top">
        <div class="card-title">${c.title}</div>
        <div class="card-chg ${cls}">${arrow}${Math.abs(c.avgChg).toFixed(2)}%</div>
      </div>
      <div class="card-desc">${c.desc}</div>
      <div class="card-bottom">
        <span class="card-count">${c.count} 檔</span>
        <span class="card-leader">領漲 <span class="lname">${c.leader.name||c.leader.stock_id}</span> <span class="${lCls}">${lChg>=0?'+':''}${lChg.toFixed(2)}%</span></span>
      </div>
    </div>`;
  }).join('') + '</div>';

  document.getElementById('app').innerHTML = html;
}

function showDetail(key){
  const c = CONCEPTS.find(x => x.key === key);
  if(!c) return;
  const stocks = c.ids.map(id => metricsMap[id]).filter(Boolean);
  stocks.sort((a, b) => (b.change_pct||0) - (a.change_pct||0));
  const rows = stocks.map(d => {
    const chg = d.change_pct || 0;
    const cls = chg >= 0 ? 'up' : 'dn';
    return `<tr onclick="location.href='stk.html#${d.stock_id}'">
      <td>${d.stock_id}</td><td>${d.name||'—'}</td>
      <td>${fmt(d.close)}</td>
      <td class="${cls}">${chg>=0?'+':''}${chg.toFixed(2)}%</td>
      <td>${fmt(d.volume)}</td>
    </tr>`;
  }).join('');

  const avgChg = stocks.reduce((s, d) => s + (d.change_pct||0), 0) / stocks.length;
  const cls = avgChg >= 0 ? 'up' : 'dn';

  document.getElementById('detailModal').innerHTML = `<div class="detail-box">
    <div class="detail-header">
      <div><span class="detail-title">${c.title}</span> <span class="card-chg ${cls}" style="font-size:16px;margin-left:8px">${avgChg>=0?'+':''}${avgChg.toFixed(2)}%</span></div>
 <button class="detail-close" onclick="closeDetail()" aria-label="關閉"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px">${c.desc}</p>
    <table><thead><tr><th>股號</th><th>名稱</th><th>收盤價</th><th>漲跌%</th><th>成交張</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
  document.getElementById('detailModal').classList.add('show');
}

function closeDetail(){
  document.getElementById('detailModal').classList.remove('show');
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDetail(); });

function onAuthReady(){ loadConcepts(); }
</script>
