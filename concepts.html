let metricsMap = {};

function fmt(v){ return fmtVal(v); }

async function loadConcepts(){
  if(!sb){ document.getElementById('app').innerHTML='<div class="loading">系統載入中...</div>'; return; }

  // 收集所有需要的股票 ID
  const allIds = [...new Set(CONCEPTS.flatMap(c => c.ids))];

  const { data, error } = await sb.from('stock_metrics')
    .select('stock_id,name,close,change_pct,volume,foreign_net_shares,rev_yoy')
    .in('stock_id', allIds);

  if(error || !data){ document.getElementById('app').innerHTML=errorBox('載入失敗','loadConcepts()'); return; }

  data.forEach(d => { metricsMap[d.stock_id] = d; });

  // 計算每個題材的統計
  const cards = CONCEPTS.map(c => {
    const stocks = c.ids.map(id => metricsMap[id]).filter(Boolean);
    if(!stocks.length) return null;
    const avgChg = stocks.reduce((s, d) => s + (d.change_pct || 0), 0) / stocks.length;
    const leader = stocks.reduce((best, d) => (d.change_pct||0) > (best.change_pct||0) ? d : best, stocks[0]);
    const upCount = stocks.filter(d => (d.change_pct||0) > 0).length;
    const dnCount = stocks.filter(d => (d.change_pct||0) < 0).length;
    return { ...c, stocks, avgChg, leader, count: stocks.length, upCount, dnCount };
  }).filter(Boolean);

  // 按漲跌幅排序
  cards.sort((a, b) => b.avgChg - a.avgChg);

  const upTotal = cards.filter(c => c.avgChg > 0).length;
  const dnTotal = cards.filter(c => c.avgChg < 0).length;
  const best = cards[0], worst = cards[cards.length-1];
  const summary = `<div class="summary-grid">
    <div class="summary-card"><div class="summary-label">題材總數</div><div class="summary-val">${cards.length}<span class="unit">組</span></div><div class="summary-sub">${CONCEPTS.length} 組題材定義</div></div>
    <div class="summary-card"><div class="summary-label">上漲題材</div><div class="summary-val up">${upTotal}<span class="unit">組</span></div><div class="summary-sub">下跌 ${dnTotal} 組</div></div>
    <div class="summary-card"><div class="summary-label">最強題材</div><div class="summary-val" style="font-size:15px">${best?best.title:'—'}</div><div class="summary-sub ${best?pctClass(best.avgChg):''}">${best?fmtPct(best.avgChg,2):'—'}</div></div>
    <div class="summary-card"><div class="summary-label">最弱題材</div><div class="summary-val" style="font-size:15px">${worst?worst.title:'—'}</div><div class="summary-sub ${worst?pctClass(worst.avgChg):''}">${worst?fmtPct(worst.avgChg,2):'—'}</div></div>
  </div>`;

  const html = summary
    + '<div class="section-title" style="margin-top:8px">題材關係圖</div>'
    + '<div class="graph-box"><div class="graph-legend"><span class="legend-item"><i style="background:rgba(192,84,79,.28)"></i>上漲</span><span class="legend-item"><i style="background:rgba(74,139,110,.28)"></i>下跌</span><span class="legend-item">→ 供應方向（上游→下游）</span><span class="legend-item">雙擊節點聚焦子圖</span><button class="btn btn-sm" id="graphReset" style="display:none;margin-left:auto" onclick="resetGraphFocus()">全部顯示</button></div><div id="graphSvg"></div><p class="graph-note">顏色為當日題材平均漲跌（紅漲綠跌）；拓撲為編輯維護、漲跌即時更新。點節點看成分股。</p></div>'
    + '<div class="concept-grid">' + cards.map(c => {
    const cls = pctClass(c.avgChg);
    const arrow = c.avgChg > 0 ? '▲' : c.avgChg < 0 ? '▼' : '';
    const borderColor = c.avgChg > 0 ? 'var(--red)' : c.avgChg < 0 ? 'var(--green)' : 'var(--border)';
    const lChg = c.leader.change_pct || 0;
    const lCls = pctClass(lChg);
    return `<div class="concept-card" data-key="${c.key}" onclick="showDetail('${c.key}')">
      <div class="border-left" style="background:${borderColor}"></div>
      <div class="card-top">
        <div class="card-title">${c.title}</div>
        <div class="card-chg ${cls}">${arrow} ${fmtPct(c.avgChg,2)}</div>
      </div>
      <div class="card-desc">${c.desc}</div>
      <div class="card-bottom">
        <span class="card-count">${c.count} 檔</span>
        <span class="card-updn"><b class="up">漲 ${c.upCount}</b> / <b class="dn">跌 ${c.dnCount}</b></span>
        <span class="card-leader">領漲 <span class="lname">${c.leader.name||c.leader.stock_id}</span> <span class="${lCls}">${fmtPct(lChg,2)}</span></span>
      </div>
    </div>`;
  }).join('') + '</div>';

  document.getElementById('app').innerHTML = html;
  graphCards = cards;
  renderGraph();
}

// ── 題材關係圖（簡版：上游 → 中游 → 下游） ──
let graphCards = [];
let graphFocusKey = null;
function renderGraph(){
  const cards = graphCards;
  const byKey = Object.fromEntries(cards.map(c => [c.key, c]));
  const related = cards.filter(c => (c.up && c.up.length) || (c.down && c.down.length));
  const tiers = {0: [], 1: [], 2: []};
  related.forEach(c => tiers[c.tier ?? 1].push(c));
  const H = Math.max(380, ...Object.values(tiers).map(a => Math.max(a.length, 1) * 92));
  const TIER_X = {0: 95, 1: 345, 2: 595};
  const nodes = {};
  Object.entries(tiers).forEach(([t, arr]) => {
    const start = (H - arr.length * 92) / 2 + 46;
    arr.forEach((c, i) => { nodes[c.key] = { x: TIER_X[t], y: start + i * 92 }; });
  });
  const edgeSet = new Set();
  const edges = [];
  related.forEach(c => {
    [...(c.up || []), ...(c.down || [])].forEach(o => {
      if (!nodes[c.key] || !nodes[o]) return;
      const a = c.up && c.up.includes(o) ? o : c.key;   // 上游 → 本題材
      const b = c.up && c.up.includes(o) ? c.key : o;   // 本題材 → 下游
      const k = a + '>' + b;
      if (edgeSet.has(k)) return;
      edgeSet.add(k);
      edges.push([a, b]);
    });
  });
  const W = 690;
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="graph-svg" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9AA0A6"/></marker></defs>`;
  edges.forEach(([a, b]) => {
    const p = nodes[a], q = nodes[b];
    svg += `<line x1="${p.x + 62}" y1="${p.y}" x2="${q.x - 62}" y2="${q.y}" stroke="#9AA0A6" stroke-width="1.4" marker-end="url(#arrow)" opacity="0.55"/>`;
  });
  const focusSet = new Set();
  if(graphFocusKey && nodes[graphFocusKey]){
    const c = byKey[graphFocusKey];
    [...(c.up||[]), ...(c.down||[]), graphFocusKey].forEach(k2 => focusSet.add(k2));
  }
  Object.entries(nodes).forEach(([k, {x, y}]) => {
    const c = byKey[k];
    if (!c) return;
    const up = c.avgChg > 0;
    const dn = c.avgChg < 0;
    const fill = up ? 'rgba(192,84,79,0.10)' : dn ? 'rgba(74,139,110,0.10)' : 'var(--surface)';
    const dim = graphFocusKey && !focusSet.has(k);
    svg += `<g class="graph-node" style="cursor:pointer;${dim?'opacity:0.15':''}" onclick="showDetail('${k}')" ondblclick="focusGraph('${k}')">
      <rect x="${x - 62}" y="${y - 26}" width="124" height="52" rx="11" fill="${fill}" stroke="var(--border)"/>
      <text x="${x}" y="${y - 5}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${c.title}</text>
      <text x="${x}" y="${y + 13}" text-anchor="middle" font-size="10.5" fill="var(--text-secondary)" font-family="monospace">${c.avgChg >= 0 ? '+' : ''}${c.avgChg.toFixed(2)}%</text>
    </g>`;
  });
  svg += '</svg>';
  document.getElementById('graphSvg').innerHTML = svg;
  document.getElementById('graphReset').style.display = graphFocusKey ? '' : 'none';
}

function focusGraph(key){
  graphFocusKey = (graphFocusKey === key) ? null : key;
  renderGraph();
  document.getElementById('graphSvg').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function resetGraphFocus(){
  graphFocusKey = null;
  renderGraph();
}

function showDetail(key){
  const c = CONCEPTS.find(x => x.key === key);
  if(!c) return;
  const stocks = c.ids.map(id => metricsMap[id]).filter(Boolean);
  stocks.sort((a, b) => (b.change_pct||0) - (a.change_pct||0));
  const rows = stocks.map(d => {
    const chg = d.change_pct || 0;
    const cls = pctClass(chg);
    const fn = d.foreign_net_shares||0;
    const ry = d.rev_yoy;
    return `<tr onclick="location.href='stk.html#${d.stock_id}'">
      <td>${d.stock_id}</td><td>${d.name||'—'}</td>
      <td>${fmt(d.close)}</td>
      <td class="${cls}">${fmtPct(chg,2)}</td>
      <td>${fmt(d.volume)}</td>
      <td class="${pctClass(fn)}">${fn>0?'+':''}${fmt(fn)}</td>
      <td class="${ry!=null?pctClass(ry):''}">${ry!=null?fmtPct(ry,1):'—'}</td>
    </tr>`;
  }).join('');

  const avgChg = stocks.reduce((s, d) => s + (d.change_pct||0), 0) / stocks.length;
  const cls = avgChg >= 0 ? 'up' : 'dn';
  const rel = (arr, label) => (arr && arr.length)
    ? `<div class="rel-row"><span class="rel-label">${label}</span>${arr.map(k => { const x = CONCEPTS.find(cc => cc.key === k); return x ? `<button class="rel-chip" onclick="jumpConcept('${k}')">${x.title}</button>` : ''; }).join('')}</div>`
    : '';

  document.getElementById('detailModal').innerHTML = `<div class="detail-box">
    <div class="detail-header">
      <div><span class="detail-title">${c.title}</span> <span class="card-chg ${cls}" style="font-size:16px;margin-left:8px">${avgChg>=0?'+':''}${avgChg.toFixed(2)}%</span></div>
 <button class="detail-close" onclick="closeDetail()" aria-label="關閉"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px">${c.desc}</p>
    ${rel(c.up, '上游')}${rel(c.down, '下游')}
    <table><thead><tr><th>股號</th><th>名稱</th><th>收盤價</th><th>漲跌%</th><th>成交張</th><th>外資買賣超(張)</th><th>營收YoY</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
  document.getElementById('detailModal').classList.add('show');
}

function jumpConcept(key){
  closeDetail();
  showDetail(key);
  const card = document.querySelector(`.concept-card[data-key="${key}"]`);
  if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
}

function closeDetail(){
  document.getElementById('detailModal').classList.remove('show');
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDetail(); });

function onDataReady(){ loadConcepts(); }
