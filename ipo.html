<title>股票抽籤 — 盤後精選模組</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<div id="topbar"></div>

<div class="container">
  <div>
    <div class="page-title">🎰 股票抽籤（公開申購）</div>
    <div class="page-desc">近期公開申購資訊，含承銷價、市價、價差與中籤率。</div>
  </div>
  <div id="app"><div class="loading">載入中...</div></div>
</div>
<div id="footer"></div>

<script src="js/ui.js"></script>
<script>
function fmt(v){return typeof v==='number'?v.toLocaleString('zh-TW'):v;}
function rocToAD(s){
  if(!s)return'';
  const p=s.split('/');
  if(p.length!==3)return s;
  return `${parseInt(p[0])+1911}/${p[1]}/${p[2]}`;
}

async function loadData(){
  try{
    const r=await fetch('/api/twse-proxy?type=ipo');
    const j=await r.json();
    if(!j.data||!j.data.length){
      document.getElementById('app').innerHTML='<div class="loading">目前無公開申購資訊</div>';
      return;
    }
    // TWSE publicLottery fields vary; common:
    // 0:抽籤日期 1:申購開始日 2:申購結束日 3:撥券日期 4:股票代號 5:股票名稱
    // 6:申購股數 7:承銷價 8:實際承銷股數 9:中籤率
    const cards=j.data.map(row=>{
      const id=(row[4]||'').trim();
      const name=(row[5]||'').trim();
      const subPrice=parseFloat((row[7]||'0').replace(/,/g,''))||0;
      const drawDate=rocToAD(row[0]);
      const startDate=rocToAD(row[1]);
      const endDate=rocToAD(row[2]);
      const settleDate=rocToAD(row[3]);
      const rate=(row[9]||'').trim();
      return{id,name,subPrice,drawDate,startDate,endDate,settleDate,rate};
    });

    document.getElementById('app').innerHTML=cards.map(c=>`
      <div class="ipo-card">
        <h3>🎯 ${c.id} ${c.name}</h3>
        <div class="ipo-meta">
          <div class="ipo-meta-item"><span class="ipo-meta-label">承銷價</span><span class="ipo-meta-val">${fmt(c.subPrice)} 元</span></div>
          <div class="ipo-meta-item"><span class="ipo-meta-label">申購期間</span><span class="ipo-meta-val">${c.startDate} ~ ${c.endDate}</span></div>
          <div class="ipo-meta-item"><span class="ipo-meta-label">抽籤日期</span><span class="ipo-meta-val">${c.drawDate}</span></div>
          <div class="ipo-meta-item"><span class="ipo-meta-label">撥券日期</span><span class="ipo-meta-val">${c.settleDate}</span></div>
          <div class="ipo-meta-item"><span class="ipo-meta-label">中籤率</span><span class="ipo-meta-val">${c.rate||'—'}</span></div>
        </div>
      </div>
    `).join('')||'<div class="loading">目前無公開申購資訊</div>';
  }catch(e){
    document.getElementById('app').innerHTML='<div class="loading">載入失敗，請稍後再試</div>';
  }
}
loadData();
</script>
