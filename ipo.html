<title>股票抽籤 — 盤後精選模組</title>
<meta name="description" content="股票抽籤（公開申購）：承銷價、申購期間與中籤率一覽。">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<div id="topbar"></div>

<div class="container">
  <div>
    <h1 class="page-title">股票抽籤（公開申購）</h1>
    <div class="page-desc">近期公開申購資訊，含承銷價、市價、價差與中籤率。</div>
  </div>
  <div id="app"><div class="loading">載入中...</div></div>
</div>
<div id="footer"></div>

<script src="js/ui.js"></script>
<script>
function fmt(v){ return fmtVal(v); }
function rocToAD(s){
  if(!s)return'';
  const p=s.split('/');
  if(p.length!==3)return s;
  return `${parseInt(p[0])+1911}/${p[1]}/${p[2]}`;
}

async function loadData(){
  try{
    const r=await fetch('/api/twse-proxy?type=ipo');
    const j=await r.json();
    if(!j.data||!j.data.length){
      document.getElementById('app').innerHTML='<div class="loading">目前無公開申購資訊</div>';
      return;
    }
    // TWSE publicForm 欄位：
    // 0:序號 1:抽籤日期 2:證券名稱 3:證券代號 4:發行市場
    // 5:申購開始日 6:申購結束日 7:承銷股數 8:實際承銷股數 9:承銷價(元)
    // 10:實際承銷價 11:撥券日期 12:主辦券商 13:申購股數 14:總承銷金額
    // 15:總合格件 16:中籤率(%) 17:取消公開抽籤
    const cards=j.data.map(row=>{
      const id=(row[3]||'').trim();
      const name=(row[2]||'').trim();
      const market=(row[4]||'').trim();
      const subPriceTxt=(row[9]||'').trim().replace(/,/g,'');
      const subPrice=parseFloat(subPriceTxt);
      const drawDate=rocToAD(row[1]);
      const startDate=rocToAD(row[5]);
      const endDate=rocToAD(row[6]);
      const settleDate=rocToAD(row[11]);
      const rate=(row[16]||'').trim();
      const cancelled=(row[17]||'').trim();
      return{id,name,market,subPrice:isFinite(subPrice)?subPrice:null,drawDate,startDate,endDate,settleDate,rate,cancelled};
    })
      // 過濾非股票（央債等中央登錄公債），頁面聚焦股票公開申購
      .filter(c=>c.id && !/^A/i.test(c.id));

    cards.sort((a,b)=>(b.drawDate||'').localeCompare(a.drawDate||''));
    const rows=cards.map(c=>`
      <tr class="${c.cancelled?'ipo-cancelled':''}">
        <td>${c.id}</td>
        <td>${c.name}${c.market?` <span class="ipo-market">${c.market}</span>`:''}${c.cancelled?` <span class="ipo-tag">${c.cancelled}</span>`:''}</td>
        <td>${c.subPrice!=null?fmt(c.subPrice)+' 元':'—'}</td>
        <td>${c.startDate} ~ ${c.endDate}</td>
        <td>${c.drawDate}</td>
        <td>${c.settleDate}</td>
        <td>${c.rate||'—'}</td>
      </tr>`).join('');
    document.getElementById('app').innerHTML=`<div class="module"><div class="table-wrap"><table>
      <thead><tr><th>代號</th><th>名稱</th><th>承銷價</th><th>申購期間</th><th>抽籤日期</th><th>撥券日期</th><th>中籤率</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="7" class="empty-row">目前無公開申購資訊</td></tr>'}</tbody>
    </table></div></div>`;
  }catch(e){
    document.getElementById('app').innerHTML='<div class="loading">載入失敗，請稍後再試</div>';
  }
}
loadData();
</script>
