<title>股票抽籤 — 盤後精選模組</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<div id="topbar"></div>

<div class="container">
  <div>
    <div class="page-title">🎰 股票抽籤（公開申購）</div>
    <div class="page-desc">近期公開申購資訊，含承銷價、市價、價差與中籤率。</div>
  </div>
  <div id="app"><div class="loading">載入中...</div></div>
</div>
<div id="footer"></div>

<script src="js/ui.js"></script>
<script>
function fmt(v){return typeof v==='number'?v.toLocaleString('zh-TW'):v;}
function rocToAD(s){
  if(!s)return'';
  const p=s.split('/');
  if(p.length!==3)return s;
  return `${parseInt(p[0])+1911}/${p[1]}/${p[2]}`;
}

async function loadData(){
  try{
    const r=await fetch('/api/twse-proxy?type=ipo');
    const j=await r.json();
    if(!j.data||!j.data.length){
      document.getElementById('app').innerHTML='<div class="loading">目前無公開申購資訊</div>';
      return;
    }
    // TWSE publicForm 欄位：
    // 0:序號 1:抽籤日期 2:證券名稱 3:證券代號 4:發行市場
    // 5:申購開始日 6:申購結束日 7:承銷股數 8:實際承銷股數 9:承銷價(元)
    // 10:實際承銷價 11:撥券日期 12:主辦券商 13:申購股數 14:總承銷金額
    // 15:總合格件 16:中籤率(%) 17:取消公開抽籤
    const cards=j.data.map(row=>{
      const id=(row[3]||'').trim();
      const name=(row[2]||'').trim();
      const market=(row[4]||'').trim();
      const subPriceTxt=(row[9]||'').trim().replace(/,/g,'');
      const subPrice=parseFloat(subPriceTxt);
      const drawDate=rocToAD(row[1]);
      const startDate=rocToAD(row[5]);
      const endDate=rocToAD(row[6]);
      const settleDate=rocToAD(row[11]);
      const rate=(row[16]||'').trim();
      const cancelled=(row[17]||'').trim();
      return{id,name,market,subPrice:isFinite(subPrice)?subPrice:null,drawDate,startDate,endDate,settleDate,rate,cancelled};
    })
      // 過濾非股票（央債等中央登錄公債），頁面聚焦股票公開申購
      .filter(c=>c.id && !/^A/i.test(c.id));

    document.getElementById('app').innerHTML=cards.map(c=>`
      <div class="ipo-card${c.cancelled?' ipo-cancelled':''}">
        <h3>🎯 ${c.id} ${c.name} ${c.market?`<span class="ipo-market">${c.market}</span>`:''}${c.cancelled?`<span class="ipo-tag">${c.cancelled}</span>`:''}</h3>
        <div class="ipo-meta">
          <div class="ipo-meta-item"><span class="ipo-meta-label">承銷價</span><span class="ipo-meta-val">${c.subPrice!=null?fmt(c.subPrice)+' 元':'—'}</span></div>
          <div class="ipo-meta-item"><span class="ipo-meta-label">申購期間</span><span class="ipo-meta-val">${c.startDate} ~ ${c.endDate}</span></div>
          <div class="ipo-meta-item"><span class="ipo-meta-label">抽籤日期</span><span class="ipo-meta-val">${c.drawDate}</span></div>
          <div class="ipo-meta-item"><span class="ipo-meta-label">撥券日期</span><span class="ipo-meta-val">${c.settleDate}</span></div>
          <div class="ipo-meta-item"><span class="ipo-meta-label">中籤率</span><span class="ipo-meta-val">${c.rate||'—'}</span></div>
        </div>
      </div>
    `).join('')||'<div class="loading">目前無公開申購資訊</div>';
  }catch(e){
    document.getElementById('app').innerHTML='<div class="loading">載入失敗，請稍後再試</div>';
  }
}
loadData();
</script>
