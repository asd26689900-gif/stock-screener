<style>
:root{--ink:#1C2127;--text:#3B3F45;--text-secondary:#6B7280;--surface:#F5F2EC;--card:#FFFFFF;--border:#DDD8D0;--border-light:#EBE7E0;--gold:#B8860B;--gold-soft:rgba(184,134,11,.10);--teal:#3A7D7B;--teal-soft:rgba(58,125,123,.08);--green:#4A8B6E;--red:#C0544F;--font-display:Georgia,'Times New Roman',serif;--font-body:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--font-mono:'SF Mono','Cascadia Code','Consolas',monospace;--radius:6px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E8E4DC;--text:#C8C4BC;--text-secondary:#8B8780;--surface:#141618;--card:#1E2024;--border:#2E3036;--border-light:#252830;--gold:#D4A840;--gold-soft:rgba(212,168,64,.12);--teal:#5AADAB;--teal-soft:rgba(90,173,171,.10);--green:#6BB88E;--red:#E07070;--shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2)}}
:root[data-theme="dark"]{--ink:#E8E4DC;--text:#C8C4BC;--text-secondary:#8B8780;--surface:#141618;--card:#1E2024;--border:#2E3036;--border-light:#252830;--gold:#D4A840;--gold-soft:rgba(212,168,64,.12);--teal:#5AADAB;--teal-soft:rgba(90,173,171,.10);--green:#6BB88E;--red:#E07070;--shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.55}
.topbar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow)}
.topbar .brand{font-family:var(--font-display);font-size:18px;color:var(--ink);letter-spacing:-.02em;white-space:nowrap;text-decoration:none}.topbar .brand span{color:var(--gold)}.topbar .spacer{flex:1}
.nav-links{display:flex;gap:12px}.nav-links a{font-size:13px;color:var(--text-secondary);text-decoration:none;padding:4px 8px;border-radius:var(--radius)}.nav-links a:hover,.nav-links a.active{color:var(--gold);background:var(--gold-soft)}
.container{max-width:960px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:20px}
.page-title{font-family:var(--font-display);font-size:22px;color:var(--ink)}.page-desc{font-size:13px;color:var(--text-secondary)}

/* ── Summary strip ── */
.summary-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;box-shadow:var(--shadow)}
.summary-label{font-size:10px;color:var(--text-secondary);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:4px}

.summary-val .unit{font-size:12px;color:var(--text-secondary);font-family:var(--font-body);font-weight:400;margin-left:4px}

/* ── Heat-strip (next 14 days) ── */
.heat-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow)}
.heat-title{font-size:11px;color:var(--text-secondary);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.heat-legend{display:flex;gap:6px;align-items:center;font-size:10px;color:var(--text-secondary);font-family:var(--font-mono);text-transform:none;letter-spacing:0}
.heat-legend-swatch{width:10px;height:10px;border-radius:2px}
.heat-grid{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat-cell{aspect-ratio:1;border-radius:6px;background:var(--surface);border:1px solid var(--border-light);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .12s,border-color .12s}
.heat-cell:hover{transform:translateY(-2px);border-color:var(--gold)}
.heat-cell.today{border-color:var(--gold);border-width:2px;box-shadow:0 0 0 1px var(--gold-soft)}
.heat-cell.past{opacity:.35}
.heat-cell.weekend{background:rgba(0,0,0,0.02)}
.heat-cell .hc-dow{font-size:9px;color:var(--text-secondary);letter-spacing:.05em;line-height:1}
.heat-cell .hc-day{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--ink);line-height:1;margin-top:2px}
.heat-cell .hc-count{position:absolute;top:2px;right:2px;background:var(--gold);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:9px;font-family:var(--font-mono);line-height:1.3;min-width:16px;text-align:center;display:none}
.heat-cell.has-events .hc-count{display:block}

.heat-cell.d-2{background:rgba(184,134,11,0.16)}
.heat-cell.d-3{background:rgba(184,134,11,0.28)}

.heat-strip-labels{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

/* ── Filter bar ── */

/* ── Event groups & cards ── */

.loading{text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:14px}

@media(max-width:640px){.topbar{padding:10px 12px;gap:8px}.container{padding:16px 8px 60px}.event-row{grid-template-columns:56px 60px 1fr;gap:8px;padding:10px 12px}.event-wl{display:none}.summary-val{font-size:20px}.heat-grid{grid-template-columns:repeat(7,1fr)}.heat-strip-labels{grid-template-columns:1fr}.heat-strip-labels span:nth-child(2){display:none}}

<script>
// ═══════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════
let events = []; // {date, id, name, type, label, detail}
let curYear = new Date().getFullYear(), curMonth = new Date().getMonth() + 1;
let filterType = 'all';
let wlOnly = false;
let watchlistIds = new Set();

const DOW = ['日','一','二','三','四','五','六'];

// ═══════════════════════════════════════════════════════════
// Utils
// ═══════════════════════════════════════════════════════════
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function today(){return ymd(new Date());}
function addDays(d, n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function weekdayZh(dateStr){const d=new Date(dateStr);return DOW[d.getDay()];}
function rocToAD(s){
  if(!s)return'';
  const p=s.split('/');
  if(p.length===3) return `${parseInt(p[0])+1911}-${pad(p[1])}-${pad(p[2])}`;
  const m=s.match(/(\d+)年(\d+)月(\d+)日/);
  if(m) return `${parseInt(m[1])+1911}-${pad(m[2])}-${pad(m[3])}`;
  return s;
}
function loadWatchlist(){
  try{
    const w=JSON.parse(localStorage.getItem('watchlists')||'null');
    if(w) return new Set(Object.values(w).flat());
    const old=JSON.parse(localStorage.getItem('watchlist')||'[]');
    return new Set(old);
  }catch(e){return new Set();}
}

// ═══════════════════════════════════════════════════════════
// Data fetch
// ═══════════════════════════════════════════════════════════
async function fetchDividend(year, month){
  const ym = `${year-1911}${pad(month)}`;
  try{
    const r = await fetch(`/api/twse-proxy?type=dividend&date=${ym}`);
    const j = await r.json();
    if(!j.data) return;
    j.data.forEach(row=>{
      const dateStr = rocToAD(row[0]);
      const id = (row[1]||'').trim();
      const name = (row[2]||'').trim();
      const type = (row[3]||'').includes('息')?'除息':'除權';
      const detail = (row[4]||'').trim();
      if(!dateStr||!id) return;
      events.push({date:dateStr, id, name, type:'dividend', label:type, detail});
    });
  }catch(e){/* silent */}
}

async function fetchIPO(){
  try{
    const r = await fetch('/api/twse-proxy?type=ipo');
    const j = await r.json();
    if(!j.data) return;
    j.data.forEach(row=>{
      const drawDate = rocToAD(row[0]);
      const startDate = rocToAD(row[1]);
      const endDate = rocToAD(row[2]);
      const id = (row[4]||'').trim();
      const name = (row[5]||'').trim();
      const subPrice = (row[7]||'').trim();
      if(!id) return;
      if(startDate) events.push({date:startDate, id, name, type:'ipo', label:'抽籤開始', detail:`承銷價 ${subPrice} 元`});
      if(endDate)   events.push({date:endDate,   id, name, type:'ipo', label:'抽籤截止', detail:`承銷價 ${subPrice} 元`});
      if(drawDate)  events.push({date:drawDate,  id, name, type:'ipo', label:'抽籤日',   detail:`承銷價 ${subPrice} 元`});
    });
  }catch(e){/* silent */}
}

async function loadAll(){
  events = [];
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1;
  // fetch this month + next month for dividend to cover 14-day heat-strip crossing month boundary
  const months = [[y, m]];
  const nm = m+1 > 12 ? [y+1, 1] : [y, m+1];
  months.push(nm);
  await Promise.all([
    ...months.map(([yy, mm]) => fetchDividend(yy, mm)),
    fetchIPO(),
  ]);
  // de-duplicate by date+id+label
  const seen = new Set();
  events = events.filter(e=>{
    const k = `${e.date}|${e.id}|${e.label}`;
    if(seen.has(k)) return false;
    seen.add(k); return true;
  });
  events.sort((a,b)=>a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
}

// ═══════════════════════════════════════════════════════════
// Render — summary
// ═══════════════════════════════════════════════════════════
function renderSummary(){
  const t = today();
  const d7 = ymd(addDays(new Date(), 7));
  const d14 = ymd(addDays(new Date(), 14));

  const inNextN = (n) => events.filter(e => e.date >= t && e.date <= ymd(addDays(new Date(), n)));
  const next7 = inNextN(7);
  const next14 = inNextN(14);

  const div7 = new Set(next7.filter(e=>e.type==='dividend').map(e=>e.id)).size;
  const ipo7 = new Set(next7.filter(e=>e.type==='ipo').map(e=>e.id)).size;
  const wl7 = next7.filter(e=>watchlistIds.has(e.id));
  const wlIds = new Set(wl7.map(e=>e.id));

  document.getElementById('summaryStrip').innerHTML = `
    <div class="summary-card"><div class="summary-label">未來 7 天</div>
      <div class="summary-val">${next7.length}<span class="unit">件事件</span></div></div>
    <div class="summary-card"><div class="summary-label">除權息</div>
      <div class="summary-val">${div7}<span class="unit">檔</span></div></div>
    <div class="summary-card"><div class="summary-label">股票抽籤</div>
      <div class="summary-val">${ipo7}<span class="unit">檔</span></div></div>
    <div class="summary-card"><div class="summary-label">自選股觸發</div>
      <div class="summary-val" style="color:${wlIds.size?'var(--gold)':'var(--text-secondary)'}">${wlIds.size}<span class="unit">檔</span></div></div>
  `;
}

// ═══════════════════════════════════════════════════════════
// Render — 14-day heat strip
// ═══════════════════════════════════════════════════════════
function heatLevel(n){
  if(n===0) return 0;
  if(n<=2) return 1;
  if(n<=5) return 2;
  if(n<=10) return 3;
  return 4;
}
function renderHeatStrip(){
  const now = new Date();
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay()+6)%7));
  const t = today();
  const filtered = filteredEvents();
  const byDate = {};
  filtered.forEach(e => { byDate[e.date] = (byDate[e.date]||[])+1; });

  let html = '';
  for(let i=0; i<14; i++){
    const d = addDays(monday, i);
    const dateStr = ymd(d);
    const dow = d.getDay();
    const cnt = byDate[dateStr] || 0;
    const level = heatLevel(cnt);
    const isToday = dateStr === t;
    const isPast = dateStr < t;
    const isWeekend = dow === 0 || dow === 6;
    const cls = [
      'heat-cell',
      isToday?'today':'',
      isPast?'past':'',
      isWeekend?'weekend':'',
      cnt>0?'has-events':'',
      level>0?`d-${level}`:''
    ].filter(Boolean).join(' ');
    html += `<div class="${cls}" onclick="jumpToDate('${dateStr}')" title="${dateStr} ・ ${cnt} 件">
      <span class="hc-dow">${DOW[dow]}</span>
      <span class="hc-day">${d.getDate()}</span>
      <span class="hc-count">${cnt}</span>
    </div>`;
  }
  document.getElementById('heatGrid').innerHTML = html;
}

// ═══════════════════════════════════════════════════════════
// Render — event groups
// ═══════════════════════════════════════════════════════════
function filteredEvents(){
  return events.filter(e => {
    if(filterType !== 'all' && e.type !== filterType) return false;
    if(wlOnly && !watchlistIds.has(e.id)) return false;
    return true;
  });
}

function renderGroups(){
  const t = today();
  const d3 = ymd(addDays(new Date(), 3));
  const d7 = ymd(addDays(new Date(), 7));
  const filtered = filteredEvents().filter(e => e.date >= t);

  if(!filtered.length){
    document.getElementById('eventGroups').innerHTML =
      '<div class="event-group"><div class="empty-msg">此條件下無即將到來的事件</div></div>';
    return;
  }

  const buckets = {today:[], soon:[], week:[], later:[]};
  filtered.forEach(e=>{
    if(e.date === t) buckets.today.push(e);
    else if(e.date <= d3) buckets.soon.push(e);
    else if(e.date <= d7) buckets.week.push(e);
    else buckets.later.push(e);
  });

  const groupHtml = (title, tag, items, extraCls) => items.length ? `
    <div class="event-group ${extraCls||''}">
      <div class="event-group-header">
        <div class="event-group-title">${title}${tag?`<span class="tag">${tag}</span>`:''}</div>
        <div class="event-group-count">${items.length} 件</div>
      </div>
      <div class="event-list">${items.map(rowHtml).join('')}</div>
    </div>` : '';

  document.getElementById('eventGroups').innerHTML =
    groupHtml('今天', today().slice(5).replace('-','/'), buckets.today, 'today') +
    groupHtml('未來 3 天內', '', buckets.soon) +
    groupHtml('未來 7 天內', '', buckets.week) +
    groupHtml('更遠', '本月剩下', buckets.later);
}

function rowHtml(e){
  const dateShort = e.date.slice(5).replace('-','/');
  const dow = weekdayZh(e.date);
  const typeLabel = e.type==='dividend'?e.label:(e.type==='ipo'?e.label:'財報');
  const inWL = watchlistIds.has(e.id);
  return `<div class="event-row" onclick="location.href='stk.html#${e.id}'">
    <span class="event-date">${dateShort}<span class="weekday">(${dow})</span></span>
    <span class="event-type ${e.type}">${typeLabel}</span>
    <span class="event-body">
      <span class="sid">${e.id}</span>
      <span class="name">${e.name}</span>
      <span class="detail">${e.detail||''}</span>
    </span>
    ${inWL?'<span class="event-wl">★ 自選</span>':'<span></span>'}
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// Render — full month grid (expandable)
// ═══════════════════════════════════════════════════════════
function toggleMonth(){
  const el = document.getElementById('monthToggle');
  el.classList.toggle('open');
  if(el.classList.contains('open')) renderMonthGrid();
}
function changeMonth(delta){
  curMonth += delta;
  if(curMonth > 12){curMonth = 1; curYear++;}
  if(curMonth < 1){curMonth = 12; curYear--;}
  renderMonthGrid();
}
function renderMonthGrid(){
  document.getElementById('monthLabel').textContent = `${curYear} 年 ${curMonth} 月`;
  const t = today();
  const firstDay = new Date(curYear, curMonth-1, 1).getDay();
  const daysInMonth = new Date(curYear, curMonth, 0).getDate();
  const daysInPrev = new Date(curYear, curMonth-1, 0).getDate();

  const filtered = filteredEvents();
  const byDate = {};
  filtered.forEach(e => { (byDate[e.date] = byDate[e.date]||[]).push(e); });

  let html = '<div class="cal-grid">';
  DOW.forEach(d => html += `<div class="cal-hdr">${d}</div>`);

  for(let i=firstDay-1; i>=0; i--){
    html += `<div class="cal-day other"><div class="cal-num">${daysInPrev-i}</div></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${curYear}-${pad(curMonth)}-${pad(d)}`;
    const isToday = dateStr === t;
    const dayEvts = byDate[dateStr] || [];
    const hasEvents = dayEvts.length > 0;
    const typeCounts = {dividend:0, ipo:0, earnings:0};
    dayEvts.forEach(e => typeCounts[e.type] = (typeCounts[e.type]||0)+1);
    const dots = Object.entries(typeCounts)
      .filter(([_,c])=>c>0)
      .map(([type,c])=>Array(Math.min(c,3)).fill(`<div class="cal-dot ${type}"></div>`).join(''))
      .join('');
    html += `<div class="cal-day${isToday?' today':''}${hasEvents?' has-events':''}">
      <div class="cal-num">${d}</div>
      <div class="cal-dots">${dots}</div>
      ${dayEvts.length>6?`<div class="cal-more">+${dayEvts.length-6}</div>`:''}
    </div>`;
  }
  const totalCells = firstDay + daysInMonth;
  const remaining = totalCells%7===0 ? 0 : 7-totalCells%7;
  for(let i=1; i<=remaining; i++){
    html += `<div class="cal-day other"><div class="cal-num">${i}</div></div>`;
  }
  html += '</div>';
  document.getElementById('calGrid').innerHTML = html;
}

// ═══════════════════════════════════════════════════════════
// Interaction
// ═══════════════════════════════════════════════════════════
function jumpToDate(dateStr){
  // Scroll to first matching event row
  const rows = document.querySelectorAll('.event-row');
  for(const r of rows){
    if(r.querySelector('.event-date').textContent.startsWith(dateStr.slice(5).replace('-','/'))){
      r.scrollIntoView({behavior:'smooth', block:'center'});
      r.style.transition = 'background .3s';
      r.style.background = 'var(--gold-soft)';
      setTimeout(()=>{r.style.background='';}, 1200);
      return;
    }
  }
}

document.getElementById('typePills').addEventListener('click', e => {
  const btn = e.target.closest('.filter-pill');
  if(!btn) return;
  filterType = btn.dataset.type;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.toggle('active', p===btn));
  renderAll();
});
document.getElementById('wlOnly').addEventListener('change', e => {
  wlOnly = e.target.checked;
  renderAll();
});

// ═══════════════════════════════════════════════════════════
// Boot
// ═══════════════════════════════════════════════════════════
function renderAll(){
  renderSummary();
  renderHeatStrip();
  renderGroups();
  if(document.getElementById('monthToggle').classList.contains('open')) renderMonthGrid();
}
(async ()=>{
  watchlistIds = loadWatchlist();
  await loadAll();
  renderAll();
})();
</script>
