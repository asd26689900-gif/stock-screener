<title>投資行事曆 — 盤後精選模組</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<div id="topbar"></div>

<div class="container">
  <div>
    <div class="page-title">📆 投資行事曆</div>
    <div class="page-desc">除權息日程，一頁掌握重要事件。</div>
  </div>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">◀ 上月</button>
    <span class="month-label" id="monthLabel"></span>
 <button onclick="changeMonth(1)">下月</button>
  </div>
  <div id="calGrid"></div>
  <div id="eventList"></div>
</div>
<div id="footer"></div>

<script src="js/ui.js"></script>
<script>
let curYear=new Date().getFullYear(), curMonth=new Date().getMonth()+1;
let events=[];

function pad(n){return String(n).padStart(2,'0');}
function rocToAD(s){
  if(!s)return'';
  // handle "115/08/01"
  let p=s.split('/');
  if(p.length===3) return `${parseInt(p[0])+1911}-${p[1]}-${p[2]}`;
  // handle "115年08月20日"
  const m=s.match(/(\d+)年(\d+)月(\d+)日/);
  if(m) return `${parseInt(m[1])+1911}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return s;
}

function changeMonth(d){
  curMonth+=d;
  if(curMonth>12){curMonth=1;curYear++;}
  if(curMonth<1){curMonth=12;curYear--;}
  loadData();
}

async function fetchMonth(year, month){
  const ym=`${year-1911}${pad(month)}`;
  try{
    const r=await fetch(`/api/twse-proxy?type=dividend&date=${ym}`);
    const j=await r.json();
    if(j.data&&j.data.length){
      j.data.forEach(row=>{
        const dateStr=rocToAD(row[0]);
        const id=(row[1]||'').trim();
        const name=(row[2]||'').trim();
        const type=(row[3]||'').includes('息')?'除息':'除權';
        const detail=(row[4]||'').trim();
        events.push({date:dateStr,id,name,type:'dividend',label:`${type} ${id} ${name} ${detail}`});
      });
    }
  }catch(e){}
}

async function loadData(){
  document.getElementById('monthLabel').textContent=`${curYear} 年 ${curMonth} 月`;
  events=[];

  // 抓當月 + 前後月，確保 ±7 天跨月也有資料
  const months=[];
  for(let off=-1;off<=1;off++){
    let y=curYear, m=curMonth+off;
    if(m<1){m=12;y--;}
    if(m>12){m=1;y++;}
    months.push([y,m]);
  }
  await Promise.all(months.map(([y,m])=>fetchMonth(y,m)));

  // 去重（同 date+id）
  const seen=new Set();
  events=events.filter(e=>{const k=e.date+e.id;if(seen.has(k))return false;seen.add(k);return true;});

  renderCalendar();
  renderEventList();
}

function renderCalendar(){
  const today=new Date().toISOString().slice(0,10);
  const firstDay=new Date(curYear,curMonth-1,1).getDay();
  const daysInMonth=new Date(curYear,curMonth,0).getDate();
  const daysInPrev=new Date(curYear,curMonth-1,0).getDate();

  const evByDate={};
  events.forEach(e=>{if(e.date)evByDate[e.date]=(evByDate[e.date]||[]).concat(e);});

  let html='<div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(d=>html+=`<div class="cal-hdr">${d}</div>`);

  // prev month padding
  for(let i=firstDay-1;i>=0;i--){
    const d=daysInPrev-i;
    html+=`<div class="cal-day other"><div class="cal-num">${d}</div></div>`;
  }

  // this month
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${curYear}-${pad(curMonth)}-${pad(d)}`;
    const isToday=dateStr===today;
    const dayEvents=evByDate[dateStr]||[];
    html+=`<div class="cal-day${isToday?' today':''}"><div class="cal-num">${d}</div>`;
    dayEvents.slice(0,3).forEach(e=>{
      html+=`<div class="cal-event ${e.type}">${e.id} ${e.name}</div>`;
    });
    if(dayEvents.length>3) html+=`<div class="cal-event" style="color:var(--text-secondary)">+${dayEvents.length-3} 更多</div>`;
    html+='</div>';
  }

  // next month padding
  const totalCells=firstDay+daysInMonth;
  const remaining=totalCells%7===0?0:7-totalCells%7;
  for(let i=1;i<=remaining;i++){
    html+=`<div class="cal-day other"><div class="cal-num">${i}</div></div>`;
  }
  html+='</div>';
  document.getElementById('calGrid').innerHTML=html;
}

function renderEventList(){
  if(!events.length){
    document.getElementById('eventList').innerHTML='<div class="loading" style="padding:30px">本月尚無除權息資料</div>';
    return;
  }
  const today=new Date().toISOString().slice(0,10);
  const d7ago=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const d7later=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  const sorted=[...events].sort((a,b)=>a.date.localeCompare(b.date));
  const nearby=sorted.filter(e=>e.date>=d7ago&&e.date<=d7later);
  const rest=sorted.filter(e=>e.date<d7ago||e.date>d7later);

  let html='';
  if(nearby.length){
    html+=`<div style="font-weight:600;color:var(--gold);margin-bottom:8px">📌 前後 7 天 (${d7ago.slice(5)} ~ ${d7later.slice(5)})</div>`;
    html+='<div class="event-list">'+nearby.map(e=>{
      const isToday=e.date===today;
      return `<div class="ev-card${isToday?' today':''}">
        <span class="ev-date">${e.date}</span>
        <span class="ev-type ${e.type}">除權息</span>
        <span class="ev-body">${e.label}</span>
      </div>`;
    }).join('')+'</div>';
  }
  if(rest.length){
  html+=`<div style="font-weight:600;color:var(--text-secondary);margin:16px 0 8px">本月其他</div>`;
    html+='<div class="event-list">'+rest.map(e=>`
      <div class="ev-card">
        <span class="ev-date">${e.date}</span>
        <span class="ev-type ${e.type}">除權息</span>
        <span class="ev-body">${e.label}</span>
      </div>
    `).join('')+'</div>';
  }
  if(!html) html='<div class="loading" style="padding:30px">前後7天無除權息資料</div>';
  document.getElementById('eventList').innerHTML=html;
}

loadData();
</script>
