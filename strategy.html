<title>選股策略 — 盤後精選模組</title>
<meta name="description" content="選股策略：四種不同角度的盤後資料篩選。">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<div id="topbar"></div>

<div class="container">
  <div class="page-header"><h1 class="page-title">選股策略</h1><p>四種不同角度的盤後資料篩選，每日 21:30 後更新。本系統僅提供數據整理，不構成任何買賣建議。</p><span class="date-label" id="stratDate" style="margin-top:6px"></span></div>
  <div class="tabs" id="tabs"></div>
  <div id="stratContainer"></div>
</div>
<div id="footer"></div>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/init.js"></script>
<script>
const STRATEGIES={
  trust_chain:{title:'投信連續有感買進',desc:'投信連續買超3日以上且累計張數顯著，搭配股價站上月線確認技術面支撐。',rules:['投信連買≥3日','累計買超>500張','收盤價>MA20','成交量>5日均量'],cols:['股號','名稱','收盤價','漲跌%','成交張','投信連買日','投信累買張']},
  main_retail_split:{title:'主散對做價量齊揚',desc:'主力買超同時散戶賣出，籌碼從弱手流向強手。配合股價上漲且成交量放大。',rules:['主力當日買超','散戶當日賣超','收盤價上漲','成交量>前日量'],cols:['股號','名稱','收盤價','漲跌%','成交張','主力買超張','散戶賣超張']},
  inst_burst:{title:'法人大買爆量超前',desc:'外資或投信單日買超金額異常放大（超過近20日平均2倍），搭配成交量爆量。',rules:['法人買超>20日均值×2','成交量>20日均量×1.5','收盤價>MA5','KD未超買(K<80)'],cols:['股號','名稱','收盤價','漲跌%','成交張','法人買超張','量比(倍)']},
  rev_turn:{title:'股價營收成長翻多',desc:'月營收由衰退轉為正成長（MOM翻正），且股價同步突破月線，基本面拐點出現。',rules:['前月MOM<0','最新MOM>0（翻正）','收盤價突破MA20','成交量>5日均量'],cols:['股號','名稱','收盤價','漲跌%','成交張','前月MOM','最新MOM']},
};
const ORDER=['trust_chain','main_retail_split','inst_burst','rev_turn'];
let stratData={};

function fmt(v){ return fmtVal(v); }

function renderTabs(){
  const el=document.getElementById('tabs');
  el.innerHTML=ORDER.map((k,i)=>{const s=STRATEGIES[k];const c=(stratData[k]||[]).length;return`<button class="tab${i===0?' active':''}" data-key="${k}">${s.title}<span class="badge-count">${c}</span></button>`;}).join('');
  el.querySelectorAll('.tab').forEach(b=>{b.addEventListener('click',()=>{el.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');showStrat(b.dataset.key);});});
}

function showStrat(key){
  const m=STRATEGIES[key],data=stratData[key]||[];
  const rows=data.length===0?`<tr class="empty-row"><td colspan="${m.cols.length}">今日無符合標的</td></tr>`:data.map(row=>'<tr onclick="location.href=\'stk.html#'+row[0]+'\'">' +row.map((v,i)=>{
    if(i<=1)return'<td>'+v+'</td>';
    if(i===3)return'<td class="'+pctClass(v)+'">'+fmtPct(v,2)+'</td>';
    if(/MOM|YOY|乖離/.test(m.cols[i]||''))return'<td class="'+pctClass(v)+'">'+fmtPct(v,2)+'</td>';
    return'<td>'+fmt(v)+'</td>';}).join('')+'</tr>').join('');
  document.getElementById('stratContainer').innerHTML=`<div class="strat"><div class="strat-header"><div class="strat-title">${m.title}</div><div class="strat-desc">${m.desc}</div><div class="strat-rules">${m.rules.map(r=>'<span class="strat-rule">'+r+'</span>').join('')}</div></div><div class="table-wrap"><table><thead><tr>${m.cols.map(c=>'<th>'+c+'</th>').join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

async function loadStrategies(){
  if(!sb)return;
  const{data}=await sb.from('daily_strategies').select('strategy_key,data,date,created_at').order('date',{ascending:false}).limit(4);
  if(!data)return;
  stratData={};data.forEach(r=>{stratData[r.strategy_key]=r.data;});
  const el=document.getElementById('stratDate');
  if(el&&data.length) el.innerHTML=I('calendar',13)+' 資料日期 '+data[0].date+(data[0].created_at?' ・ 更新 '+fmtDT(data[0].created_at):'');
  renderTabs();showStrat(ORDER[0]);
}
function onDataReady(){loadStrategies();}
</script>
