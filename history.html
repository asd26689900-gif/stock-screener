<title>歷史漲跌幅 — 盤後精選模組</title>
<meta name="description" content="加權指數歷史漲跌幅：每月交易日統計。">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<div id="topbar"></div>

<div class="container">
  <div>
  <h1 class="page-title">加權指數歷史漲跌幅</h1>
    <div class="page-desc">台灣加權指數每月交易日統計，每日自動更新。</div>
  </div>
  <div class="summary-grid" id="summaryCards"></div>
  <div class="month-nav">
    <button onclick="changeMonth(-1)" aria-label="上一個月">◀</button>
    <span class="month-label" id="monthLabel"></span>
    <button onclick="changeMonth(1)" aria-label="下一個月">▶</button>
  </div>
  <div id="app"><div class="sk-box"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
</div>
<div id="footer"></div>

<script src="js/ui.js"></script>
<script>
let curYear=new Date().getFullYear(), curMonth=new Date().getMonth()+1;
function fmt(v){ return fmtVal(v); }
function pad(n){return String(n).padStart(2,'0');}

function changeMonth(d){
  curMonth+=d;
  if(curMonth>12){curMonth=1;curYear++;}
  if(curMonth<1){curMonth=12;curYear--;}
  loadData();
}

async function loadData(){
  const ym=`${curYear}${pad(curMonth)}`;
  document.getElementById('monthLabel').textContent=`${curYear} 年 ${curMonth} 月`;
  document.getElementById('app').innerHTML='<div class="loading">載入中...</div>';
  try{
    const r=await fetch(`/api/twse-proxy?type=index_daily&date=${ym}`);
    const j=await r.json();
    if(j.stat!=='OK'||!j.data||!j.data.length){
      document.getElementById('app').innerHTML='<div class="loading">此月份無資料</div>';
      document.getElementById('summaryCards').innerHTML='';
      return;
    }
    // fields: 日期,成交股數,成交金額,成交筆數,發行量加權股價指數,漲跌點數,漲跌百分比
    // Note: TWSE uses 民國年 dates like "115/08/01"
    const rows=j.data.map(row=>{
      const dParts=(row[0]||'').split('/');
      const dateStr=dParts.length===3?`${parseInt(dParts[0])+1911}/${dParts[1]}/${dParts[2]}`:row[0];
      const idx=parseFloat((row[4]||'0').replace(/,/g,''))||0;
      const chgPt=parseFloat((row[5]||'0').replace(/,/g,''))||0;
      const volume=parseFloat((row[1]||'0').replace(/,/g,''))||0;
      const amount=parseFloat((row[2]||'0').replace(/,/g,''))||0;
      return{date:dateStr,index:idx,chg_pt:chgPt,volume,amount};
    });

    // summary
    const upDays=rows.filter(r=>r.chg_pt>0).length;
    const dnDays=rows.filter(r=>r.chg_pt<0).length;
    const totalChg=rows.reduce((s,r)=>s+r.chg_pt,0);
    const maxUp=rows.reduce((m,r)=>r.chg_pt>m.chg_pt?r:m,rows[0]);
    const maxDn=rows.reduce((m,r)=>r.chg_pt<m.chg_pt?r:m,rows[0]);
    document.getElementById('summaryCards').innerHTML=`
      <div class="summary-card"><div class="summary-label">交易日</div><div class="summary-val">${rows.length} 天</div><div class="summary-sub">上漲 ${upDays} / 下跌 ${dnDays}</div></div>
      <div class="summary-card"><div class="summary-label">月漲跌</div><div class="summary-val ${pctClass(totalChg)}">${totalChg>0?'+':''}${fmt(totalChg)} 點</div></div>
      <div class="summary-card"><div class="summary-label">最大漲幅日</div><div class="summary-val up">+${fmt(maxUp.chg_pt)}</div><div class="summary-sub">${maxUp.date}</div></div>
      <div class="summary-card"><div class="summary-label">最大跌幅日</div><div class="summary-val dn">${fmt(maxDn.chg_pt)}</div><div class="summary-sub">${maxDn.date}</div></div>`;

    document.getElementById('app').innerHTML=`<div class="module"><div class="table-wrap"><table>
      <thead><tr><th>日期</th><th>加權指數</th><th>漲跌點數</th><th>成交金額(億)</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td>${r.date}</td><td>${fmt(r.index)}</td>
        <td class="${pctClass(r.chg_pt)}">${r.chg_pt>0?'+':''}${fmtVal(r.chg_pt)}</td>
        <td>${fmt(Math.round(r.amount/1e8))}</td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
  }catch(e){
    document.getElementById('app').innerHTML='<div class="loading">載入失敗，請稍後再試</div>';
  }
}
loadData();
</script>
