<title>選股模組 — 盤後精選模組</title>
<meta name="description" content="多因子選股模組：籌碼、營收、技術面與法人動向交叉篩選標的，每日盤後自動更新。">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<div id="topbar"></div>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">選股模組</h1>
    <p class="page-desc">9 種多因子選股模組，每日盤後自動更新。</p>
  </div>
  <div class="controls">
    <span class="date-label" id="dateLabel">載入中...</span>
    <select id="datePicker" aria-label="選擇選股資料日期"></select>
    <label><input type="checkbox" id="filterEmpty" checked> 僅顯示有標的</label>
    <button class="btn btn-sm" id="toggleAll" onclick="toggleAllModules()" type="button">全部收合</button>
  </div>
  <div id="app"><div class="loading">正在載入選股資料...</div></div>
</div>

<div id="footer"></div>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/init.js"></script>
<script>
const MODULE_META = {
  chip_high: { title: '籌碼集中創高股', desc: '交易家數遞減代表籌碼從散戶流向大戶，同時股價創近期新高且乖離率仍在合理範圍。', rules: ['股價創N日新高','交易家數連3日遞減','5日均線乖離率<7%','成交量>5日均量'], cols: ['股號','名稱','收盤價','漲跌%','成交張','5日均量','創高天數','乖離率%'] },
  main_buy: { title: '主力連買疊高股', desc: '技術面多頭排列，主力連續買超且散戶賣出，籌碼向大戶集中。鎖定中低價位。', rules: ['均線多頭排列','主力連買≥3日','散戶持股下降','股價<200元'], cols: ['股號','名稱','收盤價','漲跌%','成交張','量創高天','主力連買日','主力累買張'] },
  rev_grow: { title: '營收成長量增股', desc: '連續三個月營收YOY正成長且幅度遞增，搭配價量創高與外資介入。', rules: ['近3月YOY皆正成長','YOY逐月遞增','外資連買≥2日','量創20日新高'], cols: ['股號','名稱','收盤價','漲跌%','成交張','外資連買日','近月YOY%'] },
  hot_grow: { title: '轉熱成長動能股', desc: '營收MOM與YOY雙成長，加上分點參與率升溫。', rules: ['月營收MOM>0','月營收YOY>20%','分點參與率上升','乖離率<8%'], cols: ['股號','名稱','收盤價','漲跌%','成交張','5日均量','乖離率%','MOM','YOY'] },
  inst_duo: { title: '雙法人合買股', desc: '外資與投信同日買超且呈連續性，籌碼集中態勢確立。', rules: ['外資當日買超','投信當日買超','至少一方連買≥3日','KD未超買'], cols: ['股號','名稱','收盤價','漲跌%','成交張','外資連買日','外資累買張','投信連買日'] },
  margin_rev: { title: '毛利營收雙創高', desc: '成交量周轉率達標，營收連續正成長，毛利率與月營收皆創新高。', rules: ['量周轉率>門檻','營收連2月正成長','毛利率創近4季新高','月營收創12月新高'], cols: ['股號','名稱','收盤價','漲跌%','成交張','5日均量','MOM%'] },
  trust_vol: { title: '投信量增成長股', desc: '投信買進、量創20日新高、營收連3月正成長，至少命中2項。', rules: ['投信買超(A)','量創20日新高(B)','營收連3月正成長(C)','≥2項命中'], cols: ['股號','名稱','收盤價','漲跌%','成交張','5日均量','MOM%'] },
  rev_explode: { title: '營收連增爆發股', desc: '連續3個月正成長，最近1個月YOY/QOQ/MOM皆達高門檻。', rules: ['營收連3月MOM正成長','近月YOY>50%','近月QOQ>20%','近月MOM>15%'], cols: ['股號','名稱','收盤價','漲跌%','成交張','MOM%'] },
  triple_signal: { title: '投信營收價量齊發', desc: '營收連續成長、投信持有上櫃股、價漲量增，至少命中2項。', rules: ['營收連2月正成長(A)','投信持有上櫃股(B)','價漲且量增(C)','≥2項命中'], cols: ['股號','名稱','收盤價','漲跌%','成交張','5日均量','MOM%'] },
};
const MODULE_ORDER = ['chip_high','main_buy','rev_grow','hot_grow','inst_duo','margin_rev','trust_vol','rev_explode','triple_signal'];

const app = document.getElementById('app');
let allModules = {};

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(v){ return fmtVal(v); }

function render(filterEmpty){
  let html='';
  for(const key of MODULE_ORDER){
    const meta=MODULE_META[key]; const data=allModules[key]||[];
    if(filterEmpty&&data.length===0) continue;
    const rows=data.length===0
      ?'<tr class="empty-row"><td colspan="'+(meta.cols.length+1)+'">今日無符合標的</td></tr>'
      :data.map(row=>'<tr onclick="location.href=\'stk.html#'+row[0]+'\'">'+row.map((v,i)=>{
        if(i<=1) return '<td>'+v+'</td>';
        if(i===3) return '<td class="'+pctClass(v)+'">'+fmtPct(v,2)+'</td>';
        if(/MOM|YOY|乖離|殖利率/.test(meta.cols[i]||'')) return '<td class="'+pctClass(v)+'">'+fmtPct(v,2)+'</td>';
        return '<td>'+fmt(v)+'</td>';
      }).join('')+'<td>'+starBtn(row[0])+'</td></tr>').join('');
    html+=`<div class="module open"><div class="module-header" onclick="this.parentElement.classList.toggle('open')"><span class="arrow">${I('chev', 11)}</span><span class="module-title">${meta.title}</span><span class="badge-count">${data.length} 檔</span></div><div class="module-desc">${meta.desc}</div><div class="module-meta">${meta.rules.map(r=>'<span>'+r+'</span>').join('')}</div><div class="table-wrap"><table><thead><tr>${meta.cols.map(c=>'<th>'+c+'</th>').join('')}<th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  app.innerHTML=html||'<div class="loading">今日無任何模組有符合標的</div>';
}

async function loadData(date){
  if(!sb) return;
  let query = sb.from('daily_modules').select('module_key,data,date');
  if(date) query = query.eq('date', date);
  else {
    const { data: latest } = await sb.from('daily_modules').select('date').order('date',{ascending:false}).limit(1);
    if (!latest || !latest.length) { app.innerHTML=errorBox('無法載入資料'); return; }
    query = query.eq('date', latest[0].date);
  }
  const {data,error} = await query;
  if(error||!data||!data.length){
    app.innerHTML=errorBox('無法載入資料','loadData('+(date?JSON.stringify(date):'')+')'); return;
  }
  allModules={};
  data.forEach(r=>{ allModules[r.module_key]=r.data; });
  render(document.getElementById('filterEmpty').checked);
}

async function loadDates(){
  if(!sb) return;
  const {data}=await sb.from('daily_modules').select('date,created_at').order('date',{ascending:false}).limit(100);
  if(!data) return;
  const dates=[...new Set(data.map(r=>r.date))];
  const picker=document.getElementById('datePicker');
  picker.innerHTML=dates.map(d=>'<option value="'+d+'">'+d+'</option>').join('');
  picker.addEventListener('change',()=>{
    document.getElementById('dateLabel').innerHTML=I('calendar',13)+' 資料日期 '+picker.value;
    loadData(picker.value);
  });
  if(dates.length){
    const row=data.find(r=>r.date===dates[0]);
    document.getElementById('dateLabel').innerHTML=I('calendar',13)+' 資料日期 '+dates[0]+(row&&row.created_at?' ・ 更新 '+fmtDT(row.created_at):'');
  }
}

function toggleAllModules(){
  const mods=[...document.querySelectorAll('.module')];
  const allOpen=mods.length>0&&mods.every(m=>m.classList.contains('open'));
  mods.forEach(m=>m.classList.toggle('open',!allOpen));
  document.getElementById('toggleAll').textContent=allOpen?'全部展開':'全部收合';
}

let dataLoaded = false;
function onDataReady(){
  if(!dataLoaded){ dataLoaded=true; loadDates(); loadData(); }
  else render(document.getElementById('filterEmpty').checked);
}

document.getElementById('filterEmpty').addEventListener('change',function(){ render(this.checked); });
</script>
