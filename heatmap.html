<title>產業熱力圖 — 盤後精選模組</title>
<meta name="description" content="台股產業熱力圖：產業與個股漲跌幅一眼掌握。">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<div id="topbar"></div>

<div class="container">
  <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px">
    <h1 class="page-title">產業熱力圖</h1>
    <span class="date-label" id="dateLabel"></span>
  </div>
  <p class="subtitle">色塊面積 = 市值，顏色 = 漲跌幅。點擊產業可展開成分股。</p>
  <div class="breadcrumb" id="breadcrumb" style="display:none"><a onclick="showIndustry()">全部產業</a> <span>›</span> <span id="bcName"></span></div>
  <div class="treemap-wrap"><div class="treemap" id="treemap"></div>
    <div class="legend"><span class="legend-label">-10%</span><div class="legend-bar"></div><span class="legend-label">+10%</span></div>
  </div>
  <div class="stk-table-wrap" id="stkTable">
    <div class="stk-table-title" id="stkTableTitle"></div>
    <div class="table-wrap"><table><thead><tr><th>股號</th><th>名稱</th><th>收盤價</th><th>漲跌%</th><th>市值</th><th>成交額</th></tr></thead><tbody id="stkTableBody"></tbody></table></div>
  </div>
</div>
<div id="footer"></div>
<div class="tooltip" id="tooltip"><div class="tt-name" id="ttName"></div><div class="tt-row"><span>漲跌幅</span><span id="ttChg"></span></div><div class="tt-row"><span>市值</span><span id="ttMcap"></span></div><div class="tt-row"><span>成交額</span><span id="ttVol"></span></div></div>
<div class="ctx-menu" id="ctxMenu"></div>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/init.js"></script>
<script>
let hmData={};
const treemapEl=document.getElementById('treemap');
const tooltip=document.getElementById('tooltip');

function chgColor(pct){
  // cap ±10% = 台股單日漲跌停；用 power curve 讓小幅波動也看得出色差
  const c=Math.max(-10,Math.min(10,pct));
  const abs=Math.abs(c)/10, s=Math.pow(abs,0.55);
  let r,g,b;
  if(c>=0){r=Math.round(136+56*s);g=Math.round(136-52*s);b=Math.round(136-57*s);}
  else{r=Math.round(136-91*s);g=Math.round(136+7*s);b=Math.round(136-58*s);}
  return`rgb(${r},${g},${b})`;
}

function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const rects=[];let remaining=[...items],cx=x,cy=y,cw=w,ch=h;
  while(remaining.length){
    const isW=cw>=ch,side=isW?ch:cw,totR=remaining.reduce((s,i)=>s+i.value,0);
    let row=[remaining[0]],rv=remaining[0].value;
    for(let i=1;i<remaining.length;i++){
      const wC=worstR(row,rv,side,totR,isW?cw:ch);
      row.push(remaining[i]);
      const wN=worstR(row,rv+remaining[i].value,side,totR,isW?cw:ch);
      if(wN>wC&&row.length>1){row.pop();break;}
      rv+=remaining[i].value;
    }
    const ss=isW?cw*(rv/totR):ch*(rv/totR);let off=0;
    for(const it of row){const fr=it.value/rv,cs=side*fr;
      if(isW)rects.push({...it,x:cx,y:cy+off,w:ss,h:cs});
      else rects.push({...it,x:cx+off,y:cy,w:cs,h:ss});
      off+=cs;}
    remaining=remaining.slice(row.length);
    if(isW){cx+=ss;cw-=ss;}else{cy+=ss;ch-=ss;}
  }
  return rects;
}
function worstR(row,rv,side,total,fs){
  const ss=fs*(rv/total);if(ss<=0)return Infinity;let w=0;
  for(const it of row){const cs=side*(it.value/rv),r=Math.max(ss/cs,cs/ss);if(r>w)w=r;}return w;
}

function renderTreemap(items){
  const rect=treemapEl.getBoundingClientRect(),W=rect.width||800,H=rect.height||450;
  const sorted=[...items].sort((a,b)=>b.value-a.value);
  const rects=squarify(sorted,0,0,W,H);
  treemapEl.innerHTML='';
  for(const r of rects){
    const div=document.createElement('div');
    div.className='tm-cell'+(r.w<60||r.h<40?' small':'')+(r.w<35||r.h<25?' tiny':'');
    div.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${chgColor(r.chg)}`;
    div.innerHTML=`<span class="tm-label">${r.label}</span><span class="tm-val">${fmtPct(r.chg,1)}</span>`;
    div.setAttribute('tabindex','0');
    div.setAttribute('role','button');
    div.setAttribute('aria-label', `${r.label} 漲跌 ${fmtPct(r.chg,2)}`);
    div.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); div.click(); }
    });
    div.addEventListener('mouseenter',e=>showTT(e,r));
    div.addEventListener('mousemove',moveTT);
    div.addEventListener('mouseleave',hideTT);
    if(r.onClick)div.addEventListener('click',r.onClick);
    if(r.stockId)div.addEventListener('contextmenu',e=>showCtxMenu(e,r.stockId,r.stockName||''));
    treemapEl.appendChild(div);
  }
}
function fmtAmt(v){if(!v)return'—';if(v>=1e8)return(v/1e8).toFixed(0)+'億';if(v>=1e6)return(v/1e6).toFixed(0)+'百萬';return Math.round(v).toLocaleString();}
function showTT(e,r){document.getElementById('ttName').textContent=r.label;const el=document.getElementById('ttChg');el.textContent=fmtPct(r.chg,2);el.className=pctClass(r.chg);document.getElementById('ttMcap').textContent=fmtAmt(r.mcap);document.getElementById('ttVol').textContent=fmtAmt(r.amount);tooltip.classList.add('show');moveTT(e);}
function moveTT(e){tooltip.style.left=(e.clientX+12)+'px';tooltip.style.top=(e.clientY-40)+'px';}
function hideTT(){tooltip.classList.remove('show');}

function showIndustry(){
  document.getElementById('breadcrumb').style.display='none';
  document.getElementById('stkTable').classList.remove('show');
  const items=(hmData.industries||[]).map(ind=>({label:ind.name,value:ind.total_amount,chg:ind.avg_chg,mcap:ind.total_amount,amount:ind.total_amount,onClick:()=>drillDown(ind)}));
  renderTreemap(items);
}
function drillDown(ind){
  document.getElementById('breadcrumb').style.display='flex';
  document.getElementById('bcName').textContent=ind.name;
  renderTreemap((ind.stocks||[]).map(s=>({label:s.id+' '+s.name,value:s.mcap||s.amount,chg:s.chg_pct,mcap:s.mcap,amount:s.amount,stockId:s.id,stockName:s.name,onClick:()=>{location.href='stk.html#'+s.id;}})));
  const tw=document.getElementById('stkTable');tw.classList.add('show');
  document.getElementById('stkTableTitle').textContent=ind.name+' — 成分股明細';
  document.getElementById('stkTableBody').innerHTML=[...(ind.stocks||[])].sort((a,b)=>(b.mcap||b.amount)-(a.mcap||a.amount)).map(s=>`<tr><td>${s.id}</td><td>${s.name}</td><td>${fmtVal(s.close)}</td><td class="${pctClass(s.chg_pct)}">${fmtPct(s.chg_pct,2)}</td><td>${fmtAmt(s.mcap)}</td><td>${fmtAmt(s.amount)}</td></tr>`).join('');
}

async function loadHeatmap(){
  if(!sb)return;
  const{data}=await sb.from('daily_heatmap').select('date,data,created_at').order('date',{ascending:false}).limit(1).single();
  if(!data)return;
  document.getElementById('dateLabel').innerHTML=I('calendar',13)+' 資料日期 '+data.date+(data.created_at?' ・ 更新 '+fmtDT(data.created_at):'');
  hmData=data.data||{};
  showIndustry();
}
function onDataReady(){loadHeatmap();}
window.addEventListener('resize',()=>{if(document.getElementById('breadcrumb').style.display==='none')showIndustry();});

/* === 多清單自選股 + 右鍵選單 === */
const WL_KEY='watchlists';
function getWL(){
  let w=JSON.parse(localStorage.getItem(WL_KEY)||'null');
  if(!w){
    // migrate from old flat array
    const old=JSON.parse(localStorage.getItem('watchlist')||'[]');
    w={'我的自選':old};
    localStorage.setItem(WL_KEY,JSON.stringify(w));
  }
  return w;
}
function saveWL(w){localStorage.setItem(WL_KEY,JSON.stringify(w));
  // keep old key in sync for watchlist.html backward compat
  const all=[...new Set(Object.values(w).flat())];
  localStorage.setItem('watchlist',JSON.stringify(all));
}

const ctxMenu=document.getElementById('ctxMenu');
let ctxTarget=null; // {id,name}

function showCtxMenu(e,sid,sname){
  e.preventDefault(); hideTT();
  ctxTarget={id:sid,name:sname};
  const w=getWL(), lists=Object.keys(w);
  let html=`<div class="ctx-menu-title">加入 ${sid} ${sname} 到自選股</div>`;
  lists.forEach(ln=>{
    const has=w[ln].includes(sid);
    html+=`<div class="ctx-menu-item" onclick="toggleWL('${ln}','${sid}')"><span class="check">${has?I('check',13):''}</span>${ln}</div>`;
  });
  html+=`<div class="ctx-menu-sep"></div>`;
  html+=`<div class="ctx-menu-item" onclick="showNewListInput()" id="ctxNewBtn">${I('plus',13)} 新增清單</div>`;
  html+=`<div class="ctx-menu-input" id="ctxNewInput" style="display:none"><input id="ctxNewName" placeholder="清單名稱" maxlength="20"><button onclick="createList()">建立</button></div>`;
  html+=`<div class="ctx-menu-sep"></div>`;
  html+=`<div class="ctx-menu-item" onclick="location.href='stk.html#${sid}'">${I('external',13)} 開啟個股分析</div>`;
  ctxMenu.innerHTML=html;
  // position
  const mx=e.clientX,my=e.clientY;
  ctxMenu.style.left=Math.min(mx,window.innerWidth-220)+'px';
  ctxMenu.style.top=Math.min(my,window.innerHeight-300)+'px';
  ctxMenu.classList.add('show');
}
function hideCtxMenu(){ctxMenu.classList.remove('show');}
document.addEventListener('click',hideCtxMenu);
document.addEventListener('contextmenu',e=>{if(!e.target.closest('.tm-cell'))hideCtxMenu();});

function toggleWL(listName,sid){
  const w=getWL();
  const idx=w[listName].indexOf(sid);
  const added=idx<0;
  if(idx>=0)w[listName].splice(idx,1); else w[listName].push(sid);
  saveWL(w);
  toast(added?('已加入「'+listName+'」 '+sid):('已從「'+listName+'」移除 '+sid));
  // refresh menu
  if(ctxTarget) showCtxMenu({preventDefault:()=>{},clientX:parseInt(ctxMenu.style.left),clientY:parseInt(ctxMenu.style.top)},ctxTarget.id,ctxTarget.name);
}
function showNewListInput(){
  document.getElementById('ctxNewBtn').style.display='none';
  document.getElementById('ctxNewInput').style.display='flex';
  document.getElementById('ctxNewName').focus();
}
function createList(){
  const name=document.getElementById('ctxNewName').value.trim();
  if(!name)return;
  const w=getWL();
  if(!w[name])w[name]=[];
  if(ctxTarget&&!w[name].includes(ctxTarget.id))w[name].push(ctxTarget.id);
  saveWL(w);
  toast('已建立清單「'+name+'」');
  showCtxMenu({preventDefault:()=>{},clientX:parseInt(ctxMenu.style.left),clientY:parseInt(ctxMenu.style.top)},ctxTarget.id,ctxTarget.name);
}
</script>
