<title>題材管理 — 盤後精選模組</title>
<meta name="description" content="題材概念股管理：新增、編輯、刪除題材與成分股。">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<div id="topbar"></div>

<div class="container" data-page="concepts_admin">
  <div class="page-header">
    <h1 class="page-title">題材管理</h1>
    <p class="page-desc">新增、編輯、刪除題材概念股。變更儲存後，題材概念股頁與首頁「今日題材焦點」立即使用新資料。</p>
  </div>
  <div id="adminApp"><div class="sk-box"><i></i><i></i><i></i><i></i><i></i></div></div>
</div>
<div id="footer"></div>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/init.js"></script>
<script>
let list=[], editKey=null;

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── 登入 / 註冊 ── */
function authHTML(){
  return `<div class="filter-panel" style="max-width:420px;margin:0 auto">
    <div class="filter-group" style="margin-bottom:12px">
      <label>Email</label>
      <input class="wl-modal-input" id="authEmail" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="filter-group" style="margin-bottom:16px">
      <label>密碼</label>
      <input class="wl-modal-input" id="authPass" type="password" placeholder="密碼（至少 6 碼）" autocomplete="current-password">
    </div>
    <p class="auth-msg" id="authMsg" style="font-size:12.5px;color:var(--red);margin-bottom:10px"></p>
    <div class="cfg-actions">
      <button class="btn btn-primary" style="flex:1" onclick="doAuth(false)">登入</button>
      <button class="btn" style="flex:1" onclick="doAuth(true)">註冊</button>
    </div>
    <p style="font-size:11.5px;color:var(--text-secondary);margin-top:12px;line-height:1.7">沒有帳號請先按「註冊」建立。若 Supabase 開啟 Email 驗證，需先去信箱點驗證連結；也可在 Supabase Dashboard 關閉「Confirm email」。</p>
  </div>`;
}
async function doAuth(isSignup){
  const email=document.getElementById('authEmail').value.trim();
  const pass=document.getElementById('authPass').value;
  const msg=document.getElementById('authMsg');
  if(!email||!pass){ msg.textContent='請填 Email 與密碼'; return; }
  try{
    const r=isSignup ? await sb.auth.signUp({email, password:pass})
                     : await sb.auth.signInWithPassword({email, password:pass});
    if(r.error) throw r.error;
    msg.textContent='';
    render();
  }catch(e){
    msg.textContent=e.message||'登入失敗';
  }
}
async function logout(){
  await sb.auth.signOut();
  render();
}

/* ── 題材 CRUD ── */
async function loadList(){
  const {data}=await sb.from('concepts').select('*').order('sort',{ascending:true});
  list=data||[];
  renderAdmin();
}
function listHTML(){
  if(!list.length) return '<div class="empty-msg">尚無題材，按「新增題材」建立第一組。</div>';
  return `<div class="table-wrap"><table>
    <thead><tr><th>排序</th><th>Key</th><th>名稱</th><th>描述</th><th>檔數</th><th>層級</th><th></th></tr></thead>
    <tbody>${list.map(c=>`
      <tr>
        <td>${c.sort||0}</td>
        <td class="mono">${esc(c.key)}</td>
        <td>${esc(c.title)}</td>
        <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.desc||'')}</td>
        <td>${(c.ids||[]).length}</td>
        <td>${c.tier||0}</td>
        <td>
          <button class="btn btn-sm" onclick="openForm('${esc(c.key)}')">編輯</button>
          <button class="btn btn-sm btn-danger" onclick="del('${esc(c.key)}')">刪除</button>
        </td>
      </tr>`).join('')}
    </tbody></table></div>`;
}
function renderAdmin(){
  document.getElementById('adminApp').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <span class="date-label">${list.length} 組題材</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="openForm()">＋ 新增題材</button>
        <button class="btn" onclick="logout()">登出</button>
      </div>
    </div>
    ${listHTML()}`;
}
function openForm(key){
  const c=key?list.find(x=>x.key===key):null;
  editKey=key||null;
  const ov=document.createElement('div');
  ov.className='modal-overlay'; ov.id='cfModal'; ov.style.display='flex';
  ov.innerHTML=`<div class="modal" style="max-width:640px">
    <button class="modal-close" onclick="document.getElementById('cfModal').remove()" aria-label="關閉">${I('x',16)}</button>
    <div class="modal-title">${c?'編輯':'新增'}題材</div>
    <div class="filter-grid" style="grid-template-columns:1fr 1fr">
      <div class="filter-group"><label>Key（唯一代號，英文小寫）</label><input class="wl-modal-input" id="fKey" value="${c?esc(c.key):''}" ${c?'readonly':''} placeholder="例如 ai_server"></div>
      <div class="filter-group"><label>名稱</label><input class="wl-modal-input" id="fTitle" value="${c?esc(c.title):''}" placeholder="例如 AI 伺服器"></div>
      <div class="filter-group" style="grid-column:1/-1"><label>描述</label><input class="wl-modal-input" id="fDesc" value="${c?esc(c.desc||''):''}" placeholder="一行描述"></div>
      <div class="filter-group" style="grid-column:1/-1"><label>成分股股號（逗號分隔）</label><input class="wl-modal-input" id="fIds" value="${c?esc((c.ids||[]).join(',')):''}" placeholder="例如 2330,3711,2449"></div>
      <div class="filter-group"><label>層級 tier（0上游/1中游/2下游）</label><input class="wl-modal-input" id="fTier" type="number" min="0" max="2" value="${c?c.tier||0:0}"></div>
      <div class="filter-group"><label>排序（數字小在前）</label><input class="wl-modal-input" id="fSort" type="number" value="${c?c.sort||0:0}"></div>
      <div class="filter-group"><label>上游題材 key（逗號分隔）</label><input class="wl-modal-input" id="fUp" value="${c?esc((c.up||[]).join(',')):''}" placeholder="例如 cowos,ic_design"></div>
      <div class="filter-group"><label>下游題材 key（逗號分隔）</label><input class="wl-modal-input" id="fDown" value="${c?esc((c.down||[]).join(',')):''}" placeholder="例如 ai_server,robot"></div>
    </div>
    <div class="cfg-actions">
      <button class="btn" onclick="document.getElementById('cfModal').remove()">取消</button>
      <button class="btn btn-primary" onclick="save()">儲存</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
}
async function save(){
  const g=id=>document.getElementById(id).value.trim();
  const row={
    key:g('fKey'), title:g('fTitle'), desc:g('fDesc'),
    ids:g('fIds').split(',').map(s=>s.trim()).filter(Boolean),
    tier:parseInt(g('fTier')||'0',10)||0,
    sort:parseInt(g('fSort')||'0',10)||0,
    up:g('fUp').split(',').map(s=>s.trim()).filter(Boolean),
    down:g('fDown').split(',').map(s=>s.trim()).filter(Boolean),
  };
  if(!row.key||!row.title){ toast('Key 與名稱必填'); return; }
  try{
    if(editKey){
      await sb.from('concepts').update(row).eq('key', editKey);
    }else{
      await sb.from('concepts').insert(row);
    }
    document.getElementById('cfModal').remove();
    toast('已儲存 '+row.title);
    await loadList();
  }catch(e){ toast('儲存失敗：'+e.message); }
}
async function del(key){
  const c=list.find(x=>x.key===key);
  if(!confirm('確定刪除題材「'+c.title+'」？此操作無法復原。')) return;
  await sb.from('concepts').delete().eq('key', key);
  toast('已刪除 '+c.title);
  await loadList();
}

/* ── 啟動 ── */
async function render(){
  const app=document.getElementById('adminApp');
  if(!sb){ app.innerHTML='<div class="empty-msg">系統載入中...</div>'; return; }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    app.innerHTML=authHTML();
    document.getElementById('authPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doAuth(false); });
    return;
  }
  try{ await loadList(); }
  catch(e){ app.innerHTML='<div class="empty-msg">讀取失敗：'+esc(e.message||'')+'（請確認已建立 concepts 資料表與 RLS）</div>'; }
}
function onDataReady(){ render(); }
</script>
