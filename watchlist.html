<title>自選股 — 盤後精選模組</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="js/auth.css">
<style>
:root {
  --ink: #1C2127; --text: #3B3F45; --text-secondary: #6B7280;
  --surface: #F5F2EC; --card: #FFFFFF; --border: #DDD8D0; --border-light: #EBE7E0;
  --gold: #B8860B; --gold-soft: rgba(184,134,11,0.10);
  --teal: #3A7D7B; --teal-soft: rgba(58,125,123,0.08);
  --green: #4A8B6E; --red: #C0544F;
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --radius: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #E8E4DC; --text: #C8C4BC; --text-secondary: #8B8780;
    --surface: #141618; --card: #1E2024; --border: #2E3036; --border-light: #252830;
    --gold: #D4A840; --gold-soft: rgba(212,168,64,0.12);
    --teal: #5AADAB; --teal-soft: rgba(90,173,171,0.10);
    --green: #6BB88E; --red: #E07070;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  }
}
:root[data-theme="dark"] {
  --ink: #E8E4DC; --text: #C8C4BC; --text-secondary: #8B8780;
  --surface: #141618; --card: #1E2024; --border: #2E3036; --border-light: #252830;
  --gold: #D4A840; --gold-soft: rgba(212,168,64,0.12);
  --teal: #5AADAB; --teal-soft: rgba(90,173,171,0.10);
  --green: #6BB88E; --red: #E07070;
  --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow)}
.topbar .brand{font-family:var(--font-display);font-size:18px;color:var(--ink);letter-spacing:-0.02em;white-space:nowrap;text-decoration:none}
.topbar .brand span{color:var(--gold)}
.topbar .spacer{flex:1}
.nav-links{display:flex;gap:12px}
.nav-links a{font-size:13px;color:var(--text-secondary);text-decoration:none;padding:4px 8px;border-radius:var(--radius)}
.nav-links a:hover,.nav-links a.active{color:var(--gold);background:var(--gold-soft)}
.container{max-width:960px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:20px}
.page-header h2{font-family:var(--font-display);font-size:22px;color:var(--ink);margin-bottom:6px}
.page-header p{font-size:13px;color:var(--text-secondary)}
.add-bar{display:flex;gap:8px;align-items:center}
.add-bar input{flex:1;max-width:240px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text);font-size:14px;font-family:var(--font-mono)}
.add-bar button{padding:8px 16px;border:none;border-radius:var(--radius);background:var(--gold);color:white;font-size:13px;font-weight:600;cursor:pointer}
.add-bar button:hover{opacity:0.9}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
thead th{background:var(--card);padding:10px 12px;font-size:11px;font-weight:600;color:var(--text-secondary);text-align:right;white-space:nowrap;border-bottom:2px solid var(--border);letter-spacing:.03em}
thead th:first-child,thead th:nth-child(2){text-align:left}
tbody td{padding:9px 12px;font-size:13px;text-align:right;border-bottom:1px solid var(--border-light);white-space:nowrap;font-family:var(--font-mono)}
tbody td:first-child,tbody td:nth-child(2){text-align:left;font-family:var(--font-body)}
tbody tr:hover{background:var(--gold-soft)}
tbody tr{cursor:pointer}
.up{color:var(--red)}.dn{color:var(--green)}
.btn-del{background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:var(--radius)}
.btn-del:hover{color:var(--red);background:rgba(192,84,79,0.1)}
.empty-msg{text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:14px}
.wl-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wl-tab{font-size:13px;padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text-secondary);cursor:pointer;position:relative}
.wl-tab.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.wl-tab .del{display:none;position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center;cursor:pointer}
.wl-tab:hover .del{display:block}
.wl-add-tab{font-size:13px;padding:6px 10px;border:1px dashed var(--border);border-radius:var(--radius);background:transparent;color:var(--text-secondary);cursor:pointer}
.wl-add-tab:hover{border-color:var(--gold);color:var(--gold)}
.evt-badge{display:inline-block;background:var(--gold-soft);color:var(--gold);font-size:10px;padding:1px 6px;border-radius:99px;margin-left:4px;vertical-align:middle;font-family:var(--font-body)}
.evt-alert-bar{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--ink);margin-bottom:12px;line-height:1.7}
.evt-alert-bar strong{color:var(--gold)}
.footer{text-align:center;padding:32px 16px;font-size:12px;color:var(--text-secondary);line-height:1.8}
@media(max-width:640px){.topbar{padding:10px 12px;gap:8px}thead th,tbody td{padding:8px;font-size:11px}.container{padding:16px 8px 60px}}
.nav-toggle{display:none;background:none;border:1px solid var(--border);border-radius:var(--radius);font-size:20px;padding:4px 10px;cursor:pointer;color:var(--text)}
@media(max-width:768px){.nav-toggle{display:block}.nav-links{display:none;width:100%;order:99}.nav-links.show{display:flex;flex-wrap:wrap}.topbar{flex-wrap:wrap}}
</style>

<div class="container">
  <div class="page-header">
    <h2>★ 自選股</h2>
    <p>加入常關注的股票，一頁查看最新數據。資料儲存在瀏覽器中，換裝置需重新加入。</p>
  </div>
  <div class="wl-tabs" id="wlTabs"></div>
  <div class="add-bar">
    <input type="text" id="addInput" placeholder="輸入股號，如 2330" maxlength="10">
    <button onclick="addStock()">加入</button>
  </div>
  <div id="app"><div class="empty-msg">尚未加入自選股</div></div>
</div>
<div class="footer">盤後精選模組 — 本站僅整理公開資訊，不構成投資建議，亦非投顧服務。<br>⛰️ 每日自動更新：盤後 15:00（第一次）、22:00（第二次）</div>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
const WL_KEY='watchlists';
let curList='我的自選';

function getWL(){
  let w=JSON.parse(localStorage.getItem(WL_KEY)||'null');
  if(!w){const old=JSON.parse(localStorage.getItem('watchlist')||'[]');w={'我的自選':old};localStorage.setItem(WL_KEY,JSON.stringify(w));}
  return w;
}
function saveWL(w){localStorage.setItem(WL_KEY,JSON.stringify(w));
  const all=[...new Set(Object.values(w).flat())];
  localStorage.setItem('watchlist',JSON.stringify(all));
}
function getList(){return getWL()[curList]||[];}

function renderTabs(){
  const w=getWL(), names=Object.keys(w);
  document.getElementById('wlTabs').innerHTML=names.map(n=>{
    const active=n===curList?' active':'';
    const canDel=names.length>1?`<span class="del" onclick="event.stopPropagation();delList('${n.replace(/'/g,"\\'")}')">✕</span>`:'';
    return `<button class="wl-tab${active}" onclick="switchList('${n.replace(/'/g,"\\'")}')">${n}${canDel}</button>`;
  }).join('')+`<button class="wl-add-tab" onclick="newList()">＋ 新增清單</button>`;
}
function switchList(n){curList=n;renderTabs();loadWatchlist();}
function newList(){
  const name=prompt('輸入新清單名稱：');
  if(!name||!name.trim())return;
  const w=getWL();
  if(!w[name.trim()])w[name.trim()]=[];
  saveWL(w);curList=name.trim();renderTabs();loadWatchlist();
}
function delList(n){
  if(!confirm(`確定刪除清單「${n}」？`))return;
  const w=getWL();delete w[n];saveWL(w);
  curList=Object.keys(w)[0]||'我的自選';
  renderTabs();loadWatchlist();
}

function addStock(){
  const input=document.getElementById('addInput');
  const sid=input.value.trim().toUpperCase();
  if(!sid)return;
  const w=getWL();
  if(!w[curList])w[curList]=[];
  if(w[curList].includes(sid)){input.value='';return;}
  w[curList].push(sid);
  saveWL(w);input.value='';loadWatchlist();
}
document.getElementById('addInput').addEventListener('keydown',e=>{if(e.key==='Enter')addStock();});

function removeStock(sid){
  const w=getWL();
  w[curList]=(w[curList]||[]).filter(s=>s!==sid);
  saveWL(w);loadWatchlist();
}

function fmt(v){return typeof v==='number'?v.toLocaleString('zh-TW'):v;}

// 事件提示：抓除權息資料，比對自選股
let eventMap={}; // stock_id → [{type,date,detail}]
async function fetchEvents(){
  eventMap={};
  try{
    const now=new Date();
    const rocY=now.getFullYear()-1911;
    const mm=String(now.getMonth()+1).padStart(2,'0');
    // 抓本月+下月除權息
    const months=[`${rocY}${mm}`];
    const nm=now.getMonth()+2;
    if(nm<=12) months.push(`${rocY}${String(nm).padStart(2,'0')}`);
    else months.push(`${rocY+1}01`);

    for(const ym of months){
      const r=await fetch(`/api/twse-proxy?type=dividend&date=${ym}`);
      const j=await r.json();
      if(j.data&&j.data.length){
        j.data.forEach(row=>{
          const sid=(row[0]||'').trim();
          const name=(row[1]||'').trim();
          const dateStr=(row[5]||row[2]||'').trim(); // 除權息日期
          const detail=row[6]?`配息${row[6]}元`:(row[7]?`配股${row[7]}`:name);
          if(!sid)return;
          if(!eventMap[sid])eventMap[sid]=[];
          eventMap[sid].push({type:'除權息',date:dateStr,detail});
        });
      }
    }
  }catch(e){/* silent */}
}

function eventBadges(sid){
  const evts=eventMap[sid];
  if(!evts||!evts.length)return'';
  return evts.map(e=>`<span class="evt-badge" title="${e.date} ${e.detail}">📅 ${e.type}</span>`).join('');
}

async function loadWatchlist(){
  const list=getList();
  const app=document.getElementById('app');
  if(!list.length){app.innerHTML='<div class="empty-msg">尚未加入自選股，在上方輸入股號加入</div>';return;}
  if(!sb){app.innerHTML='<div class="empty-msg">系統載入中...</div>';return;}

  // 同時抓股票資料和事件
  const [metricsRes]=await Promise.all([
    sb.from('stock_metrics')
      .select('stock_id,name,date,close,change_pct,volume,ma5,ma20,ma60,rev_mom,rev_yoy,foreign_consec_days,trust_consec_days')
      .in('stock_id',list),
    Object.keys(eventMap).length?Promise.resolve():fetchEvents()
  ]);
  const{data,error}=metricsRes;
  if(error||!data){app.innerHTML='<div class="empty-msg">⚠ 載入失敗</div>';return;}

  const map={};data.forEach(d=>{map[d.stock_id]=d;});

  // 事件提示橫幅
  const alerts=list.filter(sid=>eventMap[sid]&&eventMap[sid].length);
  const alertHtml=alerts.length?`<div class="evt-alert-bar">📢 近期事件：${alerts.map(sid=>{
    const d=map[sid];const name=d?d.name:sid;
    return eventMap[sid].map(e=>`<strong>${sid} ${name}</strong> ${e.type}(${e.date} ${e.detail})`).join('、');
  }).join('；')}</div>`:'';

  const rows=list.map(sid=>{
    const d=map[sid];
    if(!d)return`<tr><td>${sid}</td><td>—</td><td colspan="9" style="text-align:center;color:var(--text-secondary)">無資料</td><td><button class="btn-del" onclick="event.stopPropagation();removeStock('${sid}')" title="移除">✕</button></td></tr>`;
    const cls=(d.change_pct||0)>=0?'up':'dn';
    const chg=d.change_pct!=null?(d.change_pct>=0?'+':'')+d.change_pct.toFixed(2)+'%':'—';
    const fc=d.foreign_consec_days||0,tc=d.trust_consec_days||0;
    const fcCls=fc>0?'up':fc<0?'dn':'',tcCls=tc>0?'up':tc<0?'dn':'';
    const badges=eventBadges(sid);
    return`<tr onclick="location.href='stk.html#${sid}'">
      <td>${sid}</td><td>${d.name||'—'}${badges?' '+badges:''}</td>
      <td>${d.close!=null?fmt(d.close):'—'}</td>
      <td class="${cls}">${chg}</td>
      <td>${d.volume!=null?fmt(d.volume):'—'}</td>
      <td>${d.ma5!=null?d.ma5.toFixed(1):'—'}</td>
      <td>${d.ma20!=null?d.ma20.toFixed(1):'—'}</td>
      <td class="${fcCls}">${fc>0?'連買'+fc+'日':fc<0?'連賣'+Math.abs(fc)+'日':'—'}</td>
      <td class="${tcCls}">${tc>0?'連買'+tc+'日':tc<0?'連賣'+Math.abs(tc)+'日':'—'}</td>
      <td>${d.rev_yoy!=null?(d.rev_yoy>=0?'+':'')+d.rev_yoy.toFixed(1)+'%':'—'}</td>
      <td><button class="btn-del" onclick="event.stopPropagation();removeStock('${sid}')" title="移除">✕</button></td>
    </tr>`;
  }).join('');

  app.innerHTML=alertHtml+`<table>
    <thead><tr><th>股號</th><th>名稱</th><th>收盤價</th><th>漲跌%</th><th>成交張</th><th>MA5</th><th>MA20</th><th>外資動向</th><th>投信動向</th><th>營收YoY</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function onAuthReady(){renderTabs();loadWatchlist();}
</script>
